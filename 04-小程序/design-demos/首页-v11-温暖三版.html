<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · v11 · 温暖三版</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0806;font-family:var(--body);color:var(--paper);
     display:flex;gap:38px;padding:52px 40px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 40px;background:#0a0806ee;
     border-bottom:1px solid #1f1a14;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.6;max-width:372px}
.cap b{color:var(--brass);font-weight:500}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:372px;height:806px;border-radius:42px;position:relative;overflow:hidden;
    border:1px solid #241e18;box-shadow:0 26px 60px #0008;background:#0C0906}
.in{position:relative;height:100%;padding:38px 28px 20px;display:flex;flex-direction:column;
    text-align:center}
.day{font-size:10.5px;letter-spacing:.42em;color:var(--paper3);opacity:.68;text-indent:.42em}
.dish{height:230px;margin:10px 0 0;position:relative}
.dish svg{position:absolute;inset:0;width:100%;height:100%}

/* ── A 光晕：环境的温暖。插画本身不动，光从它背后和边缘漫出来 ── */
.glow .dish::before{content:'';position:absolute;left:50%;top:38px;transform:translateX(-50%);
  width:320px;height:190px;border-radius:50%;filter:blur(48px);
  background:radial-gradient(circle,#F0BE6a72 0%,#D08A4a38 46%,transparent 76%)}
.glow .food{filter:drop-shadow(0 0 10px #E8B96066) drop-shadow(0 0 26px #C9884a44)}

/* ── B 贴纸：手作的温暖。一圈暖米色描边 + 落影 + 轻微歪 ── */
.sticker .dish{transform:rotate(-1.6deg)}
.sticker .food{
  /* 四向 drop-shadow 叠出描边：不规则形状加轮廓最省的做法 */
  filter:drop-shadow(1.6px 0 0 #EFE3C8) drop-shadow(-1.6px 0 0 #EFE3C8)
         drop-shadow(0 1.6px 0 #EFE3C8) drop-shadow(0 -1.6px 0 #EFE3C8)
         drop-shadow(0 5px 7px #00000088)}
.sticker .dish::before{content:'';position:absolute;left:50%;top:52px;transform:translateX(-50%);
  width:280px;height:160px;border-radius:50%;filter:blur(44px);
  background:radial-gradient(circle,#C9884a2c 0%,transparent 72%)}

/* ── C 贴纸 + 光晕 ── */
.both .dish{transform:rotate(-1.6deg)}
.both .food{
  filter:drop-shadow(1.6px 0 0 #EFE3C8) drop-shadow(-1.6px 0 0 #EFE3C8)
         drop-shadow(0 1.6px 0 #EFE3C8) drop-shadow(0 -1.6px 0 #EFE3C8)
         drop-shadow(0 5px 7px #00000088) drop-shadow(0 0 16px #E8B96055)}
.both .dish::before{content:'';position:absolute;left:50%;top:38px;transform:translateX(-50%);
  width:320px;height:190px;border-radius:50%;filter:blur(48px);
  background:radial-gradient(circle,#F0BE6a66 0%,#D08A4a30 46%,transparent 76%)}

.lbl{font-size:10.5px;letter-spacing:.36em;color:var(--paper2);opacity:.8;text-indent:.36em}
.w{font-family:var(--hand);font-size:42px;color:#FBEDCF;line-height:1.2;margin:6px 0 0;
   text-shadow:0 0 30px #E8C87A3a}
.go{font-size:12.5px;color:var(--paper3);margin:11px 0 0;letter-spacing:.06em}
.sp{flex:1;min-height:18px;max-height:30px}
.sp2{flex:1.4;min-height:34px}
.zt{font-size:10.5px;letter-spacing:.32em;color:var(--paper2);opacity:.78;text-indent:.32em;padding:0 0 13px}
.cells{display:flex;align-items:center;justify-content:center;gap:25px;height:42px}
.sh{display:block;flex:none}
.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.drop{border-radius:50% 50% 50% 8px;transform:rotate(-12deg)}
.blob{border-radius:58% 42% 46% 54% / 52% 56% 44% 48%}
.dot{border-radius:50%}
.empty{border:1px solid rgba(244,237,227,.15);background:transparent!important}
.ways a{display:block;font-size:16.5px;color:var(--paper2);padding:12px 0;letter-spacing:.04em}
.live{font-size:13px;color:var(--jade);opacity:.85;letter-spacing:.05em;margin-top:28px}
.main .t{font-size:23px;color:#FFF4E2;letter-spacing:.1em}
.main .ln{width:134px;height:1px;margin:15px auto 0;
          background:linear-gradient(90deg,transparent,#C9A063,transparent)}
.main .s{font-size:13px;color:var(--paper3);margin:14px 0 0}
.foot{display:flex;justify-content:center;gap:30px;padding:22px 0 0}
.foot span{font-size:12.5px;color:var(--clay);opacity:.82}
</style>

<div class=lab>v11 · <b>温暖三版</b>　<span style="color:#5a5147">｜插画本体（B 加法颗粒）完全不动，只加外层效果｜A 光晕＝环境的暖　B 贴纸＝手作的暖　C 两者叠</span></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="dust" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
      <feComponentTransfer in="ng" result="nc">
        <feFuncA type="discrete" tableValues="0 0 0 0 .35 .7 1"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="nc" operator="in"/>
    </filter>
    <path id="e1" d="M92 122 C86 100, 112 84, 152 80 C200 75, 248 85, 254 107
                     C260 129, 234 146, 188 151 C136 156, 98 144, 92 122 Z"/>
    <path id="e2" d="M112 116 C108 102, 130 93, 162 91 C196 89, 220 96, 224 109
                     C228 122, 204 131, 170 133 C134 135, 116 128, 112 116 Z"/>
    <path id="e3" d="M196 126 C212 119, 238 119, 247 128 C254 137, 236 146, 212 146
                     C194 146, 187 135, 196 126 Z"/>
    <g id="geo">
      <!-- 几何配重：印在底上，不参与贴纸描边 -->
      <path d="M40 184 h30 v20 h26 v20 h-56 v-20 h-26 z" fill="#C87A4A" opacity=".42"/>
      <path d="M282 144 A20 20 0 1 1 282 184" fill="none" stroke="#C9563C" stroke-width="2.4"
            stroke-linecap="round" opacity=".55"/>
      <g fill="#A2957F" opacity=".5">
        <circle cx="52" cy="72" r="2"/><circle cx="52" cy="81" r="2"/><circle cx="52" cy="90" r="2"/>
      </g>
      <g stroke="#C9A063" stroke-width="1.2" opacity=".34" stroke-linecap="round">
        <path d="M244 220 h52"/><path d="M244 226 h32"/>
      </g>
    </g>
    <g id="food">
      <!-- 蛋羹：实心 + 加法颗粒 -->
      <use href="#e1" fill="#D9BC7E"/><use href="#e2" fill="#F0DFA8"/><use href="#e3" fill="#C4A05C"/>
      <g filter="url(#dust)" opacity=".5">
        <use href="#e1" fill="#FFF8E2"/><use href="#e2" fill="#FFFDF2"/><use href="#e3" fill="#FFEFC8"/>
      </g>
      <g filter="url(#dust)" opacity=".2" transform="translate(3,2)">
        <use href="#e1" fill="#8A6A32"/><use href="#e2" fill="#A88A46"/>
      </g>
      <!-- 葱花 · 酱油 -->
      <rect x="136" y="104" width="9" height="5" rx="1" fill="#8CAE7A" transform="rotate(-12 140 106)"/>
      <rect x="180" y="118" width="7" height="4.5" rx="1" fill="#7C9E6C" transform="rotate(20 183 120)"/>
      <rect x="214" y="100" width="8" height="4.5" rx="1" fill="#8CAE7A" transform="rotate(-8 218 102)"/>
      <circle cx="160" cy="126" r="2.4" fill="#7C9E6C"/>
      <ellipse cx="122" cy="130" rx="7" ry="3.4" fill="#8A5F3A" opacity=".8"/>
      <!-- 碗：浅色弧，不闭合 -->
      <path d="M74 116 C76 176, 124 210, 174 208 C226 206, 264 170, 266 110"
            fill="none" stroke="#E0CFAE" stroke-width="3" stroke-linecap="round" opacity=".78"/>
      <path d="M87 101 C120 90, 236 88, 259 99"
            fill="none" stroke="#BCAE92" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
    </g>
  </defs>
</svg>

<script>
const BODY = `
  <div class=lbl>今天的滋味</div>
  <div class=w>蒸蛋</div>
  <div class=go>看看这些天的滋味</div>
  <div class=sp></div>
  <div class=zt>今天怎么样</div>
  <div class=cells>
    <i class="sh star" style="width:38px;height:38px;background:#F2913F"></i>
    <i class="sh drop" style="width:27px;height:27px;background:#E8C558"></i>
    <i class="sh blob" style="width:34px;height:34px;background:#5FBF95"></i>
    <i class="sh drop empty" style="width:25px;height:25px"></i>
    <i class="sh blob empty" style="width:30px;height:30px"></i>
    <i class="sh dot empty" style="width:22px;height:22px"></i>
  </div>
  <div class=sp></div>
  <div class=ways><a>找个人说说话</a><a>昨晚睡得怎么样</a></div>
  <div class=live>此刻 23 人在 · 20:30 一起坐着</div>
  <div class=sp2></div>
  <div class=main>
    <div class=t>我现在不太好</div><div class=ln></div>
    <div class=s>试试含一口水，慢慢感受</div>
  </div>
  <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>`;

const DISH = `<div class=dish><svg viewBox="0 0 330 230"><use href="#geo"/><g class=food><use href="#food"/></g></svg></div>`;

const V = [
  ['glow','A · 光晕','插画本体不动，光从背后和边缘漫出来。<b>环境的温暖</b>——像这碗蛋摆在一盏暖灯下。'],
  ['sticker','B · 贴纸','一圈 1.6px 暖米色描边（不用纯白）＋ 落影 ＋ 歪 1.6°。<b>手作的温暖</b>——像手账里贴的一张。'],
  ['both','C · 贴纸＋光晕','描边给实体感，光晕给氛围。两样都要的代价是画面更满，也更"设计过"。'],
];
document.write(V.map(([c,t,d])=>`
<div class="wrap ${c}">
  <div class=ph><div class=in>
    <div class=day>八月廿七</div>
    ${DISH}
    ${BODY}
  </div></div>
  <div class=cap><b>${t}</b><br><i>${d}</i></div>
</div>`).join(''));
</script>
</html>
