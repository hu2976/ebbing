<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>新乙 · 整页是纸</title>
<style>
/* ══════════════════════════════════════════════════════════════
   方向乙 · 整页是纸

   温馨从哪来：温馨在实物世界里就是纸和手写，不是深色发光。
   所以这版把整屏交给纸——插画不再是「贴在暗里的一张卡」，而是直接印在页上，
   颗粒质感发挥到最好（你写过：纯白让颗粒读成噪点，米白才对）。

   骨架和甲完全不同：不是「卡在上、文字在下」的栏，而是一本手账的页。
     · 日期竖排在左页边，像日记本的装订侧
     · 内容不等距、不等宽——手账不是网格
     · 入口是手写的一道下划线 + 手画的箭头，不是 chevron
     · 分区靠手绘横线，不靠框

   刻意避开「米白 + 衬线 + 陶土」这个组合（那是最常见的 AI 默认长相）：
   标题用黑体不用衬线，主 accent 用靛蓝不用陶土，砖红只留给急救线。
   套色只有三个，且只出现在色块上，不出现在文字上——riso 印刷就是这样。

   夜里怎么办：纸变暗（#2A2521）但仍然是纸，不是变成黑屏。见第四屏。
   ══════════════════════════════════════════════════════════════ */

:root{
  --pg:#F2EBDF;           /* 纸 */
  --pg2:#EAE1D2;          /* 纸的暗侧 */
  --ink:#2B2520;          /* 墨 */
  --ink2:#6E655A;         /* 次 */
  --ink3:#9C9080;         /* 注 */
  --ind:#2F4858;          /* 靛：主 accent */
  --brick:#B8563C;        /* 砖红：只给急救 */
  --mustard:#D8A03C;      /* 芥黄：只给色块 */
  --night:#2A2521;        /* 夜里的纸 */
  --night-ink:#E4DAC9;
  --sans:-apple-system,"PingFang SC","HarmonyOS Sans SC",sans-serif;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#171310; color:#E9DFD1; font-family:var(--sans);
  padding:56px 40px 90px; -webkit-font-smoothing:antialiased;
}
.hd{ max-width:860px; margin:0 auto 46px; }
.hd h1{ font-size:26px; font-weight:600; }
.hd .sub{ color:#9A8F80; font-size:14.5px; line-height:1.8; margin-top:12px; }
.hd .sub b{ color:#D8A03C; font-weight:500; }
.rail{ display:flex; gap:30px; justify-content:center; flex-wrap:wrap; }
.unit{ width:390px; }
.unit > figcaption{ font-family:var(--mono); font-size:11.5px; color:#6E6558;
                    margin-top:12px; letter-spacing:.04em; }

/* ── 一页纸 ───────────────────────────────────────────────── */
.pg{
  width:390px; height:844px; border-radius:38px; overflow:hidden;
  position:relative; background:var(--pg); color:var(--ink);
  display:flex; flex-direction:column;
  padding:72px 28px 30px 58px;      /* 左边留出页边给竖排日期 */
}
/* 纸不是纯色：极淡的不匀 + 一层纤维。纯色底是廉价感最大的来源。 */
.pg::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:
    radial-gradient(90% 55% at 12% 4%,   rgba(255,255,255,.5), transparent 60%),
    radial-gradient(80% 60% at 96% 92%,  rgba(155,140,116,.22), transparent 62%),
    repeating-linear-gradient(93deg, rgba(140,124,100,.045) 0 1px,
                              transparent 1px 4px);
}
.pg > *{ position:relative; z-index:1; }
/* 装订侧：竖排日期 + 一道靛线 */
.spine{
  position:absolute; left:0; top:0; bottom:0; width:34px; z-index:2;
  border-right:1px solid rgba(47,72,88,.16);
  display:flex; align-items:flex-start; justify-content:center; padding-top:74px;
}
.spine span{
  writing-mode:vertical-rl; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.22em; color:var(--ink3);
}
.spine .mk{ position:absolute; top:34px; left:50%; transform:translateX(-50%);
            width:7px; height:7px; background:var(--ind); border-radius:50%; }

/* ── 纸上的字 ─────────────────────────────────────────────── */
.h{ font-size:35px; font-weight:600; line-height:1.3; letter-spacing:-.005em; }
.h.sm{ font-size:24px; }
.name{ font-family:var(--hand); font-size:50px; line-height:1.05; letter-spacing:.06em; }
.p{ font-size:15px; line-height:1.9; color:var(--ink2); }
.note{ font-size:12.5px; line-height:1.8; color:var(--ink3); }
.eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--ink3); }
.quote{ font-family:var(--hand); font-size:21px; line-height:1.75; letter-spacing:.04em; }
.live{ font-family:var(--mono); font-size:12px; color:var(--ind); letter-spacing:.06em; }

/* ── 手绘横线：不是 1px 直线，两端细中间粗，像笔画过 ────────── */
.rule{ height:2px; border-radius:2px; background:
       linear-gradient(90deg, rgba(43,37,32,0) 0%, rgba(43,37,32,.20) 12%,
       rgba(43,37,32,.26) 52%, rgba(43,37,32,.10) 86%, rgba(43,37,32,0) 100%); }

/* ── 入口 = 手写下划线 + 手画箭头。不是 chevron，不是按钮 ───── */
.go{ display:inline-flex; align-items:baseline; gap:9px; font-size:17px;
     position:relative; padding-bottom:7px; align-self:flex-start; }
.go::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px; border-radius:2px;
  background:linear-gradient(90deg, rgba(47,72,88,.42) 0%, rgba(47,72,88,.34) 66%,
             rgba(47,72,88,0) 100%);
}
.go i{ font-style:normal; color:var(--ind); font-size:14px; }
.go.dim{ font-size:14.5px; color:var(--ink2); }
.go.dim::after{ background:linear-gradient(90deg, rgba(110,101,90,.26),
                rgba(110,101,90,0) 82%); }
/* 主入口：芥黄的一块底，像用马克笔涂过一道 */
.go.main{ font-size:27px; font-weight:600; padding:2px 12px 8px 6px; margin-left:-6px; }
.go.main::before{
  content:""; position:absolute; left:0; right:0; bottom:4px; height:16px; z-index:-1;
  background:linear-gradient(90deg, rgba(216,160,60,.42), rgba(216,160,60,.16) 78%,
             rgba(216,160,60,0));
  border-radius:2px;
}
.go.main::after{ background:linear-gradient(90deg, var(--mustard),
                 rgba(216,160,60,.3) 70%, rgba(216,160,60,0)); }
/* 并列的选择：手账里就是一条一条写下来的，前面一个小方块当项目符号 */
.opt{ display:flex; align-items:baseline; gap:12px; font-size:22px; font-weight:500; }
.opt em{ width:11px; height:11px; flex:none; border-radius:1px; background:var(--c);
         transform:translateY(-3px) rotate(-6deg); font-style:normal; }

/* ── 插画直接印在页上，不装进卡 ───────────────────────────── */
.art{ display:block; width:100%; }
.art svg{ display:block; width:100%; height:auto; }
.art.wide{ margin:0 -14px 0 -30px; width:calc(100% + 44px); }  /* 出血到页边 */
/* 首页不放插画。试过裁一条，但红薯主体在 SVG 下半部，裁完只剩几个点。
   首页那一栏本来就是入口——手写大字加六张色票已经够，整幅插画留给 taste-card。 */

/* ── 六格：六张小色票，贴上去的（手账里就是贴纸） ──────────── */
.chips{ display:flex; gap:9px; }
.chip{ width:26px; height:34px; border-radius:1px; flex:none;
       border:1px solid rgba(43,37,32,.13); background:rgba(255,255,255,.4); }
.chip.on{ border-color:transparent; background:var(--c);
          box-shadow:0 1px 3px -1px rgba(43,37,32,.34); }
.chip.on:nth-child(odd){ transform:rotate(-2.5deg) }
.chip.on:nth-child(even){ transform:rotate(1.8deg) }
.chip.next{ border-style:dashed; border-color:rgba(47,72,88,.42); }

/* ── 涨潮：纸上的水是一道水彩的边缘线，不是一块灰色 ───────────
   水彩的特征就在那道边——颜料退干时在边缘积起来一圈。
   面要淡到几乎没有，线要看得见。 */
.wash{ position:absolute; left:0; right:0; bottom:0; height:216px; z-index:0;
       pointer-events:none; }
.wash::before{
  content:""; position:absolute; left:-16%; right:-16%; top:22px; bottom:-80px;
  border-radius:48% 52% 0 0 / 62px 62px 0 0;
  background:linear-gradient(180deg, rgba(47,72,88,.045) 0%, rgba(47,72,88,.015) 64%,
             transparent 100%);
}
.wash::after{
  content:""; position:absolute; left:-16%; right:-16%; top:22px; height:64px;
  border-radius:48% 52% 0 0 / 62px 62px 0 0;
  border-top:1.5px solid rgba(47,72,88,.42);
  mask-image:linear-gradient(90deg, transparent 3%, #000 22%, #000 78%, transparent 97%);
}

/* ── 夜里的纸 ─────────────────────────────────────────────── */
.pg.night{ background:var(--night); color:var(--night-ink); }
.pg.night::before{ opacity:.36;
  background:
    radial-gradient(90% 55% at 14% 2%, rgba(216,160,60,.10), transparent 62%),
    repeating-linear-gradient(93deg, rgba(255,247,232,.03) 0 1px, transparent 1px 4px); }
.pg.night .p{ color:#A79B89 } .pg.night .note{ color:#877C6B }
.pg.night .eyebrow{ color:#877C6B }
.pg.night .rule{ background:linear-gradient(90deg, transparent,
                 rgba(228,218,201,.16) 14%, rgba(228,218,201,.2) 54%, transparent); }
.pg.night .spine{ border-right-color:rgba(228,218,201,.12) }
.pg.night .spine span{ color:#877C6B }
.pg.night .go::after{ background:linear-gradient(90deg, rgba(216,160,60,.5),
                      rgba(216,160,60,.14) 70%, transparent); }
.pg.night .go i{ color:var(--mustard) }
.pg.night .chip{ border-color:rgba(228,218,201,.14); background:rgba(228,218,201,.04) }

.sos{ display:flex; justify-content:space-between; font-size:13px; color:var(--brick);
      padding-top:15px; flex:none; border-top:1px solid rgba(184,86,60,.24); }
.pg.night .sos{ color:#D98668; border-top-color:rgba(217,134,104,.24) }

.spacer{ flex:1 1 auto; min-height:0 }
.grp{ display:flex; flex-direction:column }
/* mtALL */
.mt8{margin-top:8px} .mt10{margin-top:10px} .mt12{margin-top:12px} .mt14{margin-top:14px} .mt16{margin-top:16px} .mt18{margin-top:18px} .mt20{margin-top:20px} .mt22{margin-top:22px} .mt24{margin-top:24px} .mt26{margin-top:26px} .mt28{margin-top:28px} .mt30{margin-top:30px} .mt32{margin-top:32px} .mt34{margin-top:34px} .mt36{margin-top:36px} .mt38{margin-top:38px} .mt40{margin-top:40px} .mt42{margin-top:42px} .mt44{margin-top:44px} .mt46{margin-top:46px} .mt48{margin-top:48px} .mt50{margin-top:50px} .mt52{margin-top:52px} .mt54{margin-top:54px} .mt56{margin-top:56px} .mt58{margin-top:58px} .mt60{margin-top:60px} .mt62{margin-top:62px} .mt64{margin-top:64px} .mt66{margin-top:66px} .mt68{margin-top:68px} .mt70{margin-top:70px} .mt72{margin-top:72px} .mt74{margin-top:74px} .mt76{margin-top:76px} .mt78{margin-top:78px} .mt80{margin-top:80px}
/* gap 工具类：一次给全。上一版改间距时用了不存在的类名（g30/g26/g32），
   CSS 里没有就静默失效、间距变成 0——三屏的行距一起塌掉，而且看不出是哪里错。 */
.g4{gap:4px} .g6{gap:6px} .g8{gap:8px} .g10{gap:10px} .g12{gap:12px} .g14{gap:14px} .g16{gap:16px} .g18{gap:18px} .g20{gap:20px} .g22{gap:22px} .g24{gap:24px} .g26{gap:26px} .g28{gap:28px} .g30{gap:30px} .g32{gap:32px} .g34{gap:34px} .g36{gap:36px} .g38{gap:38px} .g40{gap:40px} .g42{gap:42px} .g44{gap:44px} .g46{gap:46px} .g48{gap:48px} .g50{gap:50px} .g52{gap:52px} .g54{gap:54px} .g56{gap:56px} .g58{gap:58px} .g60{gap:60px}

.mt10{ margin-top:10px } .mt16{ margin-top:16px } .mt20{ margin-top:20px }
.mt26{ margin-top:26px } .mt34{ margin-top:34px }
/* 手账的缩进：不是所有东西都从同一条线开始 */
.in1{ margin-left:16px } .in2{ margin-left:30px }
</style></head><body>

<div class="hd">
  <h1>方向乙 · 整页是纸</h1>
  <p class="sub">
    温馨在实物世界里就是<b>纸和手写</b>，不是深色发光。所以整屏交给纸，插画直接印在页上，
    颗粒质感发挥到最好。骨架是<b>一本手账的页</b>：日期竖排在装订侧，内容不等距不等宽，
    入口是手写下划线加手画箭头，分区靠手绘横线。<br>
    刻意避开「米白＋衬线＋陶土」这个最常见的 AI 默认组合：标题用黑体、主 accent 用靛蓝、砖红只留急救线。
    夜里纸变暗但仍是纸，不变成黑屏（见第四屏）。
  </p>
</div>

<div class="rail">

  <!-- ══ 首页 ══ -->
  <figure class="unit">
  <div class="pg">
    <div class="spine"><span class="mk"></span><span>八月廿七</span></div>

    <div class="grp g4">
      <div class="eyebrow">今天的滋味</div>
      <div class="name">烤红薯</div>
    </div>
    <div class="rule mt20" style="width:58%"></div>

    <div class="grp g10 mt20">
      <div class="eyebrow">今天怎么样</div>
      <div class="chips mt10">
        <span class="chip on" style="--c:#C58A4E"></span>
        <span class="chip on" style="--c:#D8A03C"></span>
        <span class="chip on" style="--c:#7FA86A"></span>
        <span class="chip next"></span>
        <span class="chip"></span>
        <span class="chip"></span>
      </div>
    </div>

    <div class="grp g16 mt26 in1">
      <span class="go">情绪瓶子 <i>→</i></span>
      <span class="go">昨晚睡得怎么样 <i>→</i></span>
      <span class="go">找个人说说话 <i>→</i></span>
    </div>

    <div class="grp g4 mt26">
      <div class="quote">20:30 · 十五分钟 · 一起坐着</div>
      <div class="live">此刻 23 人在 · <span style="color:var(--ink3)">那场是什么</span></div>
    </div>

    <div class="grp g12 mt26">
      <span class="go main">我现在不太好</span>
      <span class="go dim in1">试试含一口水，慢慢感受</span>
    </div>

    <div class="spacer"></div>
    <div class="sos"><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
  <figcaption>home · 首页</figcaption>
  </figure>

  <!-- ══ 三个岔口 ══ -->
  <figure class="unit">
  <div class="pg">
    <div class="spine"><span>← 今天</span></div>
    <div class="spacer"></div>
    <div class="h">你来了。</div>
    <div class="grp g26 mt50">
      <span class="opt"><em style="--c:#2F4858"></em>很想吃</span>
      <span class="opt in1"><em style="--c:#D8A03C"></em>正在吃</span>
      <span class="opt in2"><em style="--c:#B8563C"></em>吃完了</span>
    </div>
    <div class="rule mt34" style="width:64%"></div>
    <div class="mt20"><span class="go dim">吃不下 · 说不上来</span></div>
    <div class="spacer"></div>
  </div>
  <figcaption>mine · 缩进本身就是层次</figcaption>
  </figure>

  <!-- ══ 饿了 ══ -->
  <figure class="unit">
  <div class="pg">
    <div class="wash"></div>
    <div class="spine"><span>← 返回</span></div>
    <div class="grp g12 mt10">
      <div class="h">饿了。</div>
      <div class="p">太久没吃东西，饿的感觉会像潮水一样涨起来。</div>
    </div>
    <div class="rule mt26" style="width:52%"></div>
    <div class="h sm mt26">想吃点什么样的？</div>
    <div class="grp g22 mt20 in1">
      <span class="opt" style="font-size:19px"><em style="--c:#B8563C"></em>热乎乎的</span>
      <span class="opt" style="font-size:19px"><em style="--c:#2F4858"></em>冰冰凉的</span>
      <span class="opt" style="font-size:19px"><em style="--c:#D8A03C"></em>软的、好咽的</span>
      <span class="opt" style="font-size:19px"><em style="--c:#7FA86A"></em>有嚼头的</span>
      <span class="opt dim" style="font-size:19px;color:var(--ink2)"><em style="--c:#C4BAA8"></em>说不上来</span>
    </div>
    <div class="spacer"></div>
    <span class="go dim">下一餐怎么吃</span>
  </div>
  <figcaption>empty · 水是纸上的一道水彩</figcaption>
  </figure>

  <!-- ══ 滋味卡 · 夜里 ══ -->
  <figure class="unit">
  <div class="pg night">
    <div class="spine"><span class="mk" style="background:#D8A03C"></span><span>NO. 001</span></div>
    <div class="grp g4">
      <div class="eyebrow">今天的滋味</div>
      <div class="name">烤红薯</div>
    </div>
    <span class="art wide mt10">{{SVG_00}}</span>
    <div class="p mt16">皮焦得裂开一道口子，里面是橙的。很烫，要在两只手之间倒来倒去。越靠里越甜。</div>
    <div class="rule mt26" style="width:44%"></div>
    <div class="note mt16">想到什么都行，也可以什么都不想。</div>
    <div class="spacer"></div>
    <span class="go">看看这些天的滋味 <i>→</i></span>
  </div>
  <figcaption>taste-card · 夜里纸变暗，但还是纸</figcaption>
  </figure>

</div>
</body></html>
