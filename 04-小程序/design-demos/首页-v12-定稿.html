<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 v12 · 定稿</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0806;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0a0806ee;
     border-bottom:1px solid #1f1a14;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.6;max-width:390px}
.cap b{color:var(--brass);font-weight:500}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #241e18;box-shadow:0 26px 60px #0008;background:#0C0906}
.in{position:relative;height:100%;padding:40px 30px 22px;display:flex;flex-direction:column;
    text-align:center}
.day{font-size:10.5px;letter-spacing:.42em;color:var(--paper3);opacity:.68;text-indent:.42em}

/* 插画区：色块碗 ＋ 落影，无描边。背后一层环境暖光 */
.dish{height:252px;margin:6px 0 0;position:relative}
.dish::before{content:'';position:absolute;left:50%;top:34px;transform:translateX(-50%);
  width:306px;height:186px;border-radius:50%;filter:blur(48px);
  background:radial-gradient(circle,#F0BE6a5e 0%,#D08A4a2c 46%,transparent 76%)}
.dish svg{position:absolute;inset:0;width:100%;height:100%}
.solid{filter:drop-shadow(0 6px 9px #00000090)}

.lbl{font-size:10.5px;letter-spacing:.36em;color:var(--paper2);opacity:.8;text-indent:.36em}
.w{font-family:var(--hand);font-size:44px;color:#FBEDCF;line-height:1.2;margin:6px 0 0;
   text-shadow:0 0 30px #E8C87A3a}
.go{font-size:12.5px;color:var(--paper3);margin:12px 0 0;letter-spacing:.06em}
.sp{flex:1;min-height:18px;max-height:30px}
.sp2{flex:1.4;min-height:36px}
.zt{font-size:10.5px;letter-spacing:.32em;color:var(--paper2);opacity:.78;text-indent:.32em;padding:0 0 13px}
.cells{display:flex;align-items:center;justify-content:center;gap:26px;height:44px}
.sh{display:block;flex:none}
.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.drop{border-radius:50% 50% 50% 8px;transform:rotate(-12deg)}
.blob{border-radius:58% 42% 46% 54% / 52% 56% 44% 48%}
.dot{border-radius:50%}
.empty{border:1px solid rgba(244,237,227,.15);background:transparent!important}
.ways a{display:block;font-size:16.5px;color:var(--paper2);padding:13px 0;letter-spacing:.04em}
.live{font-size:13px;color:var(--jade);opacity:.85;letter-spacing:.05em;margin-top:30px}
.main .t{font-size:24px;color:#FFF4E2;letter-spacing:.1em}
.main .ln{width:138px;height:1px;margin:16px auto 0;
          background:linear-gradient(90deg,transparent,#C9A063,transparent)}
.main .s{font-size:13.5px;color:var(--paper3);margin:15px 0 0}
.foot{display:flex;justify-content:center;gap:32px;padding:24px 0 0}
.foot span{font-size:13px;color:var(--clay);opacity:.82}
</style>

<div class=lab>首页 <b>v12 · 定稿</b>　<span style="color:#5a5147">｜色块碗＋落影（无描边）｜零容器全居中｜功能：六格／找人说话／睡眠／那场／急救</span></div>

<svg width="0" height="0" style="position:absolute">
<defs>
  <filter id="dust" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
    <feComponentTransfer in="ng" result="nc">
      <feFuncA type="discrete" tableValues="0 0 0 0 .35 .7 1"/>
    </feComponentTransfer>
    <feComposite in="SourceGraphic" in2="nc" operator="in"/>
  </filter>

  <!-- 碗身：一整块。上缘是碗口椭圆的后半，下缘是碗底的弧 —— 闭合的块，不是两道线 -->
  <path id="bowlBody" d="M72 118
      C74 182, 124 218, 172 216 C224 214, 266 176, 268 112
      A98 26 0 0 0 72 118 Z"/>
  <!-- 碗口内壁：深一档，让碗有厚度和深浅 -->
  <ellipse id="bowlIn" cx="170" cy="116" rx="90" ry="22"/>
  <!-- 碗沿一道靛蓝带：老式瓷碗那道釉线，色块不是线 -->
  <path id="rimBand" d="M80 128 C104 142, 238 140, 262 124
      C258 133, 244 141, 226 146 C196 154, 142 154, 112 146 C94 141, 82 135, 80 128 Z"/>
  <!-- 蛋羹：三摊 -->
  <path id="e1" d="M96 116 C92 100, 116 90, 154 88 C198 85, 240 93, 244 108
                   C248 124, 224 134, 184 137 C138 140, 100 132, 96 116 Z"/>
  <path id="e2" d="M116 112 C113 101, 134 94, 164 93 C194 92, 214 97, 217 107
                   C220 117, 200 124, 170 125 C138 126, 119 121, 116 112 Z"/>
  <path id="e3" d="M192 120 C206 114, 230 114, 238 121 C244 129, 228 136, 206 136
                   C190 136, 184 127, 192 120 Z"/>
  <!-- 勺子：也是块 -->
  <g id="spoonBlock">
    <path d="M236 96 L292 60 L297 68 L241 104 Z" fill="#CFC2A6"/>
    <ellipse cx="228" cy="102" rx="16" ry="11" fill="#DED2B8" transform="rotate(-32 228 102)"/>
    <ellipse cx="226" cy="101" rx="9.5" ry="6" fill="#B7A88C" transform="rotate(-32 226 101)"/>
  </g>
  <g id="bits">
    <rect x="140" y="102" width="9" height="5" rx="1" fill="#8CAE7A" transform="rotate(-12 144 104)"/>
    <rect x="182" y="114" width="7" height="4.5" rx="1" fill="#7C9E6C" transform="rotate(20 185 116)"/>
    <rect x="212" y="99" width="8" height="4.5" rx="1" fill="#8CAE7A" transform="rotate(-8 216 101)"/>
    <circle cx="162" cy="121" r="2.4" fill="#7C9E6C"/>
    <ellipse cx="126" cy="124" rx="7" ry="3.4" fill="#8A5F3A" opacity=".85"/>
  </g>
  <g id="geo">
    <path d="M38 200 h30 v20 h26 v20 h-56 v-20 h-26 z" fill="#C87A4A" opacity=".4"/>
    <path d="M296 158 A20 20 0 1 1 296 198" fill="none" stroke="#C9563C" stroke-width="2.4"
          stroke-linecap="round" opacity=".5"/>
    <g fill="#A2957F" opacity=".46">
      <circle cx="46" cy="84" r="2"/><circle cx="46" cy="93" r="2"/><circle cx="46" cy="102" r="2"/>
    </g>
  </g>
  <!-- 旧版：线画的碗 -->
  <g id="bowlLines">
    <path d="M72 122 C74 182, 124 216, 172 214 C224 212, 266 174, 268 116"
          fill="none" stroke="#E0CFAE" stroke-width="3" stroke-linecap="round" opacity=".78"/>
    <path d="M85 107 C118 96, 244 94, 266 105"
          fill="none" stroke="#BCAE92" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
    <path d="M80 136 C104 146, 240 144, 262 134"
          fill="none" stroke="#3E6488" stroke-width="2.6" stroke-linecap="round" opacity=".72"/>
  </g>
</defs>
</svg>

<div class=wrap>
<div class=ph><div class=in>
  <div class=day>八月廿七</div>

  <div class=dish>
    <svg viewBox="0 0 340 262">
      <use href="#geo"/>
      <g class=solid>
        <use href="#bowlBody" fill="#D6CAB2"/>
        <use href="#bowlIn" fill="#A99C82"/>
        <use href="#rimBand" fill="#3E6488" opacity=".62"/>
        <use href="#e1" fill="#E4C886"/><use href="#e2" fill="#F6E7B2"/><use href="#e3" fill="#CBA85E"/>
        <g filter="url(#dust)" opacity=".45">
          <use href="#e1" fill="#FFF8E2"/><use href="#e2" fill="#FFFDF2"/>
        </g>
        <g filter="url(#dust)" opacity=".3"><use href="#bowlBody" fill="#FFFBEE"/></g>
        <use href="#bits"/>
        <use href="#spoonBlock"/>
      </g>
    </svg>
  </div>

  <div class=lbl>今天的滋味</div>
  <div class=w>蒸蛋</div>
  <div class=go>看看这些天的滋味</div>

  <div class=sp></div>

  <div class=zt>今天怎么样</div>
  <div class=cells>
    <i class="sh star" style="width:40px;height:40px;background:#F2913F"></i>
    <i class="sh drop" style="width:28px;height:28px;background:#E8C558"></i>
    <i class="sh blob" style="width:35px;height:35px;background:#5FBF95"></i>
    <i class="sh drop empty" style="width:26px;height:26px"></i>
    <i class="sh blob empty" style="width:31px;height:31px"></i>
    <i class="sh dot empty" style="width:23px;height:23px"></i>
  </div>

  <div class=sp></div>

  <div class=ways><a>找个人说说话</a><a>昨晚睡得怎么样</a></div>
  <div class=live>此刻 23 人在 · 20:30 一起坐着</div>

  <div class=sp2></div>

  <div class=main>
    <div class=t>我现在不太好</div><div class=ln></div>
    <div class=s>试试含一口水，慢慢感受</div>
  </div>
  <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>
<div class=cap><b>v12</b>　<i>碗＝一整块＋内壁深一档＋碗沿靛蓝色带，落影让它落在桌上；勺子是"有人在吃"的证据。零描边零容器，结构全靠距离和字号层次。</i></div>
</div>
</html>
