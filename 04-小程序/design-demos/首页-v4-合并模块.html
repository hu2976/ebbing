<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 v4</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0907;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0b0907ee;
     border-bottom:1px solid #221c15;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.55;max-width:390px}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #262019;box-shadow:0 26px 60px #0007;background:#0F0B07}

/* 光场：这顿饭的颜色 + 今天的情绪色 */
.field{position:absolute;left:0;right:0;top:0;height:440px;overflow:hidden}
.b{position:absolute;border-radius:50%;filter:blur(52px)}
/* 蒸蛋：淡蛋黄的主体 + 中心一团水光 + 边缘温润的暖。
   食物色不掺情绪色——情绪已经由六格表达，光场再掺一遍只会把蛋弄脏。 */
.b1{width:330px;height:300px;left:28px;top:-6px;background:#F2E2A6;opacity:.60}
.b2{width:196px;height:176px;left:96px;top:52px;background:#FDF6DE;opacity:.52}
.b3{width:250px;height:228px;left:-52px;top:74px;background:#E6CE8E;opacity:.40}
.b4{width:212px;height:196px;right:-56px;top:56px;background:#DCC489;opacity:.34}
.veil{position:absolute;inset:0;
      background:linear-gradient(180deg,transparent 0,transparent 50%,#0F0B07b8 74%,#0F0B07 100%)}

.in{position:relative;height:100%;padding:42px 26px 20px;display:flex;flex-direction:column}
.day{font-size:10.5px;letter-spacing:.4em;color:#D6C9B2;opacity:.8;text-indent:.4em}

/* ── 主角：这一天的名字 ── */
.taste{padding:58px 0 0;text-align:center;position:relative}
.taste::before{content:'';position:absolute;left:50%;top:70px;transform:translateX(-50%);
  width:280px;height:136px;pointer-events:none;border-radius:50%;
  background:radial-gradient(58% 42% at 38% 32%,rgba(255,252,238,.30),transparent 62%),
             radial-gradient(40% 26% at 68% 60%,rgba(255,248,222,.20),transparent 64%);
  filter:blur(5px)}
.taste .lbl{font-size:10.5px;letter-spacing:.36em;color:#2E2414;opacity:1;text-indent:.36em}
.taste .w{font-family:var(--hand);font-size:70px;color:#FFF8E8;line-height:1.04;margin:12px 0 0;
          text-shadow:0 1px 2px #6E583644,0 0 34px #FFF6D877,0 0 78px #E8C87A55}
.taste .go{font-size:12.5px;color:#33280F;opacity:.88;margin:15px 0 0;letter-spacing:.1em}

.spacer{flex:1;min-height:8px;max-height:26px}
.spacer2{flex:1;min-height:12px}

/* ══ 情绪模块：六格 + 情绪瓶子 + 找个人说说话 合成一块 ══
   四个人本来就是情绪疏导那条路，和记录同属一件事。
   容器不是圆角卡，是一片有机色域——软边，读作"一个区域"而不是"一个盒子"。 */
.mood{position:relative;padding:14px 8px 12px}
.mood::before{content:'';position:absolute;inset:-6px -14px;border-radius:44px 52px 40px 56px;
      background:radial-gradient(120% 100% at 22% 30%,rgba(230,152,96,.13),rgba(178,146,216,.06) 54%,rgba(140,193,170,.05) 78%,transparent);
      filter:blur(7px)}
.mood>*{position:relative}
.zt{font-size:11px;letter-spacing:.2em;color:var(--paper2);opacity:.8;padding:0 0 11px}

/* 六次进食：固定直径不拉伸（上一版 flex:1 把它们抻成了药片），
   大小 22–42px 反差拉满，相邻叠 7px —— 挤在一起才活，排队就死 */
.cells{display:flex;align-items:center;justify-content:space-between;padding:0 0 12px;height:52px}
.done{display:flex;align-items:center}
.cells i{display:block;flex:none;position:relative}
.done i+i{margin-left:9px}
.c1{width:50px;height:50px;border-radius:50% 50% 48% 52%;z-index:6}
.c2{width:30px;height:30px;border-radius:50%;z-index:5;align-self:flex-start;margin-top:2px}
.c3{width:41px;height:41px;border-radius:52% 48% 44% 56%;z-index:4}
.c4{width:25px;height:25px;border-radius:50%;z-index:3;align-self:flex-end;margin-bottom:4px}
.c5{width:33px;height:33px;border-radius:46% 54% 52% 48%;z-index:2}
.c6{width:27px;height:27px;border-radius:50%;z-index:1;align-self:flex-start;margin-top:6px}
.blank{border:1px solid rgba(244,237,227,.14);background:transparent}
.lit{box-shadow:0 2px 10px #00000038}

.why{font-size:12.5px;color:var(--paper3);padding:0 0 13px}
.links{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--paper2)}
.links b{font-weight:400}
.links s{text-decoration:none;color:var(--paper3);opacity:.5}

/* 昨晚睡：不属于情绪那一块，单独一行，轻 */
.rule{height:9px;margin:15px 2px 3px;opacity:.5;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='330' height='9'><path d='M2 6 C28 2.4, 52 7.6, 78 4.6 S130 1.8, 158 5.4 S212 8, 240 4.2 S296 2, 328 5.6' fill='none' stroke='%23C9A063' stroke-width='1.3' stroke-linecap='round' opacity='0.62'/></svg>") no-repeat center/contain}
.sleep{padding:9px 4px 0;font-size:14.5px;color:var(--paper3)}

/* ── 那场 ── */
.sess{margin-top:15px;border-radius:16px;padding:14px 16px 13px;
      background:linear-gradient(158deg,#251E15,#1A1510);
      border:1px solid rgba(201,160,99,.22);
      box-shadow:0 10px 24px #00000077,inset 0 1px 0 rgba(255,240,214,.08)}
.sess .t{font-family:var(--hand);font-size:20px;color:#F2DEBC}
.sess .r{display:flex;align-items:center;gap:8px;padding:9px 0 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)}
.sess .r b{font-size:13px;color:var(--jade);font-weight:400}
.sess .r span{margin-left:auto;font-size:13px;color:var(--paper3)}

/* ── 急救 ── */
.main{margin:0;border-radius:32px;padding:19px;text-align:center;font-size:21px;
      color:#FFF6E8;letter-spacing:.08em;
      background:radial-gradient(130% 175% at 50% 0%,#89503A 0%,#4E2D22 58%,#33201A 100%);
      box-shadow:0 0 38px #CB7E6238,inset 0 1px 0 #ffffff16}
.sub{text-align:center;font-size:13px;color:var(--paper3);padding:12px 0 0}
.foot{display:flex;justify-content:space-between;padding:15px 4px 0}
.foot span{font-size:13px;color:var(--clay);opacity:.84}
</style>

<div class=lab>首页 <b>v4</b>　<span style="color:#5a5147">｜情绪记录＋四个人合成一块；六格固定直径不拉伸、大小反差拉满、相邻叠压；从十件事减到五件</span></div>

<div class=wrap>
<div class=ph>
  <div class=field>
    <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
    <div class=veil></div>
  </div>
  <div class=in>
    <div class=day>八月廿七</div>

    <div class=taste>
      <div class=lbl>今天的滋味</div>
      <div class=w>蒸蛋</div>
      <div class=go>看看这些天的滋味 ›</div>
    </div>

    <div class=spacer></div>

    <div class=mood>
      <div class=zt>今天怎么样</div>
      <div class=cells>
        <span class=done>
          <i class="c1 lit" style="background:#DE8E63"></i>
          <i class="c2 lit" style="background:#D8B274"></i>
          <i class="c3 lit" style="background:#89C0A6"></i>
        </span>
        <i class="c4 blank"></i>
        <i class="c5 blank"></i>
        <i class="c6 blank"></i>
      </div>
      <div class=why>为什么 ›</div>
      <div class=links><b>情绪瓶子</b><s>·</s><b>找个人说说话</b></div>
    </div>

    <div class=rule></div>
    <div class=sleep>昨晚睡得怎么样 ›</div>

    <div class=sess>
      <div class=t>20:30 · 十五分钟 · 一起坐着</div>
      <div class=r><span class=dot></span><b>此刻 23 人在</b><span>那场是什么 ›</span></div>
    </div>

    <div class=spacer2></div>

    <div class=main>我现在不太好</div>
    <div class=sub>试试含一口水，慢慢感受</div>
    <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
</div>
<div class=cap><b>v4 · 五件事</b>　<i>滋味｜情绪（六格＋为什么＋情绪瓶子＋找个人说说话）｜昨晚睡｜那场｜急救。六格改固定直径、22–42px 反差、相邻叠 7px——排队就死，挤在一起才活。情绪块用软边有机色域，不是圆角卡。</i></div>
</div>
</html>
