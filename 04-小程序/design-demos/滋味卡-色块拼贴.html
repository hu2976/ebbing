<!doctype html><html lang="zh"><meta charset="utf-8">
<title>滋味卡 · 色块拼贴</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073; --brass:#C9A063;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0806;font-family:var(--body);color:var(--paper);
     padding:48px;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
.n{font-size:13px;color:var(--paper3);margin:0 0 34px}
.row{display:flex;gap:46px;align-items:flex-start;flex-wrap:wrap}
.cap{font-size:12.5px;color:var(--paper2);padding:12px 0 0;line-height:1.6;max-width:300px}
.cap b{color:var(--brass);font-weight:500}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}

/* 牌：5:7 扑克比例，米白纸底贴在深色界面上 */
.card{width:300px;height:420px;border-radius:12px;overflow:hidden;position:relative;
      box-shadow:0 20px 44px #000000a8, 0 2px 0 #ffffff14;
      transform:rotate(-1.2deg)}
.card svg{display:block;width:100%;height:100%}

/* 放在首页里的样子：深色屏 + 这张牌 */
.ph{width:300px;height:420px;border-radius:24px;background:#0C0906;
    border:1px solid #241e18;display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 44px #0008}
.ph .card{width:214px;height:300px;transform:rotate(-2deg) scale(1)}
</style>

<h1>滋味卡 · 色块拼贴（按 food-illustration skill）</h1>
<p class=n>不描边 · 颗粒 · 碗只给一道弧 · 几何配重 · 米白纸底 · 等宽字标注</p>

<div class=row>

<div>
<div class=card>
<!-- 落地小程序时整段转 background:url("data:image/svg+xml;utf8,...")：
     # 转 %23、双引号换单引号即可，其余照抄。WXSS 不认 <svg> 标签但认 data URI。 -->
<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 颗粒：这个风格的命门。没有它就是扁平矢量图 -->
    <filter id="grain" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
      <feComponentTransfer in="ng" result="nc">
        <feFuncA type="discrete" tableValues="0 0 .18 .34 .5 .68 .85 1"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="nc" operator="in"/>
    </filter>
    <!-- 纸纹 -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- ── 纸底：象牙白，不是纯白 ── -->
  <rect width="300" height="420" fill="#F5F1E8"/>
  <rect width="300" height="420" filter="url(#paper)" opacity="1"/>

  <!-- ── 几何配重 · 下层：阶梯块（压在形象左下） ── -->
  <g filter="url(#grain)" opacity=".62">
    <path d="M38 262 h34 v22 h30 v22 h-64 v-22 h-30 z" fill="#D08A5A"/>
  </g>
  <g filter="url(#grain)" opacity=".4">
    <rect x="214" y="126" width="30" height="42" fill="#9A9086"/>
    <rect x="248" y="126" width="12" height="26" fill="#C9A24B"/>
  </g>

  <!-- ── 蛋羹：三摊错位的黄，边缘毛糙、浓度不匀 ── -->
  <g filter="url(#grain)">
    <path d="M78 196 C72 176, 96 162, 132 158 C176 153, 220 162, 226 182
             C232 202, 208 218, 166 222 C118 227, 84 216, 78 196 Z" fill="#D9BC7E"/>
    <path d="M96 190 C92 178, 112 170, 140 168 C170 166, 192 172, 196 184
             C200 196, 178 204, 148 206 C116 208, 100 202, 96 190 Z" fill="#F0DFA8"/>
    <path d="M172 200 C186 194, 210 194, 218 202 C224 210, 208 218, 186 218
             C170 218, 164 208, 172 200 Z" fill="#C4A05C"/>
  </g>

  <!-- ── 葱花：小方块，不画叶形 ── -->
  <g filter="url(#grain)">
    <rect x="118" y="180" width="9" height="5" rx="1" fill="#7E9B72" transform="rotate(-12 122 182)"/>
    <rect x="158" y="192" width="7" height="4.5" rx="1" fill="#6E8B64" transform="rotate(20 161 194)"/>
    <rect x="188" y="176" width="8" height="4.5" rx="1" fill="#7E9B72" transform="rotate(-8 192 178)"/>
    <circle cx="140" cy="200" r="2.4" fill="#6E8B64"/>
    <circle cx="176" cy="184" r="1.9" fill="#7E9B72"/>
  </g>
  <!-- 香油／酱油：两点深褐，边缘洇出 -->
  <g filter="url(#grain)" opacity=".8">
    <ellipse cx="106" cy="204" rx="7" ry="3.4" fill="#7A5433"/>
    <ellipse cx="204" cy="192" rx="4.6" ry="2.4" fill="#7A5433"/>
  </g>

  <!-- ── 碗：只给一道弧，不闭合。碗口那条更淡 ── -->
  <path d="M62 190 C64 244, 108 276, 154 274 C202 272, 238 238, 240 184"
        fill="none" stroke="#2F4A6B" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M74 176 C104 166, 210 164, 232 174"
        fill="none" stroke="#9A9086" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>

  <!-- ── 几何配重 · 上层 ── -->
  <!-- 不完整圆环 -->
  <path d="M236 246 A22 22 0 1 1 236 290" fill="none" stroke="#B5563C" stroke-width="2.4"
        stroke-linecap="round" opacity=".72"/>
  <!-- 点阵 -->
  <g fill="#9A9086" opacity=".72">
    <circle cx="52" cy="150" r="2"/><circle cx="52" cy="159" r="2"/><circle cx="52" cy="168" r="2"/>
  </g>
  <!-- 细直线 -->
  <g stroke="#2F4A6B" stroke-width="1.2" opacity=".46" stroke-linecap="round">
    <path d="M198 300 h56"/><path d="M198 306 h34"/>
  </g>
  <!-- 蒸汽：两道细线（蒸蛋是热的） -->
  <g stroke="#9A9086" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".42">
    <path d="M142 138 C146 126, 136 118, 141 106"/>
    <path d="M168 144 C172 133, 163 126, 167 115"/>
  </g>

  <!-- ── 标注：等宽字，这是风格的一部分不是签名 ── -->
  <text x="26" y="374" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5"
        letter-spacing="1.6" fill="#8A8071">27 AUG 2026</text>
  <text x="26" y="390" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5"
        letter-spacing="1.6" fill="#8A8071">STEAMED EGG STUDY</text>
  <text x="274" y="42" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace"
        font-size="9.5" letter-spacing="1.6" fill="#8A8071">NO. 001</text>

  <!-- 色板条：取自这张图的主色 -->
  <g>
    <rect x="26" y="42" width="11" height="11" fill="#D9BC7E"/>
    <rect x="26" y="55" width="11" height="11" fill="#C4A05C"/>
    <rect x="26" y="68" width="11" height="11" fill="#7E9B72"/>
    <rect x="26" y="81" width="11" height="11" fill="#2F4A6B"/>
  </g>
</svg>
</div>
<div class=cap><b>牌面 300×420（5:7）</b><br><i>蛋羹是三摊错位的黄，没有描边；碗只有一道靛蓝弧＋一道更淡的碗口线，不闭合；葱花是小方块不画叶形；阶梯块／断开的圆环／点阵／细线是构成配重，不代表食物。</i></div>
</div>

<div>
<div class=ph>
  <div class=card>
    <svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
      <use href="#x"/>
      <rect width="300" height="420" fill="#F5F1E8"/>
      <rect width="300" height="420" filter="url(#paper)"/>
      <g filter="url(#grain)" opacity=".62">
        <path d="M38 262 h34 v22 h30 v22 h-64 v-22 h-30 z" fill="#D08A5A"/>
      </g>
      <g filter="url(#grain)">
        <path d="M78 196 C72 176, 96 162, 132 158 C176 153, 220 162, 226 182
                 C232 202, 208 218, 166 222 C118 227, 84 216, 78 196 Z" fill="#D9BC7E"/>
        <path d="M96 190 C92 178, 112 170, 140 168 C170 166, 192 172, 196 184
                 C200 196, 178 204, 148 206 C116 208, 100 202, 96 190 Z" fill="#F0DFA8"/>
        <path d="M172 200 C186 194, 210 194, 218 202 C224 210, 208 218, 186 218
                 C170 218, 164 208, 172 200 Z" fill="#C4A05C"/>
      </g>
      <g filter="url(#grain)">
        <rect x="118" y="180" width="9" height="5" rx="1" fill="#7E9B72" transform="rotate(-12 122 182)"/>
        <rect x="158" y="192" width="7" height="4.5" rx="1" fill="#6E8B64" transform="rotate(20 161 194)"/>
        <rect x="188" y="176" width="8" height="4.5" rx="1" fill="#7E9B72" transform="rotate(-8 192 178)"/>
      </g>
      <path d="M62 190 C64 244, 108 276, 154 274 C202 272, 238 238, 240 184"
            fill="none" stroke="#2F4A6B" stroke-width="3" stroke-linecap="round" opacity=".82"/>
      <path d="M74 176 C104 166, 210 164, 232 174"
            fill="none" stroke="#9A9086" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
      <path d="M236 246 A22 22 0 1 1 236 290" fill="none" stroke="#B5563C" stroke-width="2.4"
            stroke-linecap="round" opacity=".72"/>
      <text x="26" y="380" font-family="IBM Plex Mono, Menlo, monospace" font-size="11"
            letter-spacing="1.6" fill="#8A8071">STEAMED EGG</text>
      <text x="274" y="44" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace"
            font-size="11" letter-spacing="1.6" fill="#8A8071">NO. 001</text>
    </svg>
  </div>
</div>
<div class=cap><b>放进深色界面</b><br><i>这个风格离不开米白纸底——纯白会让颗粒读成噪点瑕疵，深底会让它彻底失效。所以滋味卡就该是一张贴在暗屏上的纸牌，和你第六轮做的「真的牌」是同一个判断。</i></div>
</div>

</div>
</html>
