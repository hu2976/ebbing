<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 v9 · 无框</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0806;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0a0806ee;
     border-bottom:1px solid #1f1a14;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.55;max-width:390px}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #241e18;box-shadow:0 26px 60px #0008;background:#0C0906}

/* ══ 全屏零容器 ══
   压抑感来自框：一个卡片框 + 一个按钮胶囊 + 暗底 = 被关着。
   「简约至上」的删除策略删的不是功能，是容器——功能一个没少，框全部拿掉。
   代价：结构必须由距离和字号层次全部接住，这两样一松就散架。
   对齐只有一条中轴：全部居中。混用居中和左对齐才是两条模糊的边。 */
.in{position:relative;height:100%;padding:40px 30px 22px;display:flex;flex-direction:column;
    text-align:center}
.day{font-size:10.5px;letter-spacing:.42em;color:var(--paper3);opacity:.68;text-indent:.42em}

/* 一碗蒸蛋 · 水彩 —— 唯一的实体，也是唯一允许有重量的东西 */
.dish{position:relative;height:250px;margin:12px 0 0}
.warm{position:absolute;left:50%;top:56px;transform:translateX(-50%);
      width:310px;height:196px;border-radius:50%;filter:blur(44px);
      background:radial-gradient(circle,#EBC46E5c 0%,#C4884828 46%,transparent 72%)}
.shadow{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
        width:212px;height:25px;border-radius:50%;filter:blur(14px);background:#00000088}
.bleed{position:absolute;left:50%;top:160px;transform:translateX(-116px);
       width:54px;height:31px;border-radius:50%;filter:blur(10px);background:#B29A7a;opacity:.32}
.bowl{position:absolute;left:50%;top:70px;transform:translateX(-50%);
      width:236px;height:132px;
      border-radius:6px 6px 118px 118px / 6px 6px 124px 124px;
      background:
        radial-gradient(ellipse 52% 46% at 24% 22%,#F3EADB,transparent 72%),
        radial-gradient(ellipse 44% 54% at 78% 40%,#CBBBA1,transparent 70%),
        radial-gradient(ellipse 100% 100% at 50% 54%,transparent 70%,#7f6e5690 92%,#6d5c4590 100%),
        radial-gradient(ellipse 70% 60% at 50% 88%,#94836B,transparent 76%),
        linear-gradient(178deg,#E7DCCA 0%,#D3C5AF 40%,#AB9A80 100%);
      box-shadow:inset 0 -13px 26px #8b7a6150,inset 0 0 15px 5px #7d6d5738,
                 0 11px 26px #00000068}
.bowl::after{content:'';position:absolute;left:16px;top:15px;width:34px;height:76px;
             border-radius:50%;filter:blur(10px);background:#FFFDF6;opacity:.30}
.rim{position:absolute;left:50%;top:59px;transform:translateX(-50%);
     width:244px;height:42px;border-radius:50%;
     background:linear-gradient(180deg,#F4ECDD,#C6B8A0);box-shadow:0 2px 5px #00000055}
.rim-in{position:absolute;left:50%;top:65px;transform:translateX(-50%);
        width:223px;height:33px;border-radius:50%;background:#8A7860}
.egg{position:absolute;left:50%;top:67px;transform:translateX(-50%);
     width:215px;height:31px;border-radius:50%;overflow:hidden;
     background:
       radial-gradient(ellipse 46% 62% at 32% 32%,#FCF1C6,transparent 70%),
       radial-gradient(ellipse 40% 54% at 68% 60%,#E9CE86,transparent 68%),
       radial-gradient(ellipse 36% 48% at 84% 30%,#D6B265,transparent 72%),
       radial-gradient(ellipse 100% 104% at 50% 50%,transparent 66%,#B98F3Ea8 88%,#A67A32c8 100%),
       radial-gradient(ellipse 70% 90% at 46% 44%,#F4E1A4,#DDBE72 72%,#C9A555 100%);
     box-shadow:inset 0 2px 5px #fffdf0aa,inset 0 0 7px 3px #b8913f4a,0 0 24px #EBC46E4a}
.egg::before{content:'';position:absolute;left:30px;top:5px;width:74px;height:11px;
             border-radius:50%;background:#FFFDF2;opacity:.62;filter:blur(2.6px)}
.egg::after{content:'';position:absolute;right:36px;top:16px;width:36px;height:5px;
            border-radius:50%;background:#FFF8DC;opacity:.42;filter:blur(2px)}
.chive{position:absolute;border-radius:44% 56% 50% 50%;background:#75A063;opacity:.88}

/* 字号层次：框拿掉之后，层次全靠这套阶梯撑 */
.lbl{font-size:10.5px;letter-spacing:.36em;color:var(--paper2);opacity:.8;text-indent:.36em}
.w{font-family:var(--hand);font-size:44px;color:#FBEDCF;line-height:1.2;margin:6px 0 0;
   text-shadow:0 0 30px #E8C87A4a}
.go{font-size:12.5px;color:var(--paper3);margin:12px 0 0;letter-spacing:.06em}

.sp{flex:1;min-height:22px;max-height:34px}
.sp2{flex:1.4;min-height:40px}

/* 情绪：唯一的彩色，六格自己就是入口 */
.zt{font-size:10.5px;letter-spacing:.32em;color:var(--paper2);opacity:.78;
    text-indent:.32em;padding:0 0 14px}
.cells{display:flex;align-items:center;justify-content:center;gap:26px;height:44px}
.sh{display:block;flex:none}
.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.drop{border-radius:50% 50% 50% 8px;transform:rotate(-12deg)}
.blob{border-radius:58% 42% 46% 54% / 52% 56% 44% 48%}
.dot{border-radius:50%}
.empty{border:1px solid rgba(244,237,227,.15);background:transparent!important}

/* 两个入口：只有字。触区靠 padding 撑到 44px，不靠可见的框 */
.ways{padding:0}
.ways a{display:block;font-size:16.5px;color:var(--paper2);padding:13px 0;letter-spacing:.04em}

/* 那场：卡去掉，只留一行字。它本来就是一句话 */
.live{font-size:13px;color:var(--jade);opacity:.85;letter-spacing:.05em;margin-top:30px}

/* 急救：一行字 + 一条光。不是按钮，是一个开口 */
.main{margin:0}
.main .t{font-size:24px;color:#FFF4E2;letter-spacing:.1em}
.main .ln{width:138px;height:1px;margin:16px auto 0;
          background:linear-gradient(90deg,transparent,#C9A063,transparent)}
.main .s{font-size:13.5px;color:var(--paper3);margin:15px 0 0}
.foot{display:flex;justify-content:center;gap:32px;padding:24px 0 0}
.foot span{font-size:13px;color:var(--clay);opacity:.82}
</style>

<div class=lab>首页 <b>v9 · 无框</b>　<span style="color:#5a5147">｜那场卡与主入口胶囊全部拿掉，功能一个没少｜全居中一条中轴｜结构由距离和字号层次接住</span></div>

<div class=wrap>
<div class=ph><div class=in>
  <div class=day>八月廿七</div>

  <div class=dish>
    <div class=warm></div>
    <div class=shadow></div>
    <div class=bleed></div>
    <div class=bowl></div>
    <div class=rim></div>
    <div class=rim-in></div>
    <div class=egg>
      <span class=chive style="left:62px;top:8px;width:9px;height:4px"></span>
      <span class=chive style="left:110px;top:13px;width:7px;height:3.5px;transform:rotate(24deg)"></span>
      <span class=chive style="left:146px;top:7px;width:8px;height:3.5px;transform:rotate(-18deg)"></span>
    </div>
  </div>

  <div class=lbl>今天的滋味</div>
  <div class=w>蒸蛋</div>
  <div class=go>看看这些天的滋味</div>

  <div class=sp></div>

  <div class=zt>今天怎么样</div>
  <div class=cells>
    <i class="sh star" style="width:40px;height:40px;background:#F2913F"></i>
    <i class="sh drop" style="width:28px;height:28px;background:#E8C558"></i>
    <i class="sh blob" style="width:35px;height:35px;background:#5FBF95"></i>
    <i class="sh drop empty" style="width:26px;height:26px"></i>
    <i class="sh blob empty" style="width:31px;height:31px"></i>
    <i class="sh dot empty" style="width:23px;height:23px"></i>
  </div>

  <div class=sp></div>

  <div class=ways>
    <a>找个人说说话</a>
    <a>昨晚睡得怎么样</a>
  </div>

  <div class=live>此刻 23 人在 · 20:30 一起坐着</div>

  <div class=sp2></div>

  <div class=main>
    <div class=t>我现在不太好</div>
    <div class=ln></div>
    <div class=s>试试含一口水，慢慢感受</div>
  </div>
  <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>
<div class=cap><b>v9 · 零容器</b>　<i>删掉的是那场卡的框和主入口的胶囊，功能一个没少。碗是全屏唯一允许有重量的实体，六格是唯一的彩色，其余全是字。触区靠 13px 上下 padding 撑到 44px，不靠可见的框。</i></div>
</div>
</html>
