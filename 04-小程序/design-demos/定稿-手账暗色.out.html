<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>定稿 · 手账暗色</title>
<style>
/* ══════════════════════════════════════════════════════════════
   定稿 · 手账暗色  =  乙的骨架 + 甲的暗色 + 滋味卡走甲的纸卡

   她的三条指示：
     1. 骨架用乙（手账页：装订侧竖排日期、缩进层次、手写下划线加箭头、手绘横线）
     2. 颜色换成甲的暗色（#171310 深褐 + 两团氛围光）
     3. 滋味卡那屏按甲走（暗底 + 米白纸卡 + 插画）
     4. 首页试着放 v12 那个碗，不好看就不放

   换到暗底后有一处必须改：乙的主 accent 是靛蓝 #2F4858，
   那是纸上的颜色——放到 #171310 的暗底上它几乎消失。
   所以暗底版的 accent 换成黄铜（岸上的灯），冷侧用青玉，
   两个都是产品 tokens 里已有的色，不新发明。
   ══════════════════════════════════════════════════════════════ */

:root{
  --ink:#171310;            /* 夜 */
  --paper:#F4EDE3;          /* 纸（只在滋味卡那张纸上） */
  --paper2:#EFE6D8;
  --on-paper:#2E2620; --on-paper-2:#7C7266;
  --fg:#E9DFD1; --fg2:#9A8F80; --fg3:#6E6558;
  --brass:#C9A063;          /* 暗底上的主 accent，替掉乙的靛蓝 */
  --jade:#8CC1AA;           /* 冷侧 */
  --clay:#CB7E62;           /* 只给急救线 */
  --sans:-apple-system,"PingFang SC","HarmonyOS Sans SC",sans-serif;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{ background:#0B0A08; color:var(--fg); font-family:var(--sans);
      padding:52px 40px 90px; -webkit-font-smoothing:antialiased; }
.hd{ max-width:900px; margin:0 auto 40px }
.hd h1{ font-size:26px; font-weight:600 }
.hd .sub{ color:var(--fg2); font-size:14.5px; line-height:1.8; margin-top:11px }
.hd .sub b{ color:var(--brass); font-weight:500 }
.grpttl{ max-width:900px; margin:64px auto 20px; font-size:15px; color:var(--fg2);
         font-family:var(--mono); letter-spacing:.06em }
.rail{ display:flex; gap:28px; justify-content:center; flex-wrap:wrap }
.unit{ width:390px }
.unit > figcaption{ font-family:var(--mono); font-size:11.5px; color:var(--fg3);
                    margin-top:11px; letter-spacing:.03em }
.unit > figcaption b{ color:var(--brass); font-weight:400 }
.h-num{ font-family:var(--mono); font-size:11px; color:var(--brass);
        letter-spacing:.1em; margin-top:4px }

/* ── 一屏 ─────────────────────────────────────────────────── */
.scr{
  width:390px; height:844px; border-radius:38px; overflow:hidden; position:relative;
  background:var(--ink); display:flex; flex-direction:column;
  padding:70px 28px 30px 56px;      /* 左边给装订侧留位 */
}
/* 纯色底是廉价感最大的来源。两团氛围光，一暖一冷。 */
.scr::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(118% 60% at 80% -8%, rgba(201,160,99,.115), transparent 62%),
    radial-gradient(94% 48% at 4% 105%,  rgba(47,72,88,.17),   transparent 66%);
}
.scr > *{ position:relative; z-index:1 }

/* ── 装订侧：竖排日期 + 一道线（乙的骨架，颜色换暖） ────────── */
.spine{
  position:absolute; left:0; top:0; bottom:0; width:32px; z-index:3;
  border-right:1px solid rgba(201,160,99,.16);
  display:flex; align-items:flex-start; justify-content:center; padding-top:70px;
}
.spine span{ writing-mode:vertical-rl; font-family:var(--mono); font-size:10.5px;
             letter-spacing:.22em; color:var(--fg3) }
.spine .mk{ position:absolute; top:32px; left:50%; transform:translateX(-50%);
            width:6px; height:6px; border-radius:50%; background:var(--brass);
            box-shadow:0 0 8px rgba(201,160,99,.6) }

/* ── 字 ───────────────────────────────────────────────────── */
.h{ font-size:34px; font-weight:600; line-height:1.3 }
.h.sm{ font-size:23px; font-weight:600 }
.name{ font-family:var(--hand); font-size:48px; line-height:1.04; letter-spacing:.06em }
.name.sm{ font-size:38px }

/* ── 出血版的食物名按字数分档 ────────────────────────────────
   30 个名字从 2 字到 8 字，单一字号服务不了两端：「饺子」在小字号下右边空一大块，
   「刚捞出来的那片肉」在大字号下折成四行。分布是 24/30 都是 2-3 字，主流该用大字号。

   分档之后名字块的高度自动拉平——两字一行 72px ≈ 八字两行 36px，都约 76px 高，
   版面不会因为今天的名字长短而跳。相邻档差 20-30%，是层次不是渐变。

   小程序里写成 class="name n{{food.length}}"。 */
#s-bleed .name{ font-size:72px }                                  /* 2 字 · 12 个 */
#s-bleed .name.n3{ font-size:60px }                               /* 3 字 · 12 个 */
#s-bleed .name.n4, #s-bleed .name.n5{ font-size:46px }            /* 4-5 字 · 4 个 */
#s-bleed .name.n6, #s-bleed .name.n7,
#s-bleed .name.n8{ font-size:36px }                               /* 6+ 字 · 2 个 */
/* 出血版的名字有 58% 宽可用（插画只占右半），balance 让最长的
   「刚捞出来的那片肉」折成 3 行而不是 4 行，不至于把色票挤下去 */
#s-bleed .grp[style*="58%"], #s-bleed .name{ text-wrap:balance }
.p{ font-size:15px; line-height:1.9; color:var(--fg2) }
.note{ font-size:12.5px; line-height:1.8; color:var(--fg3) }
.eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--fg3) }
.quote{ font-family:var(--hand); font-size:20px; line-height:1.72; letter-spacing:.04em }
.live{ font-family:var(--mono); font-size:11.5px; color:var(--brass); letter-spacing:.06em }
.live i{ font-style:normal; color:var(--fg3) }

/* ── 手绘横线：两端细中间粗，像笔画过。暗底上用暖光 ─────────── */
.rule{ height:2px; border-radius:2px; background:linear-gradient(90deg,
       rgba(201,160,99,0) 0%, rgba(201,160,99,.24) 12%, rgba(201,160,99,.30) 52%,
       rgba(201,160,99,.11) 86%, rgba(201,160,99,0) 100%) }

/* ── 入口 = 手写下划线 + 手画箭头（乙），线换成暖光（甲） ────── */
.go{ display:inline-flex; align-items:baseline; gap:9px; font-size:16.5px;
     position:relative; padding-bottom:7px; align-self:flex-start; color:var(--fg) }
.go::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
  border-radius:2px; background:linear-gradient(90deg, rgba(201,160,99,.52) 0%,
  rgba(201,160,99,.34) 64%, rgba(201,160,99,0) 100%) }
.go i{ font-style:normal; color:var(--brass); font-size:14px }
.go.dim{ font-size:14.5px; color:var(--fg2) }
.go.dim::after{ background:linear-gradient(90deg, rgba(233,223,209,.20),
                rgba(233,223,209,0) 82%) }
/* 主入口：一道黄铜马克笔涂过（乙的做法，暗底上提亮） */
.go.main{ font-size:27px; font-weight:600; padding:2px 12px 8px 6px; margin-left:-6px }
.go.main::before{ content:""; position:absolute; left:0; right:0; bottom:4px; height:15px;
  z-index:-1; border-radius:2px; background:linear-gradient(90deg,
  rgba(201,160,99,.30), rgba(201,160,99,.10) 78%, rgba(201,160,99,0)) }
.go.main::after{ background:linear-gradient(90deg, var(--brass),
                 rgba(201,160,99,.28) 70%, rgba(201,160,99,0)) }
/* 并列的选择：前面一个小方块当项目符号（乙），缩进递进 */
.opt{ display:flex; align-items:baseline; gap:12px; font-size:22px; font-weight:500 }
.opt em{ width:11px; height:11px; flex:none; border-radius:1px; background:var(--c);
         transform:translateY(-3px) rotate(-6deg); font-style:normal;
         box-shadow:0 0 10px -3px var(--c) }

/* ── 六格：六张小色票，贴上去的（乙）。空票在暗底上是描边 ───── */
.chips{ display:flex; gap:9px }
.chip{ width:26px; height:34px; border-radius:1px; flex:none;
       border:1px solid rgba(233,223,209,.13); background:rgba(233,223,209,.02) }
.chip.on{ border-color:transparent; background:var(--c);
          box-shadow:0 2px 8px -3px rgba(0,0,0,.7), 0 0 12px -6px var(--c) }
.chip.on:nth-child(odd){ transform:rotate(-2.5deg) }
.chip.on:nth-child(even){ transform:rotate(1.8deg) }
.chip.next{ border-style:dashed; border-color:rgba(201,160,99,.5) }

/* ── 插画：直接放暗底，只露一半，靠光晕托起来 ─────────────
   不垫纸。深色主体的那几张（烤红薯／糖炒栗子／可乐）就靠光晕把身后的暗底
   提亮，让它们浮出来 —— 这是 v12 那个碗的做法。

   只露一半：插画放大到 300px 从右边缘出血，右半裁掉。
   transform-origin 往左偏，让食物主体落在露出来的那半边，
   否则裁完剩下的是 SVG 四周的空白。 */
.bowl{ position:relative; display:block }
.bowl svg{ display:block; width:100%; height:auto; position:relative; z-index:1 }
/* 光晕：比 v12 更强 —— 这里要托的不只是米白的碗，还有深褐的烤红薯 */
.bowl::before{
  content:""; position:absolute; z-index:0;
  left:-6%; right:6%; top:6%; bottom:-4%;
  background:radial-gradient(56% 54% at 42% 50%,
             rgba(201,160,99,.34) 0%, rgba(201,160,99,.16) 40%,
             rgba(201,160,99,.05) 64%, transparent 82%);
  filter:blur(3px);
}
/* 出血版：放大、只露左半 */
.bowl.bleed{ position:absolute; right:-148px; top:2px; width:300px; z-index:0;
  /* 左边缘淡出：SVG 左下角那块几何配重会落在色票同一水平线上，
     读起来像第七个色票。淡出正好把它化掉，而且边缘融进暗底比硬切好看——
     硬边是把插画当图片，淡出是把它当光。
     ⚠️ mask-image 在 WXSS 的支持度要真机验，退路是给插画左侧盖一层
        与底同色的渐变（background 认渐变，一定能过）。 */
  mask-image:linear-gradient(96deg, transparent 2%, rgba(0,0,0,.55) 18%, #000 40%, #000 100%);
  -webkit-mask-image:linear-gradient(96deg, transparent 2%, rgba(0,0,0,.55) 18%, #000 40%, #000 100%) }
.bowl.bleed svg{ transform:scale(1.16); transform-origin:34% 52% }
.bowl.bleed::before{ left:-14%; right:22%; top:2%; bottom:-8%;
  background:radial-gradient(52% 56% at 34% 50%,
             rgba(201,160,99,.40) 0%, rgba(201,160,99,.19) 38%,
             rgba(201,160,99,.06) 62%, transparent 80%) }
/* 居中版：整张完整居中 */
.bowl.mid{ position:relative; width:100%; margin:0 4px 0 -8px }

/* ── 涨潮：水面那条线才是水位，面只要极淡 ───────────────────── */
.rise{ position:absolute; left:0; right:0; bottom:0; height:212px; z-index:0;
       pointer-events:none }
.rise::before{ content:""; position:absolute; left:-22%; right:-22%; top:26px; bottom:-90px;
  border-radius:50% 50% 0 0 / 68px 68px 0 0;
  background:linear-gradient(180deg, rgba(47,72,88,.09) 0%, rgba(47,72,88,.03) 62%,
             transparent 100%) }
.rise::after{ content:""; position:absolute; left:-22%; right:-22%; top:26px; height:70px;
  border-radius:50% 50% 0 0 / 68px 68px 0 0;
  border-top:1px solid rgba(140,193,170,.34);
  mask-image:linear-gradient(90deg, transparent 4%, #000 26%, #000 74%, transparent 96%) }

/* ── 滋味卡那张纸（甲）：角是直的、微旋转、有落在暗底的影 ───── */
.sheet{
  background:linear-gradient(168deg, var(--paper) 0%, var(--paper2) 100%);
  border-radius:3px; transform:rotate(.5deg); flex:none;
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,
             0 18px 34px -16px rgba(0,0,0,.74), 0 3px 8px -3px rgba(0,0,0,.5);
  padding:24px 22px 18px;
}
.sheet .bowl::before{ display:none }   /* 纸上不需要光晕 */
.sheet .cap{ display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  color:var(--on-paper-2); margin-bottom:4px }

.sheet .name{ color:var(--on-paper) }
.sheet .desc{ font-size:13.5px; line-height:1.85; color:var(--on-paper-2); margin-top:8px }
.sheet .fl{ font-family:var(--mono); font-size:9px; letter-spacing:.14em;
            color:#A79C8C; margin-top:11px }

.sos{ display:flex; justify-content:space-between; font-size:13px; color:var(--clay);
      padding-top:15px; flex:none; border-top:1px solid rgba(203,126,98,.2) }
.spacer{ flex:1 1 auto; min-height:0 }
.grp{ display:flex; flex-direction:column }
.g4{gap:4px} .g6{gap:6px} .g8{gap:8px} .g10{gap:10px} .g12{gap:12px} .g14{gap:14px}
.g16{gap:16px} .g18{gap:18px} .g20{gap:20px} .g22{gap:22px} .g24{gap:24px}
.g26{gap:26px} .g28{gap:28px} .g30{gap:30px} .g32{gap:32px}
.mt6{margin-top:6px} .mt8{margin-top:8px} .mt10{margin-top:10px} .mt12{margin-top:12px}
.mt14{margin-top:14px} .mt16{margin-top:16px} .mt18{margin-top:18px} .mt20{margin-top:20px}
.mt22{margin-top:22px} .mt24{margin-top:24px} .mt26{margin-top:26px} .mt28{margin-top:28px}
.mt34{margin-top:34px} .mt40{margin-top:40px} .mt46{margin-top:46px} .mt50{margin-top:50px} .mt64{margin-top:64px}
.in1{margin-left:16px} .in2{margin-left:30px}
</style></head><body>

  <h1>定稿 · 手账暗色</h1>
  <p class="sub">
    乙的手账骨架 + 甲的暗色 + 滋味卡走甲的纸卡。换到暗底后有一处必须改：
    乙的主 accent 是靛蓝，那是纸上的颜色，放到 #171310 上几乎消失——
    所以暗底版改用<b>黄铜</b>做 accent、<b>青玉</b>做冷侧，两个都是产品 tokens 里已有的色。<br>
    首页那个碗给了三版，<b>下面第一组是给你选的</b>：出血 / 居中 / 不放。每版都标了实测高度。
  </p>
</div>
