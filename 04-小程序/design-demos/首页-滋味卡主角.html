<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 · 滋味卡主角</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C4B8A6; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0907;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0b0907ee;
     border-bottom:1px solid #221c15;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.55;max-width:390px}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #262019;box-shadow:0 26px 60px #0007;background:#100c08}

/* ═══ 光场：今天这顿饭的颜色 + 今天记过的情绪色，混在一起 ═══
   蒸蛋＝米黄蛋黄；情绪色从记录里来。光是背景层，不占文档流，
   所以功能区拿到全部垂直空间——罐子放不下的问题，换成光就没有了。 */
.field{position:absolute;left:0;right:0;top:0;height:466px;overflow:hidden}
.b{position:absolute;border-radius:50%;filter:blur(56px)}
.b1{width:300px;height:280px;left:38px;top:20px;background:#F0CE78;opacity:.62}   /* 蒸蛋的蛋黄 */
.b2{width:248px;height:230px;left:-56px;top:78px;background:#E08A57;opacity:.48}  /* 暖端情绪 */
.b3{width:214px;height:200px;right:-46px;top:52px;background:#8CC1AA;opacity:.32} /* 冷端情绪 */
.b4{width:172px;height:160px;left:128px;top:180px;background:#B49AD4;opacity:.26}
.veil{position:absolute;left:0;right:0;top:0;height:466px;
      background:linear-gradient(180deg,transparent 0,transparent 52%,#100c08b0 74%,#100c08 100%)}

.in{position:relative;height:100%;padding:44px 28px 22px;display:flex;flex-direction:column}
.day{font-size:10.5px;letter-spacing:.4em;color:var(--paper2);opacity:.7;text-indent:.4em}

/* 滋味：主角。名字用行楷、大、带光——它是这一天的名字，不是一条数据 */
.taste{padding:64px 0 0;text-align:center}
.taste .lbl{font-size:10.5px;letter-spacing:.36em;color:#E4D6BE;opacity:.9;text-indent:.36em}
.taste .w{font-family:var(--hand);font-size:66px;color:#FFF6E4;line-height:1.06;margin:14px 0 0;
          text-shadow:0 0 40px #E8C87A66,0 0 90px #D98C6344,0 2px 10px #0006}
.taste .go{font-size:12.5px;color:#E0D2BC;opacity:.72;margin:16px 0 0;letter-spacing:.1em}

.spacer{flex:1;min-height:10px;max-height:40px}
.spacer2{flex:1.6;min-height:12px}

/* ── 区二 · 记一笔与回头看 ── */
.zt{font-size:11px;letter-spacing:.2em;color:var(--paper3);padding:0 0 12px}
/* 六格改成有机形状：一格是一次进食，记过的染那个词的颜色，没记的只是一圈淡痕。
   大小和圆角刻意都不一样——等大等圆的六个方块正是那股模板味的来源。 */
.cells{display:flex;align-items:flex-end;gap:10px;padding:0 2px 12px}
.cells i{flex:1;display:block}
.s1{height:42px;border-radius:50% 50% 46% 54%;margin-bottom:0}
.s2{height:31px;border-radius:54% 46% 50% 50%;margin-bottom:7px}
.s3{height:37px;border-radius:48% 52% 56% 44%;margin-bottom:2px}
.s4{height:29px;border-radius:50%;margin-bottom:9px}
.s5{height:35px;border-radius:44% 56% 50% 50%;margin-bottom:3px}
.s6{height:27px;border-radius:52% 48% 46% 54%;margin-bottom:11px}
.blank{border:1px dashed rgba(244,237,227,.22);background:rgba(244,237,227,.022)}
.why{font-size:12.5px;color:var(--paper3);padding:0 0 14px}
/* 三个入口：无箭头、无分隔线。起头一个小色点，和六格同一套形状语言 */
.ways a{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:15.5px;color:var(--paper2)}
.ways em{width:9px;height:9px;flex:none;font-style:normal;display:block}

/* ── 区三 · 那场。一张有厚度的牌，不是通用圆角卡 ── */
.zone3{margin-top:24px;position:relative}
.sess{position:relative;border-radius:14px;padding:15px 17px 14px;
      background:linear-gradient(158deg,#241d15,#1b1610);
      border:1px solid rgba(201,160,99,.20);
      box-shadow:0 10px 26px #00000077,inset 0 1px 0 rgba(255,240,214,.07)}
.sess .t{font-family:var(--hand);font-size:20px;color:#F0DCB8;letter-spacing:.02em}
.sess .r{display:flex;align-items:center;gap:8px;padding:10px 0 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)}
.sess .r b{font-size:13px;color:var(--jade);font-weight:400;letter-spacing:.03em}
.sess .r span{margin-left:auto;font-size:13px;color:var(--paper3)}

/* ── 区四 · 急救。暖光胶囊，不是实心方块 ── */
.main{margin:22px 0 0;border-radius:30px;padding:19px;text-align:center;font-size:21px;
      color:#FFF4E4;letter-spacing:.08em;
      background:radial-gradient(130% 170% at 50% 0%,#7E4835 0%,#4B2B21 60%,#33201A 100%);
      box-shadow:0 0 34px #CB7E6230,inset 0 1px 0 #ffffff12}
.sub{text-align:center;font-size:13px;color:var(--paper3);padding:13px 0 0}
.foot{display:flex;justify-content:space-between;padding:16px 4px 0}
.foot span{font-size:13px;color:var(--clay);opacity:.82}
</style>

<div class=lab>首页 · <b>滋味卡主角</b>　<span style="color:#5a5147">｜光场＝这顿饭的颜色＋今天的情绪色，背景层不占空间；六格换成有机形状；罐子留给情绪瓶子屏</span></div>

<div class=wrap>
<div class=ph>
  <div class=field>
    <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
    <div class=veil></div>
  </div>
  <div class=in>
    <div class=day>八月廿七</div>

    <div class=taste>
      <div class=lbl>今天的滋味</div>
      <div class=w>蒸蛋</div>
      <div class=go>看看这些天的滋味 ›</div>
    </div>

    <div class=spacer></div>

    <div class=zt>今天怎么样</div>
    <div class=cells>
      <i class="s1" style="background:linear-gradient(150deg,#E8A87C,#C2603C)"></i>
      <i class="s2" style="background:linear-gradient(150deg,#E8C081,#B98B4C)"></i>
      <i class="s3" style="background:linear-gradient(150deg,#A6DAC0,#6FA48D)"></i>
      <i class="s4 blank"></i>
      <i class="s5 blank"></i>
      <i class="s6 blank"></i>
    </div>
    <div class=why>为什么 ›</div>

    <div class=ways>
      <a><em style="background:#B6A8D6;border-radius:50% 50% 46% 54%"></em>情绪瓶子</a>
      <a><em style="background:#98BFD4;border-radius:54% 46% 50% 50%"></em>昨晚睡得怎么样</a>
      <a><em style="background:#E8C081;border-radius:48% 52% 56% 44%"></em>找个人说说话</a>
    </div>

    <div class=zone3>
      <div class=sess>
        <div class=t>20:30 · 十五分钟 · 一起坐着</div>
        <div class=r><span class=dot></span><b>此刻 23 人在</b><span>那场是什么 ›</span></div>
      </div>
    </div>

    <div class=spacer2></div>
    <div class=main>我现在不太好</div>
    <div class=sub>试试含一口水，慢慢感受</div>
    <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
</div>
<div class=cap><b>滋味卡当主角</b>　<i>光场是背景层，功能区拿到全部垂直空间。六格是六次进食，形状大小圆角刻意都不同——等大等圆的方块正是模板味的来源；三个入口的小色点和六格同一套形状语言，整屏一个视觉母题。</i></div>
</div>
</html>
