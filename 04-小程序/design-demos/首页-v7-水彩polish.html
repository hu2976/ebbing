<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 v7 · 水彩 polish</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#C8BCAA; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
  --gut:26px;              /* 全屏唯一一条左对齐线 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0806;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0a0806ee;
     border-bottom:1px solid #1f1a14;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.55;max-width:390px}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #241e18;box-shadow:0 26px 60px #0008;background:#0C0906}
.in{position:relative;height:100%;padding:40px var(--gut) 20px;display:flex;flex-direction:column}
.day{text-align:center;font-size:10.5px;letter-spacing:.42em;color:var(--paper3);opacity:.7;text-indent:.42em}

/* ══════════ 一碗蒸蛋 · 水彩质感 ══════════
   水彩和写实的差别不在"淡"，在三件事：
   1 边缘沉积 —— 水彩干燥时颜料往边缘聚，所以外圈比中心深（inset 环形阴影）
   2 颜色不匀 —— 几摊颜色错位叠着，有深有浅，不是一个干净渐变
   3 洇出边界 —— 颜色略微越过轮廓线，笔没那么听话
   蒸蛋仍然是滑的，所以是水彩不是蜡笔：蜡笔的颗粒感会让它读成烙饼。 */
.dish{position:relative;height:236px;margin:16px 0 0}
.warm{position:absolute;left:50%;top:54px;transform:translateX(-50%);
      width:296px;height:186px;border-radius:50%;filter:blur(42px);
      background:radial-gradient(circle,#EBC46E5c 0%,#C4884828 46%,transparent 72%)}
.shadow{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
        width:200px;height:24px;border-radius:50%;filter:blur(13px);background:#00000088}

/* 碗：水彩的陶。三摊错位的颜色 + 边缘沉积，不是单向渐变 */
.bowl{position:absolute;left:50%;top:66px;transform:translateX(-50%);
      width:222px;height:124px;
      border-radius:6px 6px 110px 110px / 6px 6px 116px 116px;
      background:
        radial-gradient(ellipse 52% 46% at 24% 22%,#F3EADB,transparent 72%),
        radial-gradient(ellipse 44% 54% at 78% 40%,#CBBBA1,transparent 70%),
        radial-gradient(ellipse 100% 100% at 50% 54%,transparent 70%,#7f6e5690 92%,#6d5c4590 100%),
       radial-gradient(ellipse 70% 60% at 50% 88%,#94836B,transparent 76%),
        linear-gradient(178deg,#E7DCCA 0%,#D3C5AF 40%,#AB9A80 100%);
      box-shadow:inset 0 -12px 24px #8b7a6150,
                 inset 0 0 14px 5px #7d6d5738,   /* 边缘沉积 */
                 0 10px 24px #00000068}
.bowl::after{content:'';position:absolute;left:15px;top:14px;width:32px;height:72px;
             border-radius:50%;filter:blur(10px);background:#FFFDF6;opacity:.30}
/* 洇出：碗左下有一小片颜色越过了轮廓 */
.bleed{position:absolute;left:50%;top:150px;transform:translateX(-108px);
       width:52px;height:30px;border-radius:50%;filter:blur(9px);
       background:#B29A7a;opacity:.34}

.rim{position:absolute;left:50%;top:56px;transform:translateX(-50%);
     width:230px;height:40px;border-radius:50%;
     background:linear-gradient(180deg,#F4ECDD,#C6B8A0);
     box-shadow:0 2px 5px #00000055}
.rim-in{position:absolute;left:50%;top:62px;transform:translateX(-50%);
        width:210px;height:31px;border-radius:50%;background:#8A7860}

/* 蛋羹：四摊错位的黄 + 一圈边缘沉积 */
.egg{position:absolute;left:50%;top:64px;transform:translateX(-50%);
     width:202px;height:29px;border-radius:50%;overflow:hidden;
     background:
       radial-gradient(ellipse 46% 62% at 32% 32%,#FCF1C6,transparent 70%),
       radial-gradient(ellipse 40% 54% at 68% 60%,#E9CE86,transparent 68%),
       radial-gradient(ellipse 36% 48% at 84% 30%,#D6B265,transparent 72%),
       radial-gradient(ellipse 100% 104% at 50% 50%,transparent 66%,#B98F3Ea8 88%,#A67A32c8 100%),
       radial-gradient(ellipse 70% 90% at 46% 44%,#F4E1A4,#DDBE72 72%,#C9A555 100%);
     box-shadow:inset 0 2px 5px #fffdf0aa,
                inset 0 0 7px 3px #b8913f4a,     /* 边缘沉积 */
                0 0 24px #EBC46E4a}
.egg::before{content:'';position:absolute;left:28px;top:5px;width:70px;height:10px;
             border-radius:50%;background:#FFFDF2;opacity:.62;filter:blur(2.6px)}
.egg::after{content:'';position:absolute;right:34px;top:15px;width:34px;height:5px;
            border-radius:50%;background:#FFF8DC;opacity:.42;filter:blur(2px)}
.chive{position:absolute;border-radius:44% 56% 50% 50%;background:#75A063;opacity:.88}

.taste{text-align:center;margin:4px 0 0}
.taste .lbl{font-size:10.5px;letter-spacing:.36em;color:var(--paper2);opacity:.82;text-indent:.36em}
.taste .w{font-family:var(--hand);font-size:43px;color:#FBEDCF;line-height:1.2;margin:6px 0 0;
          text-shadow:0 0 30px #E8C87A4a}
.taste .go{font-size:12px;color:var(--paper3);margin:10px 0 0;letter-spacing:.08em}

.spacer{flex:1;min-height:8px;max-height:26px}
.spacer2{flex:1;min-height:10px}

/* ══ 三个板块：情绪（六格＋瓶子）｜四个人｜睡眠 ══
   都是独立板块，所以都靠 3px 的色标起头 —— 单行也能读成一块，而不是列表的一行。
   色标全部落在同一条竖线上（--gut），文字缩进一致：全屏只有一条左对齐线。 */
.blk{position:relative}
.blk+.blk{margin-top:26px}
.blk::before{content:'';position:absolute;left:-13px;top:3px;bottom:3px;width:3px;
             border-radius:2px;background:var(--mk)}
.bt{font-size:11px;letter-spacing:.2em;color:var(--paper2);opacity:.8;padding:0 0 11px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:15.5px;color:var(--paper2)}
.row i{font-style:normal;font-size:14px;color:var(--paper3);opacity:.62}

.cells{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 0 10px}
.sh{display:block;flex:none;position:relative}
.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.drop{border-radius:50% 50% 50% 8px;transform:rotate(-12deg)}
.blob{border-radius:58% 42% 46% 54% / 52% 56% 44% 48%}
.dot{border-radius:50%}
.empty{border:1px solid rgba(244,237,227,.16);background:transparent!important}

.sess{margin-top:34px;border-radius:16px;padding:14px 16px 13px;
      background:linear-gradient(158deg,#251E15,#191410);
      border:1px solid rgba(201,160,99,.22);
      box-shadow:0 10px 24px #00000077,inset 0 1px 0 rgba(255,240,214,.08)}
.sess .t{font-family:var(--hand);font-size:20px;color:#F2DEBC}
.sess .r{display:flex;align-items:center;gap:8px;padding:9px 0 0}
.ld{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)}
.sess .r b{font-size:13px;color:var(--jade);font-weight:400}
.sess .r span{margin-left:auto;font-size:13px;color:var(--paper3)}

.main{border-radius:32px;padding:19px;text-align:center;font-size:21px;
      color:#FFF6E8;letter-spacing:.08em;
      background:radial-gradient(130% 175% at 50% 0%,#8B523B 0%,#4E2D22 58%,#311F19 100%);
      box-shadow:0 0 38px #CB7E6238,inset 0 1px 0 #ffffff16}
.sub{text-align:center;font-size:13px;color:var(--paper3);padding:12px 0 0}
.foot{display:flex;justify-content:space-between;padding:15px 2px 0}
.foot span{font-size:13px;color:var(--clay);opacity:.84}
</style>

<div class=lab>首页 <b>v7</b>　<span style="color:#5a5147">｜蒸蛋改水彩（边缘沉积＋颜色不匀＋洇出）｜删「为什么」｜三板块：情绪含瓶子／四个人／睡眠，色标全在同一条竖线上</span></div>

<div class=wrap>
<div class=ph><div class=in>
  <div class=day>八月廿七</div>

  <div class=dish>
    <div class=warm></div>
    <div class=shadow></div>
    <div class=bleed></div>
    <div class=bowl></div>
    <div class=rim></div>
    <div class=rim-in></div>
    <div class=egg>
      <span class=chive style="left:56px;top:7px;width:9px;height:4px"></span>
      <span class=chive style="left:102px;top:12px;width:7px;height:3.5px;transform:rotate(24deg)"></span>
      <span class=chive style="left:136px;top:6px;width:8px;height:3.5px;transform:rotate(-18deg)"></span>
    </div>
  </div>

  <div class=taste>
    <div class=lbl>今天的滋味</div>
    <div class=w>蒸蛋</div>
    <div class=go>看看这些天的滋味 ›</div>
  </div>

  <div class=spacer></div>

  <!-- 板块一 · 情绪：六格记录 + 情绪瓶子（同一件事的记与看） -->
  <div class=blk style="--mk:linear-gradient(#E8935A,#B9A05A)">
    <div class=bt>今天怎么样</div>
    <div class=cells>
      <i class="sh star" style="width:42px;height:42px;background:#F2913F"></i>
      <i class="sh drop" style="width:29px;height:29px;background:#E8C558"></i>
      <i class="sh blob" style="width:37px;height:37px;background:#5FBF95"></i>
      <i class="sh drop empty" style="width:27px;height:27px"></i>
      <i class="sh blob empty" style="width:33px;height:33px"></i>
      <i class="sh dot empty" style="width:24px;height:24px"></i>
    </div>
    <div class=row><span>情绪瓶子</span><i>›</i></div>
  </div>

  <!-- 板块二 · 四个人 -->
  <div class=blk style="--mk:#8CC1AA">
    <div class=row><span>找个人说说话</span><i>›</i></div>
  </div>

  <!-- 板块三 · 睡眠 -->
  <div class=blk style="--mk:#7E96B8">
    <div class=row><span>昨晚睡得怎么样</span><i>›</i></div>
  </div>

  <div class=sess>
    <div class=t>20:30 · 十五分钟 · 一起坐着</div>
    <div class=r><span class=ld></span><b>此刻 23 人在</b><span>那场是什么 ›</span></div>
  </div>

  <div class=spacer2></div>

  <div class=main>我现在不太好</div>
  <div class=sub>试试含一口水，慢慢感受</div>
  <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>
<div class=cap><b>v7</b>　<i>水彩三要素：边缘沉积（外圈比中心深）／四摊错位的黄（不是干净渐变）／碗左下一小片洇出轮廓。三个板块各有色标且落在同一条竖线上，单行也读成一块。「为什么」已删。</i></div>
</div>
</html>
