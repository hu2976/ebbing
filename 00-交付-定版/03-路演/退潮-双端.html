<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 一个晚上，两端</title>
<!-- 由 .rec/build-dual.mjs 生成。样式与手机渲染器整段抽自 退潮-路演.html，别手改这个文件。 -->
<style>

:root{
 --bg:#12100E; --surface:#1F1A15; --surface2:#241E18;
 --border:rgba(244,237,227,.10); --border2:rgba(244,237,227,.05);
 --text:#F4EDE3; --muted:#BDB1A1; --faint:#968979;
 --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
 --r:14px;
 --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 22px 44px -26px rgba(0,0,0,.9);
 --sans:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
 --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
 --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.6;
 -webkit-font-smoothing:antialiased;--tide:52vh}
.deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.deck::-webkit-scrollbar{width:0}
.slide{contain:layout paint style;
 min-height:100vh;scroll-snap-align:start;position:relative;z-index:2;
 display:flex;flex-direction:column;justify-content:center;padding:12vh 7vw 8vh}
.slide>*{width:100%;max-width:1160px;margin-left:auto;margin-right:auto}
/* 两团氛围光，一暖一冷。退潮产品本来就有这个语言 */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(900px 500px at 86% -6%,rgba(201,160,99,.10),transparent 62%),
 radial-gradient(760px 440px at 2% 4%,rgba(47,72,88,.16),transparent 58%)}

/* ── 贯穿全场的水线。高度跟着屏号退，不是每屏各画一条 ───────────── */
.tide{position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none;
 /* ⚠️ 别 transition height。动 height 每帧都要重新布局 + 重绘这张铺满屏宽的 SVG，
     滚动时一路掉帧（她的原话：会卡）。固定高度、只动 transform，交给合成层。 */
 height:70vh;will-change:transform;
 transform:translateY(calc(70vh - var(--tide)));
 transition:transform 1.05s cubic-bezier(.25,.7,.3,1)}
.tide svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.tide .body{fill:url(#tg)}
.tide .crest{fill:none;stroke:rgba(242,234,220,.13);stroke-width:1.5}

/* ── 装订侧：和产品同一本册子 ───────────────────────────────── */
.binder{position:fixed;left:3.4vw;top:0;bottom:0;width:1px;background:rgba(201,160,99,.16);z-index:6}
.bmark{position:fixed;left:calc(3.4vw - 3.5px);top:26px;width:8px;height:8px;border-radius:50%;
 background:var(--brass);z-index:7;box-shadow:0 0 16px -1px var(--brass)}

/* ── 顶栏（乙）。丙那三屏隐掉，让开场干净 ─────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;
 padding:14px 7vw;background:#12100E;
 border-bottom:1px solid var(--border2);transition:opacity .5s}
body.quiet .topbar{opacity:0;pointer-events:none}
.topbar .brand{font-weight:600;display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.04em}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brass);
 box-shadow:0 0 14px -2px var(--brass)}
.topbar .pg{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--faint)}

/* ── 开场的照片：右侧出血，左缘和下缘都渐隐进暗底，不做硬边矩形 ── */
.slide .photo{position:absolute;right:0;top:0;bottom:0;width:54%;z-index:0;pointer-events:none;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:58% 42%;
 opacity:.52}
.photo::after{content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,#12100E 0%,rgba(18,16,14,.92) 22%,rgba(18,16,14,.22) 62%,rgba(18,16,14,.55) 100%),
 linear-gradient(180deg,rgba(18,16,14,.75) 0%,transparent 26%,transparent 62%,#12100E 100%)}
@media (max-width:1100px){.photo{opacity:.45;width:72%}}

/* ── 负面词云：s1 上模糊到近乎只是质感，s2 上变清晰 ────────────
   ⚠️ 词取自公开可检索的常见说法，不引用任何具体的人 —— 编造平台评论
   等于把捏造的东西当证据摆在评委面前。 */
.slide .cloud{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud span{position:absolute;font-family:var(--sans);font-weight:600;white-space:nowrap;
 color:#F4EDE3}
.cloudy .cloud{filter:blur(3px);opacity:.055;transition:filter 1.1s ease,opacity 1.1s ease}
.cloudy.sharp .cloud{filter:none;opacity:.17}
.slide.cloudy>*:not(.cloud):not(.photo){position:relative;z-index:2}
/* 左半屏压一层暗，保证字始终读得清 —— 照片再好看也不能吃掉文字 */
.slide.cloudy::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(90deg,#12100E 0%,rgba(18,16,14,.94) 34%,rgba(18,16,14,.5) 56%,transparent 76%)}
/* 词云在正文那一带要更淡，否则字和词叠在一起谁都读不了 */
.cloudy.sharp .cloud{opacity:.13}
.cloudy.sharp .cloud::after{content:"";position:absolute;left:0;right:0;top:22%;bottom:12%;
 background:radial-gradient(70% 60% at 34% 50%,rgba(18,16,14,.88),transparent 72%)}


/* ── 丙：一屏一句 ──────────────────────────────────────────── */
.q-line{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;
 font-size:clamp(32px,4.6vw,62px);line-height:1.42;max-width:17em}
.q-line b{font-weight:600;color:var(--brass)}
.q-after{margin-top:clamp(18px,3.2vh,38px);font-size:clamp(15px,1.28vw,18px);line-height:2.05;
 color:var(--muted);max-width:42em}
.q-note{margin-top:clamp(20px,3.4vh,42px);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
 line-height:2.05;color:var(--faint);max-width:60em}
.q-note b{color:var(--muted);font-weight:600}
.q-num{font-family:var(--mono);font-size:clamp(70px,13vw,168px);font-weight:500;line-height:.88;
 color:var(--brass);letter-spacing:-.02em}
.q-num s{text-decoration:none;font-size:.28em;color:var(--faint);letter-spacing:.14em;
 display:block;margin-top:.8em}
.slide.q{justify-content:flex-end;padding-bottom:16vh}
/* 背景大字：极浅，压在内容后面。不参与阅读，只给这一屏一个底 */
.slide.ghost::after{content:attr(data-ghost);position:absolute;right:5vw;bottom:6vh;z-index:0;
 font-family:var(--sans);font-weight:600;font-size:clamp(64px,11.5vw,178px);line-height:1.02;
 letter-spacing:.06em;color:rgba(244,237,227,.034);pointer-events:none;
 white-space:pre;text-align:right}
.slide.ghost>*:not(.photo):not(.cloud){position:relative;z-index:1}
/* ⚠️ 丙那几屏必须左对齐。.slide>* 那条 margin:0 auto 会把 max-width 更小的块
   （.q-line 17em / .opts 640px）在 1160px 里居中，于是标题、选项、脚注三者
   各自缩在不同的左边界上，读起来像三块没对齐的东西。全部拉回同一条左线。 */
.slide.q>*{margin-left:0;margin-right:auto}
.opts{margin-left:0;margin-right:auto}

/* ── 乙：编号 / 标题 / 卡片 ──────────────────────────────────── */
/* 唯一会自己变的那个数字，也放到这一屏的角上 —— 说的和看到的是同一件事 */
.live{position:absolute;right:7vw;top:13vh;z-index:3;font-family:var(--mono);
 width:auto;max-width:none;margin:0; /* 收掉 .slide>* 那三条 */
 font-size:13px;letter-spacing:.16em;color:var(--faint);opacity:.75}
.live::before{content:"●";color:var(--jade);font-size:9px;margin-right:9px;vertical-align:2px}
.eyebrow{display:inline-flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11.5px;
 font-weight:600;letter-spacing:.2em;color:var(--brass);margin-bottom:16px}
.eyebrow .num{min-width:26px;height:26px;padding:0 8px;border-radius:7px;display:grid;place-items:center;
 color:#241E18;background:var(--brass);font-size:12px}
h1{text-wrap:pretty;font-size:clamp(28px,3.9vw,50px);font-weight:600;letter-spacing:-.012em;
 line-height:1.24;margin-bottom:18px}
h1 .hl{color:var(--brass)}
.lead{text-wrap:pretty;font-size:clamp(15px,1.5vw,20px);color:var(--muted);line-height:1.85;
 width:100%;max-width:1160px;padding-right:26%}
.cards{display:grid;gap:15px;margin-top:22px}
.cards.c2{grid-template-columns:repeat(2,1fr)}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
 padding:18px 20px;box-shadow:var(--shadow)}
.card.hl{border-top:2px solid var(--brass)}
.card.dim{background:rgba(31,26,21,.5);border-style:dashed}
.card.bare{background:none;border:none;box-shadow:none;padding:18px 0 0}
.card .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--brass);
 letter-spacing:.14em;margin-bottom:8px}
.card .k.g{color:var(--faint)}
.card .big{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:5px}
.card p{font-size:15px;color:var(--muted);line-height:1.8}
.card p + p{margin-top:10px} /* 段间距必须明显大于行距，否则两段糊成一坨 */
.card p b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);
 border:1px solid var(--border);border-radius:999px;padding:6px 14px;background:var(--surface)}
.chip.b{border-color:rgba(201,160,99,.4);color:var(--brass);background:rgba(201,160,99,.07)}
.fig{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);
 padding:16px 18px 10px;box-shadow:var(--shadow);margin-top:18px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig text{font-family:var(--sans);fill:var(--muted);font-size:13px}
.fig .m{font-family:var(--mono);font-size:11px;fill:var(--faint);letter-spacing:.06em}
.fig .hi{fill:var(--brass);font-family:var(--mono);font-size:13px;font-weight:600}
.src{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--faint);
 line-height:2;letter-spacing:.03em;width:100%;max-width:1160px;padding-right:12%}
.src b{color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,4vw,58px);align-items:center}
@media (max-width:1000px){.two{grid-template-columns:1fr}.cards.c3,.cards.c4{grid-template-columns:1fr 1fr}}

/* ── 入场 ─────────────────────────────────────────────────── */
.slide.a .rv{animation:up .6s both cubic-bezier(.2,.7,.3,1)}
.slide.a .rv:nth-child(2){animation-delay:.08s}.slide.a .rv:nth-child(3){animation-delay:.16s}
.slide.a .rv:nth-child(4){animation-delay:.24s}.slide.a .rv:nth-child(5){animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide.a .draw{animation:draw 1.7s .35s both cubic-bezier(.3,.6,.3,1)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ── 互动：可点的选项（屏 02） ─────────────────────────────── */
.opts{display:grid;gap:12px;margin-top:26px;max-width:640px}
.opt{padding:15px 18px;cursor:pointer;
 background:rgba(31,26,21,.55);border:1px solid var(--border);border-radius:var(--r);
 transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(201,160,99,.42);background:rgba(31,26,21,.85)}
.opt.on{border-color:var(--brass);background:rgba(201,160,99,.08)}
.opt .hd{display:flex;align-items:baseline;gap:16px}
.opt .t{font-size:17px;font-weight:600;min-width:5.5em}
.opt .h{font-size:13.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em}
.opt .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
/* 收起时高度归零，不占位 —— 原来只做 opacity:0，那三行会被撑成不一样高 */
.opt .r{font-size:14px;color:var(--brass);line-height:1.75;
 max-height:0;opacity:0;overflow:hidden;transition:max-height .35s,opacity .35s,margin-top .35s}
.opt.on .r{max-height:120px;opacity:1;margin-top:9px}
.hintbar{margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint)}

/* ── 互动：翻牌（屏 13 垃圾桶那一拍） ───────────────────────── */
.flip{margin-top:26px;max-width:820px;cursor:pointer}
.flip .seen{font-family:var(--sans);font-size:clamp(36px,5.2vw,76px);font-weight:600;
 line-height:1.3;letter-spacing:-.01em}
.scene{font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--faint);
 margin-bottom:22px;padding-left:2px}
.flip .step{margin-top:20px;padding-left:22px;border-left:3px solid var(--border);
 opacity:0;max-height:0;overflow:hidden;transition:opacity .5s,max-height .5s,border-color .5s}
.flip .step.on{opacity:1;max-height:280px}
.flip .step .lb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:7px}
.flip .step .tx{font-size:clamp(17px,1.75vw,24px);line-height:1.85;color:var(--muted)}
.flip .step.s2{border-left-color:var(--brass)}
.flip .step.s2 .lb{color:var(--brass)}
.flip .step.s2 .tx{color:var(--text)}

/* ══ 手机：内嵌可交互 ══════════════════════════════════════════
   不是截图，是把真实产品文案跑在一个迷你状态机里。
   样式照 04-小程序/pages/index/index.wxss 的语言压缩而来：
   装订侧 / 手写下划线 + 手画箭头 / 黄铜小色块 / 楷体引文 / 无框按钮 */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4vw,34px);margin-top:22px}
.three .col{display:flex;flex-direction:column;align-items:center}
.three .tx{margin-top:10px;font-size:13px;line-height:1.75;color:var(--muted);text-align:left;width:100%}
.three .tx b{color:var(--text);font-weight:600}
.phone.sm{width:236px}
.phone.sm .scr{height:430px}
.phone.sm .bd{padding:44px 12px 16px 28px;font-size:13px}
.phone.sm .pf-h{font-size:16px}
.phone{width:302px;flex:none;position:relative;border-radius:38px;padding:9px;
 background:linear-gradient(160deg,#3A342C,#17140F);
 box-shadow:0 2px 0 rgba(255,255,255,.08) inset, 0 40px 70px -30px rgba(0,0,0,.95)}
.phone .scr{contain:layout paint;height:604px;border-radius:30px;overflow:hidden;background:#171310;position:relative;
 display:flex;flex-direction:column}
.phone .isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:82px;height:22px;
 border-radius:12px;background:#0B0908;z-index:9}
.phone .bd{flex:1;overflow-y:auto;padding:52px 16px 20px 34px;position:relative}
.phone .bd::-webkit-scrollbar{width:0}
.phone .bind{position:absolute;left:20px;top:0;bottom:0;width:1px;background:rgba(201,160,99,.16)}
.phone .bdot{position:absolute;left:16.5px;top:52px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.pf-ti{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);margin:16px 0 3px}
.pf-h{font-size:19px;font-weight:600;line-height:1.36;margin:2px 0 0}
.pf-food{font-family:var(--hand);font-size:29px;color:var(--brass);line-height:1.25;margin-top:2px}
.pf-p{font-size:13px;line-height:1.85;color:var(--muted);margin-top:9px}
.pf-s{font-size:11px;line-height:1.75;color:var(--faint);margin-top:8px}
.pf-box{font-family:var(--hand);font-size:16px;line-height:1.7;color:var(--text);
 border-left:2px solid var(--brass);padding-left:11px;margin-top:12px}
.pf-num{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:.05em;margin-top:9px}
.pf-hr{height:3px;width:52%;border-radius:3px;margin:15px 0 0;
 background:linear-gradient(90deg,rgba(201,160,99,0),rgba(201,160,99,.26) 52%,rgba(201,160,99,0))}
.pf-b{display:flex;align-items:baseline;gap:10px;margin-top:15px;cursor:pointer;font-size:16px;font-weight:600}
.pf-b::before{content:"";width:9px;height:9px;flex:none;border-radius:1px;background:var(--brass);
 transform:translateY(-2px) rotate(-6deg);box-shadow:0 0 9px -3px var(--brass)}
.pf-b.dg::before{background:var(--clay);box-shadow:0 0 9px -3px var(--clay)}
.pf-b.big{font-size:19px}
.pf-q{display:block;width:fit-content;margin-top:14px;font-size:14px;cursor:pointer;
 border-bottom:2px solid rgba(201,160,99,.42);padding-bottom:3px}
.pf-q::after{content:" →";color:var(--brass)}
.pf-row{display:flex;flex-direction:column;margin-top:11px}
.pf-row .rk{font-size:13.5px;font-weight:600}
.pf-row .rv{font-size:11px;color:var(--faint);line-height:1.7;margin-top:2px}
.pf-cells{display:flex;gap:6px;margin-top:11px}
.pf-cells{cursor:pointer}
.pf-cells i{flex:1;height:26px;border-radius:3px;border:1px dashed rgba(244,237,227,.16);
 transition:background .4s,border-color .4s}
.pf-cells i.just{animation:cellin .5s both}
@keyframes cellin{from{transform:scale(.82);opacity:.3}to{transform:none;opacity:1}}
.pf-cells i.on{border-style:solid;border-color:var(--brass);background:rgba(201,160,99,.14)}
.pf-foot{display:flex;gap:14px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border2)}
.pf-foot span{font-size:11px;color:var(--faint);cursor:pointer}
.pf-back{position:absolute;left:14px;top:70px;writing-mode:vertical-rl;font-family:var(--mono);
 font-size:9px;letter-spacing:.16em;color:var(--faint);cursor:pointer;z-index:3}
.phone .cap{margin-top:12px;text-align:center;font-family:var(--mono);font-size:10.5px;
 letter-spacing:.12em;color:var(--faint)}
.phone .cap b{color:var(--brass);font-weight:600}
/* 滋味卡：和产品里那张米白纸牌同一套。插画是 data/art.js 的米白主题 data URI */
/* 食物墙：三十张一览。和产品里那面墙同一套——米白纸、左上角一格那道菜的颜色 */
/* 屏 10 演示里的对话 */
.pf-chat{padding-top:4px}
.pf-chat .msg{margin-top:12px;font-size:12.5px;line-height:1.8;color:var(--muted)}
.pf-chat .msg.mine{margin-left:auto;max-width:82%;text-align:right;color:var(--text);
 font-size:13.5px;padding:8px 11px;border-radius:12px 12px 3px 12px;background:rgba(201,160,99,.13)}
.pf-chat .msg.mine2{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--brass)}
.pf-chat .who{display:block;font-family:var(--hand);font-size:18px;color:var(--text);margin-bottom:3px}
.pf-chat .who i{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.12em;
 color:var(--brass);margin-left:7px}
.pf-chat .pend{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint)}
.pf-chat .car{display:inline-block;width:1px;height:13px;background:var(--brass);
 vertical-align:-2px;margin-left:1px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pf-chat .pickrow{margin-top:18px;padding-top:12px;border-top:1px solid rgba(244,237,227,.08);
 display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pf-chat .pl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);width:100%}
.pf-chat .pk{font-family:var(--hand);font-size:16px;padding:3px 12px;border-radius:999px;
 border:1px solid rgba(244,237,227,.14);color:var(--muted)}
.pf-chat .pk.on{border-color:var(--brass);color:var(--brass);background:rgba(201,160,99,.1)}
/* 情绪瓶子：照产品的样子 —— 线稿玻璃、竖长瓶身、珠子堆在瓶底。
   产品里珠子是 canvas 跑物理落下来的，这里是静态堆叠，形态对上就行。 */
.pf-jar{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.pf-jar .jneck{width:52px;height:9px;margin-bottom:-4px;border-radius:5px 5px 2px 2px;
 border:1px solid rgba(244,237,227,.24);border-bottom:none;
 background:linear-gradient(180deg,rgba(244,237,227,.14),transparent)}
.pf-jar .jbody{position:relative;width:108px;height:148px;overflow:hidden;
 border:1px solid rgba(244,237,227,.26);
 border-radius:14px 14px 18px 18px / 16px 16px 22px 22px;
 background:radial-gradient(58% 34% at 50% 96%, rgba(201,160,99,.10), transparent 72%),
 radial-gradient(70% 50% at 50% 40%, rgba(244,237,227,.018), transparent 78%);
 box-shadow:0 0 22px -8px rgba(201,160,99,.22)}
.pf-jar .jbody i{position:absolute;border-radius:50%;opacity:.86}
.pf-jar .jgloss{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(180deg,transparent 6%,rgba(244,237,227,.16) 11%,
 rgba(244,237,227,.2) 13%,rgba(244,237,227,.05) 16%,transparent 22%),
 linear-gradient(90deg,rgba(244,237,227,.07) 0%,transparent 16%)}
.pf-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.pw{background:linear-gradient(168deg,#F4EDE3,#EFE6D8);border-radius:2px;padding:7px 6px 6px;
 min-height:56px;display:flex;flex-direction:column;gap:5px;cursor:pointer;
 box-shadow:0 6px 12px -7px rgba(0,0,0,.8)}
.pw:nth-child(3n){transform:rotate(-1.2deg)}
.pw:nth-child(3n+1){transform:rotate(.9deg)}
.pw i{width:8px;height:8px;align-self:flex-start;margin-bottom:auto}
.pw span{font-family:var(--serif);font-size:11.5px;font-weight:600;color:#2E2418;line-height:1.25}
/* 星空：一晚一颗 */
.pf-sky{position:absolute;left:0;right:0;top:0;height:60%;z-index:0;pointer-events:none;
 background:radial-gradient(140% 56% at 50% -12%, rgba(26,32,46,.55), transparent 72%)}
/* ⚠️ 星星必须有实心核。整颗都是渐变的话，1-3px 的点会被抗锯齿抹平 —— 产品里踩过 */
.pf-sky i{position:absolute;border-radius:50%}
.pf-sky i.d0{width:4px;height:4px;background:#FFFAEE;
 box-shadow:0 0 9px 1.5px rgba(201,160,99,.45)}
.pf-sky i.d1{width:2.6px;height:2.6px;background:rgba(255,248,232,.78)}
.pf-sky i.d2{width:2px;height:2px;background:rgba(244,237,227,.44)}
.pf-sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
 background:linear-gradient(180deg,transparent,#171310)}
/* 播放器 */
.pf-player{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;
 border-radius:999px;border:1px solid rgba(201,160,99,.3);background:rgba(201,160,99,.06)}
.pf-player .pl-i{color:var(--brass);font-size:11px}
.pf-player .pl-t{font-size:12.5px}
.pf-player .pl-bar{margin-left:auto;width:52px;height:2px;border-radius:2px;background:rgba(244,237,227,.16)}
/* 动物线稿 */
.pf-beast .bart{width:26px;height:26px;flex:none;background-repeat:no-repeat;
 background-position:center;background-size:100% 100%;opacity:.62}
.pf-beast.ok .bart{opacity:.85}
.pf-bhead{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.pf-bhead .bart.big{width:88px;height:88px;background-repeat:no-repeat;background-position:center;
 background-size:100% 100%;opacity:.72}
.pf-bhead .ba{font-family:var(--hand);font-size:15px;color:var(--brass);margin-top:4px}
/* 潮水：发作那几屏的环境层。canvas 在 js 里画 */
.pf-tide{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:0;pointer-events:none}
.pf-tide canvas{width:100%;height:100%;display:block}
.pf-card{background:linear-gradient(168deg,#F4EDE3,#EFE6D8);border-radius:3px;
 padding:13px 14px 11px;margin-top:10px;transform:rotate(.5deg);
 box-shadow:0 14px 26px -14px rgba(0,0,0,.85)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start}
.pc-chips{display:flex;flex-direction:column;gap:2px}
.pc-chips i{width:9px;height:9px;display:block}
.pc-no{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:#8F8571}

.pc-name{font-family:var(--serif);font-size:22px;font-weight:600;color:#2E2418;
 text-align:center;letter-spacing:.06em;margin-top:2px}
.pc-rule{height:7px;margin:8px 22px 9px;opacity:.55;background-repeat:no-repeat;
 background-position:center;background-size:100% 100%;
 background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%228%22%3E%3Cpath d=%22M2 5 C22 2, 40 6.4, 62 4 S104 1.8, 126 4.6 S168 6.8, 190 3.8 S226 2, 238 4.6%22 fill=%22none%22 stroke=%22%23A8996F%22 stroke-width=%221.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E")}
.pc-desc{font-size:11.5px;line-height:1.95;color:#5A5142;text-align:justify}
.pc-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:7.5px;
 letter-spacing:.12em;color:#8F8571;opacity:.72;margin-top:10px}
.pf-words{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pf-words span{font-size:12.5px;padding:5px 10px;border-radius:999px;
 border:1px solid rgba(244,237,227,.14);color:var(--muted)}
.pf-words.hi span{border-color:rgba(203,126,98,.45);color:var(--clay)}
.pf-men{padding:12px 0;border-bottom:1px solid rgba(244,237,227,.06)}
.pf-men .mh{display:flex;align-items:baseline;gap:9px}
.pf-men .mn{font-family:var(--hand);font-size:23px;color:var(--text)}
.pf-men .mg{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--brass)}
.pf-men .mi{font-size:11px;color:var(--faint);line-height:1.7;margin-top:3px}
.pf-men .ml{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:6px;
 padding-left:9px;border-left:2px solid rgba(244,237,227,.12)}
.pf-beast{display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px 9px;
 border-radius:3px;border:1px solid rgba(244,237,227,.10);background:rgba(244,237,227,.02)}
.pf-beast.ok{border-color:rgba(201,160,99,.34);background:rgba(201,160,99,.06)}
.pf-beast .bn{font-size:12.5px;font-weight:600;flex:1;min-width:0;line-height:1.3}
/* 动物名不许换行 ——「鸵鸟」被折成「鸵 / 鸟」比不放还糟 */
.pf-beast .ba{font-family:var(--hand);font-size:13px;color:var(--brass);
 margin-left:auto;flex:none;white-space:nowrap}
.pf-in{animation:pfin .34s both cubic-bezier(.2,.7,.3,1)}
@keyframes pfin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* 打印 = 导 PDF。给一个明确的 16:9 页面，否则内容按 A4 纵向流，
   一屏会被切成两页（实测 20 屏印出 25 页）。 */
@media print{
 @page{size:1600px 900px;margin:0}
 .topbar,.binder,.bmark,.tide,.hintbar,.phone .cap{display:none!important}
 .deck{height:auto;overflow:visible}
 .slide{width:1600px;height:900px;min-height:0;overflow:hidden;
 page-break-after:always;break-after:page;padding:60px 96px;
 background:#12100E}
 .slide:last-child{page-break-after:auto;break-after:auto}
 .slide>*{max-width:1408px}
 /* 静态纸面上把互动的两处直接摊开 —— 纸不能点 */
 .opt .r{max-height:none!important;opacity:1!important;margin-top:9px!important}
 .flip .step{max-height:none!important;opacity:1!important}
 .amb{position:absolute}
 body{--tide:0;background:#12100E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── 舞台 ────────────────────────────────────────────────── */
body{background:var(--bg);overflow:hidden}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(20px,3.4vh,44px);z-index:2}
.clock{font-family:var(--mono);font-size:clamp(16px,1.5vw,22px);letter-spacing:.3em;
  color:var(--brass);opacity:.9;transition:opacity .5s}
.pair{display:flex;gap:clamp(60px,9vw,150px);align-items:flex-start}
.side{display:flex;flex-direction:column;align-items:center;gap:16px;
  transition:opacity .8s ease, filter .8s ease}
.side.off{opacity:.2;filter:grayscale(.6) brightness(.6)}
