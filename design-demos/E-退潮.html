<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>E · 退潮</title>
<style>
/* ── E · 退潮 ────────────────────────────────────────────
   她说「别为了加而加」。前一版那些彩色 blob 是从参考图抄的，
   和「退潮」没有任何关系 —— 抽签抽来的风格，不是从内容长出来的。

   视觉母题（从产品里找，不是从风格库里找）：
   潮水退去之后，滩涂上留下一个个小水洼，每一个都映着岸上的灯。
   那就是一次记录 —— 发作过去了，留下的那点东西，还亮着。

   不引入任何新颜色：
     黄铜 = 岸上的灯（唯一的光源）
     青玉 = 水
     陶土 = 只给急救线
   温暖来自「暖光落在冷水上」的对比，不来自把所有东西调暖。
   灵动来自水的不规则 —— 水洼没有两个形状一样的。 */
:root{
  --n1:#141110; --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#8E8377;
  --lamp:#C9A063;        /* 岸上的灯 */
  --water:#8CC1AA;       /* 水 */
  --clay:#CB7E62;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
  --disp:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080605;font-family:var(--disp);color:var(--paper);
     display:flex;gap:56px;padding:56px;align-items:flex-start}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:var(--n1);}
.lbl{position:absolute;top:-30px;left:0;font-size:12px;letter-spacing:.18em;color:#6B6055;text-transform:uppercase}
.pg{position:relative;z-index:3;padding:56px 26px 22px;height:100%;display:flex;flex-direction:column}
.nav{font-size:13.5px;letter-spacing:.1em;color:var(--paper3);margin-bottom:26px}
.h{font-size:29px;font-weight:600;line-height:1.34;letter-spacing:-.01em}
.p{font-size:16px;line-height:1.82;color:var(--paper2);margin-top:16px}
.ti{font-size:12.5px;letter-spacing:.16em;color:var(--paper3);margin-bottom:16px}
.chev{color:var(--paper3);font-size:15px;font-weight:300}

/* ── 岸上那盏灯。整屏唯一的光源，一切亮处都从它来 ────────── */
.lampglow{position:absolute;left:50%;top:-14%;width:120%;height:44%;
  transform:translateX(-50%);z-index:0;pointer-events:none;
  background:radial-gradient(50% 60% at 50% 0%, rgba(201,160,99,.16), transparent 70%);}

/* ── 湿沙。退潮刚过，地是深的、湿的，越往下越湿 ─────────── */
.sand{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:0;
  background:linear-gradient(180deg, transparent, rgba(24,32,31,.55) 62%, rgba(20,30,30,.75));}
/* 潮水线：水退到哪儿，沙上留一道。一侧浓一侧淡 —— 水是斜着退的 */
.mark{position:absolute;left:-6%;right:-6%;height:1px;z-index:1;
  background:linear-gradient(90deg,transparent, rgba(140,193,170,.22) 22%, rgba(140,193,170,.10) 68%, transparent);}

/* ── 水洼 · 这一版的核心 ─────────────────────────────────
   四层，全部来自「一洼水在夜里映着一盏灯」这一件事：
   1 形状不规则，每个都不一样 —— 水不会有两洼同形
   2 水面比周围亮：它在反光，不是在发光（发光是灯的事）
   3 高光是**拉长的**一道，不是圆点 —— 水面是平的，灯拉成一条
   4 下缘一圈湿痕，比沙深 —— 水和沙的交界 */
.pool{position:relative;flex:none}
/* ⚠️ 上一版把青玉当成了「水的颜色」，结果是四块灰绿鹅卵石，一点不温暖。
   夜里的水洼**本身是黑的** —— 颜色全在它映的东西上。
   所以水体压到比沙还深，亮的部分只有灯的倒影，而灯是暖黄的。
   温暖就是这么来的：不是把水调暖，是让暖的光落在冷的水上。 */
.pool::before{content:'';position:absolute;inset:0;border-radius:inherit;
  background:
    /* 灯的倒影：偏下偏左，因为灯在岸上不在正头顶 */
    radial-gradient(58% 42% at 40% 66%, rgba(255,224,176,.46), transparent 60%),
    /* 碎开的第二块 —— 水面不平，倒影是碎的不是一整块 */
    radial-gradient(30% 22% at 68% 40%, rgba(255,232,196,.22), transparent 62%),
    linear-gradient(180deg, rgba(16,24,24,.92), rgba(9,14,14,.97));
  box-shadow:0 0 0 1px rgba(140,193,170,.11),          /* 湿痕：水和沙的交界 */
             0 1px 8px -2px rgba(201,160,99,.22);      /* 水洼把周围的沙也照亮一点 */}
.pool::after{display:none}
.pool.dry::before{background:none;box-shadow:inset 0 0 0 1px rgba(244,237,227,.09)}
.pool.dry::after{display:none}

/* 六个水洼 = 这一天的六次。形状各不相同 */
.pools{display:flex;align-items:center;gap:11px;height:58px;margin-top:2px}
.pl{width:44px;height:34px}
.p1{border-radius:64% 36% 48% 52% / 58% 44% 56% 42%;transform:rotate(-4deg)}
.p2{border-radius:38% 62% 56% 44% / 46% 62% 38% 54%;transform:rotate(6deg)}
.p3{border-radius:52% 48% 34% 66% / 62% 38% 62% 38%;transform:rotate(-8deg)}
.p4{border-radius:46% 54% 62% 38% / 40% 58% 42% 60%;transform:rotate(3deg);width:50px;height:36px}

/* 滋味卡：不是卡片，是水面上映着的那一片。上沿是水线 */
.taste{position:relative;margin-top:4px;padding:26px 24px 30px;overflow:hidden;
  border-radius:4px 4px 20px 20px;
  background:
    radial-gradient(100% 130% at 22% 118%, rgba(201,160,99,.20), transparent 64%),
    linear-gradient(176deg, rgba(140,193,170,.075), rgba(26,36,35,.62));}
.taste::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.34) 30%,rgba(140,193,170,.12) 78%,transparent);}
/* 水面上那道拉长的灯影 */
/* 灯影挪到品名下方 —— 上一版横穿「草莓」两个字，读起来像被划掉了 */
.taste::after{content:'';position:absolute;left:8%;right:44%;bottom:16px;height:5px;
  border-radius:50%;background:rgba(255,226,180,.34);filter:blur(3px)}
.food{font-family:var(--hand);font-size:42px;color:#F0D2A0;letter-spacing:.07em;
      line-height:1.2;position:relative;z-index:2;
      display:flex;justify-content:space-between;align-items:baseline}
.food .chev{font-family:var(--disp);font-size:15px}
.fsub{font-size:12.5px;color:var(--paper3);letter-spacing:.16em;margin-bottom:10px;position:relative;z-index:2}

/* 入口：一道潮痕分隔，不是卡片也不是边框 */
.row{display:flex;justify-content:space-between;align-items:center;
     padding:17px 2px;font-size:16px;color:var(--paper2);position:relative}
.row+.row::before{content:'';position:absolute;left:-26px;right:-26px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.10) 24%,rgba(140,193,170,.04) 70%,transparent);}

/* 一起坐着：水面上聚着的一处光 */
.field{position:relative;margin-top:24px;padding:20px 22px;border-radius:18px;overflow:hidden;
  background:radial-gradient(90% 140% at 78% 120%, rgba(140,193,170,.14), transparent 66%),
             rgba(140,193,170,.035);}
.field .t{font-family:var(--hand);font-size:19px;letter-spacing:.05em}
.field .n{font-size:13.5px;color:var(--water);margin-top:9px;letter-spacing:.08em}

/* 主操作：一片正在被灯照着的水。整块是亮的，因为你走向它 */
.act{position:relative;margin-top:auto;padding:23px;border-radius:20px;overflow:hidden;
  text-align:center;font-size:19px;letter-spacing:.02em;
  background:radial-gradient(120% 180% at 50% 150%, rgba(201,160,99,.30), transparent 66%),
             rgba(201,160,99,.055);}
.act::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,225,180,.34),transparent)}
.sub{padding:16px 2px;font-size:14.5px;color:var(--paper3);
     display:flex;justify-content:space-between;align-items:center}
.foot{display:flex;justify-content:space-between;padding-top:15px;font-size:13.5px;color:var(--clay);
      border-top:1px solid rgba(244,237,227,.05)}

/* mine：三个选项 = 水位的三个高度。越往下水越多，光越足 */
.opts{margin-top:auto;position:relative}
.op{position:relative;padding:21px 22px;font-size:17.5px;overflow:hidden;
    border-radius:16px;margin-top:11px;
    background:linear-gradient(180deg, rgba(140,193,170,var(--w)), rgba(24,34,33,.5));}
.op::after{content:'';position:absolute;left:18px;width:56px;height:3px;top:50%;
  border-radius:50%;background:rgba(255,232,196,var(--g));filter:blur(2px);transform:translateY(-50%)}
.quiet{padding:17px 2px;font-size:14.5px;color:var(--paper3);
       display:flex;justify-content:space-between}

/* empty：这一屏文案本来就写着「饿的感觉会像潮水一样涨起来」。
   所以水在这屏是涨的 —— 从下面漫上来，选项浮在水线之上 */
/* 涨上来的水：只在水线附近有一点亮，往下越来越深 —— 
   上一版整片半透明灰绿，看起来像蒙了块布 */
.rising{position:absolute;left:-10%;right:-10%;bottom:-6%;height:56%;z-index:1;
  border-radius:46% 54% 0 0 / 24% 26% 0 0;
  background:linear-gradient(180deg, rgba(140,193,170,.09) 0 2%, rgba(14,22,22,.5) 40%, rgba(9,15,15,.72));}
.rising::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.30),transparent)}
.picks{margin-top:20px}
.pk{display:flex;align-items:center;gap:16px;padding:15px 2px;font-size:16.5px;position:relative}
.pk+.pk::before{content:'';position:absolute;left:-26px;right:-26px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.09) 26%,transparent)}
.pkp{width:36px;height:26px}
.pk .t{margin-left:auto;font-size:12px;letter-spacing:.12em;color:var(--paper3)}
.pk.dunno{color:var(--paper3);font-size:15px;justify-content:space-between;padding-top:18px}
</style></head><body>

<!-- ══ home ══ -->
<div class="scr"><div class="lbl">home</div>
  <div class="lampglow"></div><div class="sand"></div>
  <div class="mark" style="bottom:41%"></div>
  <div class="mark" style="bottom:26%;opacity:.55"></div>
  <div class="pg">
    <div class="fsub">今天的滋味</div>
    <div class="taste"><div class="food">草莓<span class="chev">›</span></div></div>

    <div style="margin-top:28px">
      <div class="ti">今天怎么样</div>
      <div class="pools">
        <div class="pool pl p1"></div><div class="pool pl p2"></div>
        <div class="pool pl p3"></div><div class="pool pl p4"></div>
        <div class="pool pl p1 dry"></div><div class="pool pl p3 dry"></div>
      </div>
      <div class="row">情绪瓶子<span class="chev">›</span></div>
      <div class="row">昨晚睡得怎么样<span class="chev">›</span></div>
      <div class="row">找个人说说话<span class="chev">›</span></div>
    </div>

    <div class="field">
      <div class="t">20:30 · 十五分钟 · 一起坐着</div>
      <div class="n">此刻 23 人在</div>
    </div>

    <div class="act">我现在不太好</div>
    <div class="sub">试试含一口水，慢慢感受<span class="chev">›</span></div>
    <div class="foot"><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
</div>

<!-- ══ mine ══ -->
<div class="scr"><div class="lbl">mine</div>
  <div class="lampglow"></div><div class="sand" style="height:52%"></div>
  <div class="mark" style="bottom:38%"></div>
  <div class="pg">
    <div class="nav">← 今天</div>
    <div class="h">你来了。</div>
    <div class="opts">
      <div class="op" style="--w:.05;--g:.16">很想吃</div>
      <div class="op" style="--w:.09;--g:.30">正在吃</div>
      <div class="op" style="--w:.14;--g:.46">吃完了</div>
      <div class="quiet">吃不下 · 说不上来<span class="chev">›</span></div>
    </div>
  </div>
</div>

<!-- ══ empty ══ -->
<div class="scr"><div class="lbl">empty</div>
  <div class="lampglow"></div>
  <div class="rising"></div>
  <div class="pg">
    <div class="nav">← 返回</div>
    <div class="h">饿了。</div>
    <div class="p">太久没吃东西，饿的感觉会像潮水一样涨起来。</div>
    <div style="margin-top:auto">
      <div class="ti">想吃点什么样的</div>
      <div class="picks">
        <div class="pk"><div class="pool pkp p1"></div>热乎乎的<span class="t">暖</span></div>
        <div class="pk"><div class="pool pkp p2"></div>软的、好咽的</div>
        <div class="pk"><div class="pool pkp p3"></div>有嚼头的</div>
        <div class="pk"><div class="pool pkp p4"></div>冰冰凉的<span class="t">凉</span></div>
        <div class="pk dunno">说不上来<span class="chev">›</span></div>
      </div>
      <div class="sub" style="padding-top:18px">下一餐怎么吃<span class="chev">›</span></div>
    </div>
  </div>
</div>
</body></html>
