<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>方向 A · 层次与景深</title>
<style>
/* ── 方向 A · 层次与景深 ──────────────────────────────────
   anchor：轮盘 9 号 Pixel-Game Side-Scroller，剥掉像素美学，
   只留「横向空间叙事」的内核 —— 但不做成手势导航
   （Smashing：非标准手势对 distressed users 有害），
   而是做成**视觉的景深**：潮水在背景、内容在中景、操作在前景。

   手艺主张：深色界面的层级靠**亮度**，不靠阴影。
   现版本 19 处彩色发光阴影全部换成表面提亮。
   品牌 token 一个不改 —— 换的是手艺不是品牌。 */
:root{
  --n1:#171310; --n2:#1F1A15; --n3:#2A231C;
  --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#968979;
  --hair:rgba(244,237,227,.10); --hair2:rgba(244,237,227,.05);
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --disp:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
  /* 景深三层的表面亮度。差值是 6% —— 再大就成了卡片堆，再小看不出层 */
  --lift1:#211B15;   /* 中景：内容承载面 */
  --lift2:#2B241C;   /* 前景：可操作面 */
  --lift3:#372E23;   /* 最前：主操作 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0908;font-family:var(--disp);color:var(--paper);
     display:flex;gap:56px;padding:56px;align-items:flex-start}
.scr{width:390px;height:844px;position:relative;overflow:hidden;
     background:var(--n1);border-radius:2px;
     /* 顶上那团光保留 —— 它是这个产品的签名 */
     background-image:radial-gradient(120% 55% at 50% -10%,#251E17 0%,rgba(37,30,23,0) 62%);}
.lbl{position:absolute;top:-30px;left:0;font-size:12px;letter-spacing:.18em;
     color:#6B6055;text-transform:uppercase}
.pg{position:relative;z-index:2;padding:52px 24px 20px;height:100%;
    display:flex;flex-direction:column}

/* ── 背景层：潮水。沉到最底，内容压在它上面 ──────────── */
.tide{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:0;
  background:
    radial-gradient(120% 90% at 50% 100%, rgba(140,193,170,.055), transparent 62%),
    linear-gradient(180deg, transparent, rgba(20,28,26,.5));}
.tide::before{content:'';position:absolute;left:-10%;right:-10%;top:34%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.16) 30%,rgba(140,193,170,.16) 70%,transparent);}
.tide::after{content:'';position:absolute;left:-10%;right:-10%;top:52%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,193,170,.09) 40%,transparent);}

/* ── 排版 ────────────────────────────────────────────── */
.nav{font-size:13px;letter-spacing:.1em;color:var(--paper3);margin-bottom:26px}
.h{font-size:27px;font-weight:600;line-height:1.32;letter-spacing:-.01em}
.p{font-size:15.5px;line-height:1.78;color:var(--paper2);margin-top:14px}
/* 标签不再是全大写小字 —— 那是 icon-tile 时代的习惯。
   改成一条短标线 + 文字，占的高度更小、指向更明确 */
.ti{font-size:12.5px;letter-spacing:.16em;color:var(--paper3);
    display:flex;align-items:center;gap:9px;margin:0 0 12px}
.ti::before{content:'';width:14px;height:1px;background:var(--brass);opacity:.5}

/* ── 景深：三级表面。层级靠亮度，不靠阴影 ──────────────── */
.surf{background:var(--lift1);border-radius:10px;padding:18px 20px;
      box-shadow:inset 0 1px 0 rgba(244,237,227,.045)}
.surf.up{background:var(--lift2)}
.surf.top{background:var(--lift3);box-shadow:inset 0 1px 0 rgba(244,237,227,.09)}

/* ── 出血：重要的块顶到边缘外，次要的内缩。
   打破「所有块等宽满行」是这一版最主要的手艺动作 ──────── */
.bleed{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px;
       border-radius:0}
.inset{margin-right:34px}

/* 滋味卡：食物色透出来，但不描边不加光 */
.taste{position:relative;overflow:hidden;padding:20px 24px 22px;
  background:linear-gradient(0deg,rgba(31,26,21,.88),rgba(31,26,21,.88)),
    radial-gradient(78% 130% at 12% 0%,#A0524E,transparent 66%),#4A2422;}
.food{font-family:var(--hand);font-size:31px;color:var(--brass);letter-spacing:.05em;
      margin-top:5px;display:flex;justify-content:space-between;align-items:center}
.chev{color:var(--paper3);font-size:16px}

/* 六格：不等宽。填过的格子更亮更宽 —— 亮度即层级 */
.cells{display:flex;gap:5px;margin-top:14px;height:34px}
.cell{flex:1;border-radius:5px;background:rgba(244,237,227,.045)}
.cell.on{flex:1.45;background:var(--lift3);box-shadow:inset 0 1px 0 rgba(140,193,170,.30)}
.cell.e{background:transparent;border:1px dashed rgba(244,237,227,.09)}

/* 行式入口：靠一条细线分隔，不用卡片 */
.row{display:flex;justify-content:space-between;align-items:center;
     padding:15px 0;font-size:15.5px;color:var(--paper2);
     border-bottom:1px solid var(--hair2)}
.row:last-child{border-bottom:none}

/* 主操作：最前景，最亮的表面 */
.act{margin-top:auto;background:var(--lift3);border-radius:11px;
     padding:20px;text-align:center;font-size:17.5px;
     box-shadow:inset 0 1px 0 rgba(244,237,227,.11)}
.foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;
      border-top:1px solid var(--hair2);font-size:13.5px;color:var(--clay)}

/* mine 屏：三个选项不等大 —— 越近的越大越亮，读作「离你多远」 */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:auto}
.opt{border-radius:11px;padding:19px 22px;font-size:17px;
     background:var(--lift1);box-shadow:inset 0 1px 0 rgba(244,237,227,.04)}
.opt.n2{background:var(--lift2);padding:22px;font-size:17.5px;
        box-shadow:inset 0 1px 0 rgba(244,237,227,.07)}
.opt.n3{background:var(--lift3);padding:25px 22px;font-size:18px;
        box-shadow:inset 0 1px 0 rgba(244,237,227,.10)}
.quiet{padding:15px 4px;font-size:14.5px;color:var(--paper3);
       display:flex;justify-content:space-between;margin-top:6px}

/* empty 屏：五支口味。不是等分网格 —— 那是 icon-tile 的排法。
   按「热→凉」排成一条渐变的带，说不上来单独落在下面 */
.pick{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.pk{padding:16px 20px;border-radius:9px;font-size:16px;
    background:var(--lift1);display:flex;justify-content:space-between;align-items:center}
.pk .t{font-size:12px;letter-spacing:.1em;opacity:.42}
.pk.w{background:linear-gradient(90deg,var(--lift2),var(--lift1))}
.pk.c{background:linear-gradient(90deg,var(--lift1),#1B2320)}
.pk.dunno{background:none;border:1px solid var(--hair2);color:var(--paper3);
          font-size:15px;justify-content:center;margin-top:5px}
</style></head><body>

<!-- ══ home ══ -->
<div class="scr"><div class="lbl">home</div>
  <div class="tide"></div>
  <div class="pg">
    <div class="nav" style="opacity:0"> </div>
    <div class="surf taste bleed">
      <div class="ti">今天的滋味</div>
      <div class="food">草莓<span class="chev">›</span></div>
    </div>

    <div style="margin-top:26px">
      <div class="ti">今天怎么样</div>
      <div class="cells">
        <div class="cell on"></div><div class="cell on"></div><div class="cell"></div>
        <div class="cell on"></div><div class="cell e"></div><div class="cell e"></div>
      </div>
      <div class="inset" style="margin-top:14px">
        <div class="row">情绪瓶子<span class="chev">›</span></div>
        <div class="row">昨晚睡得怎么样<span class="chev">›</span></div>
        <div class="row">找个人说说话<span class="chev">›</span></div>
      </div>
    </div>

    <div class="surf up" style="margin-top:22px">
      <div style="font-family:var(--hand);font-size:17px;letter-spacing:.04em">20:30 · 十五分钟 · 一起坐着</div>
      <div style="font-size:13.5px;color:var(--jade);margin-top:9px;letter-spacing:.08em">此刻 23 人在</div>
    </div>

    <div class="act">我现在不太好</div>
    <div class="row" style="border:none;padding:13px 0 0;font-size:14.5px;color:var(--paper3)">
      试试含一口水，慢慢感受<span class="chev">›</span></div>
    <div class="foot"><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
</div>

<!-- ══ mine ══ -->
<div class="scr"><div class="lbl">mine</div>
  <div class="tide" style="height:38%"></div>
  <div class="pg">
    <div class="nav">← 今天</div>
    <div class="h">你来了。</div>
    <div class="opts">
      <div class="opt">很想吃</div>
      <div class="opt n2">正在吃</div>
      <div class="opt n3">吃完了</div>
      <div class="quiet">吃不下 · 说不上来<span class="chev">›</span></div>
    </div>
  </div>
</div>

<!-- ══ empty ══ -->
<div class="scr"><div class="lbl">empty</div>
  <div class="tide" style="height:58%"></div>
  <div class="pg">
    <div class="nav">← 返回</div>
    <div class="h">饿了。</div>
    <div class="p">太久没吃东西，饿的感觉会像潮水一样涨起来。</div>
    <div style="margin-top:auto">
      <div class="ti">想吃点什么样的</div>
      <div class="pick">
        <div class="pk w">热乎乎的<span class="t">暖</span></div>
        <div class="pk">软的、好咽的<span class="t"></span></div>
        <div class="pk">有嚼头的<span class="t"></span></div>
        <div class="pk c">冰冰凉的<span class="t">凉</span></div>
        <div class="pk dunno">说不上来</div>
      </div>
      <div class="row" style="margin-top:14px;border:none;padding:13px 0 0;color:var(--paper3);font-size:14.5px">
        下一餐怎么吃<span class="chev">›</span></div>
    </div>
  </div>
</div>
</body></html>
