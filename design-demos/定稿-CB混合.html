<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 定稿 C+B</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0907;font-family:var(--body);color:var(--paper);
     display:flex;gap:52px;padding:56px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:13px 56px;background:#0b0907ee;
     border-bottom:1px solid #221c15;font-size:13px;color:var(--paper3);z-index:9;
     letter-spacing:.04em;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:46px}
.cap{font-size:12.5px;color:var(--paper3);padding:11px 2px 0;letter-spacing:.05em}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #262019;box-shadow:0 30px 70px #0007;
    background:radial-gradient(150% 74% at 50% 38%,#241b12 0%,#171208 48%,#0f0c07 100%)}
.in{position:relative;height:100%;padding:56px 34px 30px;display:flex;flex-direction:column}
.day{text-align:center;font-size:10.5px;letter-spacing:.42em;color:var(--paper3);
     opacity:.72;text-indent:.42em}

/* ══════ 罐子 · 全屏唯一的 120% 细节 ══════
   五层，缺一层就从「玻璃」掉回「圆角矩形」：
   1 .halo  罐外的光——彩色珠子透出来混成的暖晕，不是给罐子打光
   2 .beads 彩色珠子（B）——色相走退潮的感官温度表，暖=高唤起 冷=低唤起
   3 .frost 磨砂层（C）——backdrop-filter 让珠子隔着玻璃发虚，这是磨砂的全部来源
   4 .body  罐壁——上沿一道亮边（玻璃厚度），下腹一团暖反光（盛着东西的重量感）
   5 .pool  罐底透光斑——光穿过珠子落在罐底，玻璃与塑料的分野在这一点 */
.vessel{position:relative;height:368px;margin:24px 0 0}
.halo{position:absolute;left:50%;top:104px;transform:translateX(-50%);
      width:296px;height:264px;border-radius:50%;filter:blur(30px);opacity:.85;
      background:radial-gradient(circle at 42% 62%,#E0906E55,#C9A06340 38%,transparent 70%)}
.lid{position:absolute;left:50%;top:36px;transform:translateX(-50%);
     width:114px;height:19px;border-radius:7px;z-index:3;
     background:linear-gradient(180deg,rgba(255,246,232,.20),rgba(255,238,214,.07));
     border:1px solid rgba(255,242,224,.16);
     box-shadow:0 2px 8px #00000055}
.jar{position:absolute;left:50%;top:52px;transform:translateX(-50%);
     width:198px;height:244px;border-radius:22px 22px 86px 86px;overflow:hidden;
     background:linear-gradient(174deg,rgba(255,246,232,.11),rgba(255,238,214,.035) 46%,rgba(255,236,208,.07));
     border:1px solid rgba(255,242,224,.14);
     box-shadow:inset 0 3px 20px rgba(255,244,228,.15),
                inset 0 -22px 44px rgba(210,145,85,.15),
                0 24px 62px #000000a6}
.bead{position:absolute;border-radius:50%}
/* 小而硬的高光点：玻璃珠 vs 塑料珠几乎全在这一点上 */
.bead::after{content:'';position:absolute;left:23%;top:15%;width:23%;height:23%;
             border-radius:50%;background:#fffdf8;opacity:.92;
             box-shadow:0 0 5px #fff8}
/* 磨砂：珠子隔着它发虚 */
.frost{position:absolute;inset:0;z-index:2;pointer-events:none;
       backdrop-filter:blur(2.2px);
       background:linear-gradient(180deg,rgba(255,250,240,.09),rgba(255,246,232,.02) 34%,rgba(255,240,220,.055))}
/* 罐底那摊透过来的光 */
.pool{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:1;
      width:132px;height:22px;border-radius:50%;filter:blur(7px);
      background:radial-gradient(circle,#F0BE8055,transparent 72%)}

.taste{text-align:center;margin:0;position:relative;z-index:4}
.taste .lbl{font-size:10.5px;letter-spacing:.34em;color:var(--paper2);opacity:.9;text-indent:.34em}
.taste .w{font-family:var(--hand);font-size:42px;color:#F4DDB2;line-height:1.2;margin:9px 0 0;
          text-shadow:0 0 28px #C9A06366}
.spacer{flex:1}
.ways{text-align:center}
.ways a{display:block;font-size:16px;color:var(--paper2);padding:11.5px 0;letter-spacing:.05em}
.now{text-align:center;font-size:12.5px;color:var(--jade);opacity:.8;letter-spacing:.06em;padding:15px 0 0}
.main{text-align:center;margin:24px 0 0}
.main .t{font-size:23px;color:#FFF2E0;letter-spacing:.1em}
.main .ln{width:132px;height:1px;margin:15px auto 0;
          background:linear-gradient(90deg,transparent,#C9A063,transparent)}
.main .s{font-size:13.5px;color:var(--paper3);margin:14px 0 0}
.foot{display:flex;justify-content:center;gap:30px;padding:22px 0 0}
.foot span{font-size:13px;color:var(--clay);opacity:.75}

/* ══ 第二屏 ══ */
.bk{font-size:12.5px;color:var(--paper3);letter-spacing:.1em;opacity:.7}
.h2{text-align:center;font-size:25px;font-weight:400;letter-spacing:.16em;margin:28px 0 0;text-indent:.16em}
.mon{text-align:center;font-size:10.5px;letter-spacing:.4em;color:var(--brass);opacity:.8;
     margin:10px 0 0;text-indent:.4em}
.bigv{position:relative;height:404px;margin:14px 0 0}
.bhalo{position:absolute;left:50%;top:112px;transform:translateX(-50%);
       width:336px;height:300px;border-radius:50%;filter:blur(34px);opacity:.85;
       background:radial-gradient(circle at 44% 62%,#E0906E55,#C9A06340 38%,transparent 70%)}
.blid{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:128px;height:21px;
      border-radius:8px;z-index:3;
      background:linear-gradient(180deg,rgba(255,246,232,.20),rgba(255,238,214,.07));
      border:1px solid rgba(255,242,224,.16);box-shadow:0 2px 8px #00000055}
.bjar{position:absolute;left:50%;top:56px;transform:translateX(-50%);
      width:230px;height:300px;border-radius:24px 24px 98px 98px;overflow:hidden;
      background:linear-gradient(174deg,rgba(255,246,232,.11),rgba(255,238,214,.03) 46%,rgba(255,236,208,.075));
      border:1px solid rgba(255,242,224,.14);
      box-shadow:inset 0 3px 22px rgba(255,244,228,.15),
                 inset 0 -24px 48px rgba(210,145,85,.16),0 26px 66px #000000a6}
.note{text-align:center;padding:14px 10px 0}
.note p{font-size:16px;line-height:1.85;color:var(--paper);opacity:.95}
.note p+p{color:var(--paper2);font-size:14px;opacity:.8}
.quote{font-family:var(--hand);font-size:18px;color:var(--brass);text-align:center;
       margin:18px 0 0;line-height:1.7;opacity:.92}
</style>

<div class=lab>定稿 · <b>C 的器物骨架 + B 的彩色珠子</b>　<span style="color:#5a5147">｜珠子隔着磨砂层发虚——两版真正长在一起的地方</span></div>

        <div class=bead style="left:74px;bottom:100px;width:34px;height:34px;background:radial-gradient(circle at 34% 30%,#E2A184,#A66450)"></div>
        <div class=bead style="left:114px;bottom:96px;width:28px;height:28px;background:radial-gradient(circle at 34% 30%,#A0D3BB,#6C9682)"></div>
        <div class=bead style="left:92px;bottom:132px;width:24px;height:24px;background:radial-gradient(circle at 34% 30%,#D3BFA4,#94816C)"></div>
        <div class=frost></div>
      </div>
    </div>
    <div class=taste>
      <div class=lbl>今天的滋味</div>
      <div class=w>蒸蛋</div>
    </div>
    <div class=spacer></div>
    <div class=ways>
      <a>今天怎么样</a><a>情绪瓶子</a><a>昨晚睡得怎么样</a><a>找个人说说话</a>

    <div class=main>
      <div class=t>我现在不太好</div>
      <div class=ln></div>
      <div class=s>试试含一口水，慢慢感受</div>
    </div>
    <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
  </div>
</div>
<div class=cap>首页 · 罐子是主角，入口只有字，主入口是一行字加一条光</div>
</div>

<div class=wrap>
<div class=ph>

    <div class=h2>情绪瓶子</div>
    <div class=mon>八月</div>
    <div class=bigv>

        <div class=pool style="width:152px;bottom:11px"></div>

<div class=cap>情绪瓶子 · 一颗是一天，颜色只用来认出是哪个词，不说它值多少</div>
</div>
