<!doctype html><html><head><meta charset="utf-8"><title>canvas 罐子</title>
<style>body{background:#141110;margin:0;padding:44px;display:flex;gap:52px;align-items:center;
font:13px -apple-system,"PingFang SC";color:#8E8377}
.c{text-align:center}canvas{display:block}.c div{margin-top:14px}</style></head><body>
<script>
const rnd=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x);};

/* 罐形的一半（右侧轮廓），从口沿往下到底。
   罐子立得住靠三处转折：肩、颈、平底 —— 少一处就读成花瓶或球。 */
function jarPath(g, cx, cy, W, H) {
  const halfW = W/2, top = cy - H/2, bot = cy + H/2;
  const neckW = halfW * 0.60;      // 罐口比罐身窄
  const shoulderY = top + H*0.20;  // 肩在上五分之一
  g.beginPath();
  g.moveTo(cx - neckW, top);
  // 左肩：从口沿外扩到最宽处
  g.bezierCurveTo(cx - neckW - halfW*0.10, top + H*0.05,
                  cx - halfW, shoulderY - H*0.06,
                  cx - halfW, shoulderY + H*0.04);
  // 左身：几乎垂直，略微内收
  g.bezierCurveTo(cx - halfW*1.005, cy + H*0.16,
                  cx - halfW*0.985, bot - H*0.10,
                  cx - halfW*0.90,  bot - H*0.012);
  // 平底
  g.lineTo(cx + halfW*0.90, bot - H*0.012);
  // 右身
  g.bezierCurveTo(cx + halfW*0.985, bot - H*0.10,
                  cx + halfW*1.005, cy + H*0.16,
                  cx + halfW, shoulderY + H*0.04);
  // 右肩
  g.bezierCurveTo(cx + halfW, shoulderY - H*0.06,
                  cx + neckW + halfW*0.10, top + H*0.05,
                  cx + neckW, top);
  g.closePath();
}

function jar(cv, seed) {
  const W=cv.width, H=cv.height, g=cv.getContext('2d');
  const cx=W/2, cy=H/2 + H*0.03, jw=W*0.62, jh=H*0.74;
  g.clearRect(0,0,W,H);

  /* ① 罐子外面那圈光晕：一只装着光的罐子会照亮它周围 */
  g.save();
  g.globalCompositeOperation='lighter';
  g.filter='blur(24px)';
  const halo=g.createRadialGradient(cx, cy+jh*0.24, 0, cx, cy+jh*0.24, jw*0.9);
  halo.addColorStop(0,'rgba(201,160,99,.30)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=halo; g.fillRect(0,0,W,H);
  g.restore();

  /* ② 罐体：磨砂玻璃。整体是半透明的，比背景略亮一点点 —— 
     雾面玻璃在暗处不是黑的，它散射周围的一点光 */
  g.save();
  g.filter='blur(1.4px)';
  jarPath(g,cx,cy,jw,jh);
  const body=g.createLinearGradient(cx-jw/2,0,cx+jw/2,0);
  body.addColorStop(0,   'rgba(58,54,50,.30)');
  body.addColorStop(0.16,'rgba(96,92,86,.22)');   // 朝光那侧
  body.addColorStop(0.5, 'rgba(40,38,36,.16)');
  body.addColorStop(0.86,'rgba(70,66,62,.18)');
  body.addColorStop(1,   'rgba(48,45,42,.26)');
  g.fillStyle=body; g.fill();
  g.restore();

  /* ③ 罐底积着的暖光。整只罐子最亮的地方在这儿 —— 
     光是从底下透上来的，不是从口上照下去的 */
  g.save();
  jarPath(g,cx,cy,jw,jh); g.clip();
  g.globalCompositeOperation='lighter';
  g.filter='blur(16px)';
  g.translate(cx, cy+jh*0.30);
  g.scale(1.5,0.62);
  const pool=g.createRadialGradient(0,0,0,0,0,jw*0.46);
  pool.addColorStop(0,   'rgba(255,224,168,.52)');
  pool.addColorStop(0.42,'rgba(226,168,96,.24)');
  pool.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle=pool; g.fillRect(-jw,-jh,jw*2,jh*2);
  g.restore();

  /* ④ 磨砂的颗粒：极细，只在罐体内 */
  g.save();
  jarPath(g,cx,cy,jw,jh); g.clip();
  for(let i=0;i<900;i++){
    const t=rnd(i,seed), u=rnd(i+7,seed);
    g.fillStyle='rgba(244,237,227,'+(0.012+t*0.030).toFixed(3)+')';
    g.fillRect(cx-jw/2+t*jw, cy-jh/2+u*jh, 1.2, 1.2);
  }
  g.restore();

  /* ⑤ 侧壁那两道反光：竖直的窄条，是「这是玻璃」最省的信号。
     圆形的高光块只能读成塑料 —— 这条从 wxss 的 .gloss 注释来的 */
  g.save();
  jarPath(g,cx,cy,jw,jh); g.clip();
  g.filter='blur(3px)';
  for(const [ox,w,al] of [[-0.34,0.045,0.20],[0.30,0.028,0.10]]){
    const x=cx+ox*jw;
    const gr=g.createLinearGradient(x-jw*w,0,x+jw*w,0);
    gr.addColorStop(0,'rgba(244,237,227,0)');
    gr.addColorStop(0.5,'rgba(244,237,227,'+al+')');
    gr.addColorStop(1,'rgba(244,237,227,0)');
    g.fillStyle=gr; g.fillRect(x-jw*w, cy-jh*0.42, jw*w*2, jh*0.78);
  }
  g.restore();

  /* ⑥ 罐口：一圈翻边。上下各一道亮线（翻边的两个转折面），两端略暗 */
  const neckW=jw*0.60*1.08, ny=cy-jh/2;
  g.save();
  g.filter='blur(1px)';
  const lip=g.createLinearGradient(0,ny-7,0,ny+7);
  lip.addColorStop(0,   'rgba(244,237,227,.26)');
  lip.addColorStop(0.34,'rgba(150,142,132,.16)');
  lip.addColorStop(1,   'rgba(30,28,26,.42)');
  g.fillStyle=lip;
  g.beginPath();
  g.ellipse(cx, ny, neckW*0.52, 7, 0, 0, Math.PI*2);
  g.fill();
  g.restore();

  /* ⑦ 罐口内侧的暗：不加这个，口就是一块饼 */
  g.save();
  g.filter='blur(2px)';
  g.fillStyle='rgba(12,10,9,.72)';
  g.beginPath();
  g.ellipse(cx, ny+1.5, neckW*0.44, 4.6, 0, 0, Math.PI*2);
  g.fill();
  g.restore();
}

for(const [w,label] of [[250,'250×250 · 真机尺寸'],[500,'放大两倍']]){
  const box=document.createElement('div'); box.className='c';
  const cv=document.createElement('canvas');
  cv.width=w*2; cv.height=w*2; cv.style.width=w+'px'; cv.style.height=w+'px';
  const t=document.createElement('canvas'); t.width=w; t.height=w;
  jar(t, 3.1);
  const g=cv.getContext('2d'); g.scale(2,2); g.drawImage(t,0,0,w,w);
  box.appendChild(cv);
  const d=document.createElement('div'); d.textContent=label; box.appendChild(d);
  document.body.appendChild(box);
}
</script></body></html>
