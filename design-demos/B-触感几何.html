<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>方向 B · 触感几何</title>
<style>
/* ── 方向 B · 触感几何 ────────────────────────────────────
   anchor：How We Feel（2024 Apple Design Award finalist，Social Impact）。
   它的核心不是配色，是把情绪做成**可触摸的抽象几何形状**，
   而不是「文字标签 + 小圆点」的列表项。

   这个方向有一个产品内在的理由，不是外加的装饰：
   情绪瓶子里已经是有质感的玻璃珠了，而首页的六格是扁平方框 ——
   同一件东西（一次记录）在两个地方是两种材质。统一它。

   一致的光源：所有形状的高光在左上、影在右下，同一盏灯。
   这是「有人做过」和「拼出来的」最省的分界线。 */
:root{
  --n1:#171310; --n2:#1F1A15;
  --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#968979;
  --hair2:rgba(244,237,227,.05);
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --disp:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0908;font-family:var(--disp);color:var(--paper);
     display:flex;gap:56px;padding:56px;align-items:flex-start}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:var(--n1);
     background-image:radial-gradient(120% 55% at 50% -10%,#251E17 0%,rgba(37,30,23,0) 62%);}
.lbl{position:absolute;top:-30px;left:0;font-size:12px;letter-spacing:.18em;color:#6B6055;text-transform:uppercase}
.pg{position:relative;z-index:2;padding:52px 26px 20px;height:100%;display:flex;flex-direction:column}
.nav{font-size:13px;letter-spacing:.1em;color:var(--paper3);margin-bottom:26px}
.h{font-size:27px;font-weight:600;line-height:1.32}
.p{font-size:15.5px;line-height:1.78;color:var(--paper2);margin-top:14px}
.ti{font-size:12.5px;letter-spacing:.16em;color:var(--paper3);margin:0 0 14px}
.chev{color:var(--paper3);font-size:16px}

/* ── 触感配方 ────────────────────────────────────────────
   四层，和瓶子里那颗珠子同一套：
   1 本体色（不是纯色，是从左上到右下的厚度渐变）
   2 左上高光 —— 小、硬。这一点决定「实体」还是「贴纸」
   3 右下承影 —— 同一盏灯的另一半
   4 边缘一圈极淡的实边 —— 形状的轮廓，不是描边 */
.solid{
  background:
    radial-gradient(60% 50% at 26% 22%, rgba(255,255,255,.11), transparent 62%),
    radial-gradient(70% 60% at 76% 84%, rgba(0,0,0,.24), transparent 66%),
    linear-gradient(152deg, #2C241C, #1D1811);
  box-shadow:inset 0 1px 0 rgba(244,237,227,.10),
             inset 0 -1px 0 rgba(0,0,0,.42);
}

/* 一次记录 = 一颗珠子。和情绪瓶子里的完全同构 —— 这是关键 */
.beads{display:flex;gap:10px;align-items:flex-end;height:52px;margin-top:6px}
.bead{width:38px;height:38px;border-radius:50%;position:relative}
.bead.on{background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.55) 0 8%, transparent 42%),
    radial-gradient(circle at 62% 74%, rgba(255,255,255,.14), transparent 46%),
    radial-gradient(circle at 42% 40%, var(--bc), color-mix(in oklab, var(--bc) 62%, #120E0B) 82%);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06);}
.bead.e{border:1px dashed rgba(244,237,227,.11)}
.bead.today{width:46px;height:46px}

/* 滋味卡：食物的材质从形状里长出来，不是贴在方框上 */
.taste{border-radius:14px;padding:20px 22px 22px;position:relative;overflow:hidden;
  background:
    radial-gradient(64% 52% at 24% 18%, rgba(255,255,255,.10), transparent 64%),
    radial-gradient(70% 60% at 78% 88%, rgba(0,0,0,.30), transparent 68%),
    linear-gradient(152deg, #6B2F31, #34191A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.5);}
.taste::after{content:'';position:absolute;inset:0;opacity:.3;
  background-image:radial-gradient(rgba(255,255,255,.5) .7px, transparent .8px);
  background-size:6px 6px}
.food{font-family:var(--hand);font-size:32px;letter-spacing:.05em;position:relative;z-index:2;
      display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* 行式入口保持扁平 —— 触感是留给「有内容的东西」的。
   全都做成实体就成了 3D 玩具，那是另一种 slop */
.row{display:flex;justify-content:space-between;align-items:center;
     padding:15px 2px;font-size:15.5px;color:var(--paper2);
     border-bottom:1px solid var(--hair2)}
.row:last-child{border-bottom:none}

/* 一起坐着那块：实体，因为它是一个「场」不是一条链接 */
.field{border-radius:14px;padding:18px 20px;margin-top:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);display:inline-block;
     margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px rgba(140,193,170,.13)}

/* 主操作：厚度最大的那一块 */
.act{margin-top:auto;border-radius:15px;padding:22px;text-align:center;font-size:18px;
  background:
    radial-gradient(62% 52% at 24% 18%, rgba(255,255,255,.13), transparent 62%),
    radial-gradient(70% 60% at 78% 88%, rgba(0,0,0,.26), transparent 66%),
    linear-gradient(152deg, #3B3025, #241D16);
  box-shadow:inset 0 1px 0 rgba(244,237,227,.15), inset 0 -2px 0 rgba(0,0,0,.5);}
.foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;
      border-top:1px solid var(--hair2);font-size:13.5px;color:var(--clay)}

/* mine：三个选项是三块厚度不同的实体 —— 厚度即分量 */
.opts{display:flex;flex-direction:column;gap:11px;margin-top:auto}
.opt{border-radius:14px;padding:20px 22px;font-size:17px}
.opt.thick{padding:24px 22px;font-size:18px;
  box-shadow:inset 0 1px 0 rgba(244,237,227,.14), inset 0 -3px 0 rgba(0,0,0,.5)}
.quiet{padding:16px 2px;font-size:14.5px;color:var(--paper3);
       display:flex;justify-content:space-between}

/* empty：五支口味 = 五颗不同温度的形状。形状本身说温度 */
.pick{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pk{flex:1 1 calc(50% - 5px);border-radius:15px;padding:20px 16px;font-size:16px;
    text-align:center;position:relative;overflow:hidden}
.pk.hot{background:
    radial-gradient(66% 54% at 26% 20%, rgba(255,255,255,.12), transparent 62%),
    linear-gradient(152deg,#4A2A1C,#2A1811);
  box-shadow:inset 0 1px 0 rgba(255,190,150,.16), inset 0 -1px 0 rgba(0,0,0,.45)}
.pk.cold{background:
    radial-gradient(66% 54% at 26% 20%, rgba(255,255,255,.13), transparent 62%),
    linear-gradient(152deg,#1E2C2C,#141C1D);
  box-shadow:inset 0 1px 0 rgba(190,225,230,.16), inset 0 -1px 0 rgba(0,0,0,.45)}
.pk.soft{border-radius:22px}
.pk.chew{border-radius:8px}
.pk.dunno{flex:1 1 100%;background:none;border:1px solid var(--hair2);
          color:var(--paper3);font-size:15px;box-shadow:none;border-radius:12px}
</style></head><body>

<!-- ══ home ══ -->
<div class="scr"><div class="lbl">home</div><div class="pg">
  <div class="nav" style="opacity:0"> </div>
  <div class="ti">今天的滋味</div>
  <div class="taste"><div class="food">草莓<span class="chev">›</span></div></div>

  <div style="margin-top:28px">
    <div class="ti">今天怎么样</div>
    <div class="beads">
      <div class="bead on" style="--bc:#C9A063"></div>
      <div class="bead on" style="--bc:#8CC1AA"></div>
      <div class="bead on" style="--bc:#7E92C4"></div>
      <div class="bead on today" style="--bc:#CB7E62"></div>
      <div class="bead e"></div><div class="bead e"></div>
    </div>
    <div style="margin-top:16px">
      <div class="row">情绪瓶子<span class="chev">›</span></div>
      <div class="row">昨晚睡得怎么样<span class="chev">›</span></div>
      <div class="row">找个人说说话<span class="chev">›</span></div>
    </div>
  </div>

  <div class="solid field">
    <div style="font-family:var(--hand);font-size:17px;letter-spacing:.04em">20:30 · 十五分钟 · 一起坐着</div>
    <div style="font-size:13.5px;color:var(--jade);margin-top:10px;letter-spacing:.06em">
      <span class="dot"></span>此刻 23 人在</div>
  </div>

  <div class="act">我现在不太好</div>
  <div class="row" style="border:none;padding:14px 2px 0;font-size:14.5px;color:var(--paper3)">
    试试含一口水，慢慢感受<span class="chev">›</span></div>
  <div class="foot"><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>

<!-- ══ mine ══ -->
<div class="scr"><div class="lbl">mine</div><div class="pg">
  <div class="nav">← 今天</div>
  <div class="h">你来了。</div>
  <div class="opts">
    <div class="solid opt">很想吃</div>
    <div class="solid opt">正在吃</div>
    <div class="solid opt thick">吃完了</div>
    <div class="quiet">吃不下 · 说不上来<span class="chev">›</span></div>
  </div>
</div></div>

<!-- ══ empty ══ -->
<div class="scr"><div class="lbl">empty</div><div class="pg">
  <div class="nav">← 返回</div>
  <div class="h">饿了。</div>
  <div class="p">太久没吃东西，饿的感觉会像潮水一样涨起来。</div>
  <div style="margin-top:auto">
    <div class="ti">想吃点什么样的</div>
    <div class="pick">
      <div class="pk hot">热乎乎的</div>
      <div class="pk cold">冰冰凉的</div>
      <div class="solid pk soft">软的、好咽的</div>
      <div class="solid pk chew">有嚼头的</div>
      <div class="pk dunno">说不上来</div>
    </div>
    <div class="row" style="margin-top:16px;border:none;padding:13px 2px 0;color:var(--paper3);font-size:14.5px">
      下一餐怎么吃<span class="chev">›</span></div>
  </div>
</div></div>
</body></html>
