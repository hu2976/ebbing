<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>方向 C · 精确的空</title>
<style>
/* ── 方向 C · 精确的空 ────────────────────────────────────
   anchor：原研哉（Kenya Hara）。他的「空」不是没有内容，
   是**容纳的余地** —— 白不是背景色，是让东西被看见的条件。

   针对她说过的两句相反的话：「太素」和「太空了」。
   两者的共同解不是加东西，是**让留白看起来被安排过**：
   1 所有元素对齐到同一条左基线，一条不许偏
   2 间距只用三个值：8 / 26 / 68px（4pt 的 2/6.5/17 倍），
     用哪一个由「这两块的关系有多远」决定，不由填满决定
   3 一屏只给一个视觉锚点，其余全部退到次级
   4 去掉所有卡片容器 —— 层级由间距和亮度给，不由框给

   ⚠️ 字号一个不缩：安静派做过头就是大片死白加微缩字，
   第一眼像页面没渲染出来。留白靠间距，不靠把字变小。 */
:root{
  --n1:#171310; --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#968979;
  --hair2:rgba(244,237,227,.06);
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --disp:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","Xingkai SC","STKaiti","Kaiti SC",KaiTi,serif;
  --s1:8px; --s2:26px; --s3:68px;    /* 三个间距，没有第四个 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0908;font-family:var(--disp);color:var(--paper);
     display:flex;gap:56px;padding:56px;align-items:flex-start}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:var(--n1);
     background-image:radial-gradient(130% 48% at 50% -14%,#221C16 0%,rgba(34,28,22,0) 58%);}
.lbl{position:absolute;top:-30px;left:0;font-size:12px;letter-spacing:.18em;color:#6B6055;text-transform:uppercase}
/* 左基线 32px。所有东西对齐它，包括那条分隔线的起点 */
.pg{position:relative;z-index:2;padding:58px 32px 26px;height:100%;display:flex;flex-direction:column}
.nav{font-size:13px;letter-spacing:.1em;color:var(--paper3)}

/* 锚点：一屏一个。它是唯一允许用暖色的东西 */
.anchor{font-family:var(--hand);font-size:44px;color:var(--brass);letter-spacing:.06em;
        line-height:1.25;display:flex;justify-content:space-between;align-items:baseline}
.anchor .chev{font-family:var(--disp);font-size:15px;color:var(--paper3);font-weight:300}
.kicker{font-size:12.5px;letter-spacing:.2em;color:var(--paper3);margin-bottom:var(--s1)}

.h{font-size:28px;font-weight:600;line-height:1.34}
.p{font-size:15.5px;line-height:1.82;color:var(--paper2)}

/* 分隔只用一条线，从左基线起，到右边缘外 —— 它是尺子不是边框 */
.rule{height:1px;background:var(--hair2);margin-right:-32px}

/* 入口：没有框，没有背景。只有字、一条线、一个 › */
.row{display:flex;justify-content:space-between;align-items:baseline;
     font-size:16px;color:var(--paper);padding:var(--s2) 0 0}
.row .c{font-size:15px;color:var(--paper3);font-weight:300}
.row.sub{font-size:15px;color:var(--paper2)}

/* 六格：六条短线。填过的是实线且更亮，没填的是虚的 —— 
   一次记录在这个方向里不是一个物件，是一个刻度 */
.marks{display:flex;gap:9px;height:3px;margin-top:var(--s2)}
.mk{flex:1;background:rgba(244,237,227,.10)}
.mk.on{background:var(--paper2)}
.mk.today{background:var(--brass)}

/* 主操作：不是按钮，是一行字加一条比别处粗一点的线。
   在这个方向里，重要靠位置和亮度说，不靠一个框说 */
.main{margin-top:auto;padding-top:var(--s2)}
.main .t{font-size:21px;letter-spacing:.02em}
.main .r{height:1px;background:rgba(244,237,227,.30);margin:var(--s1) -32px 0 0}
.foot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--clay);
      margin-top:var(--s2)}

/* mine：三个答案竖排，间距全用 s2，靠字号和亮度分层不靠框 */
.ans{margin-top:auto}
.ans .a{font-size:20px;padding:var(--s2) 0;display:flex;justify-content:space-between;
        align-items:baseline;border-bottom:1px solid var(--hair2)}
.ans .a:first-child{border-top:1px solid var(--hair2)}
.ans .a .c{font-size:15px;color:var(--paper3);font-weight:300}
.ans .q{font-size:15px;color:var(--paper3);padding-top:var(--s2);
        display:flex;justify-content:space-between}

/* empty：五支口味是一列字。选择的重量在字上，不在色块上 */
.list{margin-top:var(--s2)}
.li{font-size:18px;padding:var(--s2) 0;border-bottom:1px solid var(--hair2);
    display:flex;justify-content:space-between;align-items:baseline}
.li .n{font-size:12px;letter-spacing:.14em;color:var(--paper3);font-weight:300}
.li.dunno{font-size:15px;color:var(--paper3);border-bottom:none}
/* 潮水：一条线。整屏只有这一处非文字的东西 */
.水{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:0;
   background:linear-gradient(180deg,transparent,rgba(140,193,170,.045))}
.水::before{content:'';position:absolute;left:32px;right:-10px;top:28%;height:1px;
   background:linear-gradient(90deg,rgba(140,193,170,.26),transparent 82%)}
</style></head><body>

<!-- ══ home ══ -->
<div class="scr"><div class="lbl">home</div><div class="pg">
  <div style="height:var(--s3)"></div>
  <div class="kicker">今天的滋味</div>
  <div class="anchor">草莓<span class="chev">›</span></div>

  <div style="height:var(--s3)"></div>
  <div class="rule"></div>
  <div class="kicker" style="margin-top:var(--s2)">今天怎么样</div>
  <div class="marks">
    <div class="mk on"></div><div class="mk on"></div><div class="mk"></div>
    <div class="mk today"></div><div class="mk"></div><div class="mk"></div>
  </div>
  <div class="row sub">情绪瓶子<span class="c">›</span></div>
  <div class="row sub">昨晚睡得怎么样<span class="c">›</span></div>
  <div class="row sub">找个人说说话<span class="c">›</span></div>

  <div style="height:var(--s3)"></div>
  <div class="rule"></div>
  <div style="font-family:var(--hand);font-size:18px;letter-spacing:.04em;margin-top:var(--s2)">
    20:30 · 十五分钟 · 一起坐着</div>
  <div style="font-size:13.5px;color:var(--jade);margin-top:var(--s1);letter-spacing:.08em">此刻 23 人在</div>

  <div class="main">
    <div class="t">我现在不太好</div>
    <div class="r"></div>
  </div>
  <div class="row sub" style="padding-top:var(--s2)">试试含一口水，慢慢感受<span class="c">›</span></div>
  <div class="foot"><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>

<!-- ══ mine ══ -->
<div class="scr"><div class="lbl">mine</div><div class="pg">
  <div class="nav">← 今天</div>
  <div style="height:var(--s3)"></div>
  <div class="h">你来了。</div>
  <div class="ans">
    <div class="a">很想吃<span class="c">›</span></div>
    <div class="a">正在吃<span class="c">›</span></div>
    <div class="a">吃完了<span class="c">›</span></div>
    <div class="q">吃不下 · 说不上来<span class="c">›</span></div>
  </div>
</div></div>

<!-- ══ empty ══ -->
<div class="scr"><div class="lbl">empty</div>
  <div class="水"></div>
  <div class="pg">
  <div class="nav">← 返回</div>
  <div style="height:var(--s3)"></div>
  <div class="h">饿了。</div>
  <div class="p" style="margin-top:var(--s2)">太久没吃东西，饿的感觉会像潮水一样涨起来。</div>
  <div style="margin-top:auto">
    <div class="kicker">想吃点什么样的</div>
    <div class="list">
      <div class="li">热乎乎的<span class="n">暖</span></div>
      <div class="li">软的、好咽的<span class="n"></span></div>
      <div class="li">有嚼头的<span class="n"></span></div>
      <div class="li">冰冰凉的<span class="n">凉</span></div>
      <div class="li dunno">说不上来<span class="n">›</span></div>
    </div>
    <div class="row sub">下一餐怎么吃<span class="c">›</span></div>
  </div>
</div></div>
</body></html>
