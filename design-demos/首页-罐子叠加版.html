<!doctype html><html lang="zh"><meta charset="utf-8">
<title>退潮 · 首页 · 罐子叠加版</title>
<style>
:root{
  --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#8B8073;
  --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
  --hair:rgba(244,237,227,.09);
  --body:-apple-system,"PingFang SC","Source Han Sans SC",sans-serif;
  --hand:"STXingkai","STKaiti",KaiTi,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0907;font-family:var(--body);color:var(--paper);
     display:flex;gap:44px;padding:52px 48px;align-items:flex-start;flex-wrap:wrap;
     -webkit-font-smoothing:antialiased}
.lab{position:fixed;top:0;left:0;right:0;padding:12px 48px;background:#0b0907ee;
     border-bottom:1px solid #221c15;font-size:13px;color:var(--paper3);z-index:9;backdrop-filter:blur(8px)}
.lab b{color:var(--brass);font-weight:500}
.wrap{margin-top:42px}
.cap{font-size:12.5px;color:var(--paper2);padding:11px 2px 0;line-height:1.55;max-width:390px}
.cap i{color:var(--paper3);font-style:normal;font-size:11.5px}
.ph{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    border:1px solid #262019;box-shadow:0 26px 60px #0007;
    background:radial-gradient(148% 66% at 50% 30%,#241b12 0%,#171208 46%,#0f0c07 100%)}
.in{position:relative;height:100%;padding:46px 28px 24px;display:flex;flex-direction:column}
.day{text-align:center;font-size:10.5px;letter-spacing:.42em;color:var(--paper3);opacity:.7;text-indent:.42em}

/* ── 器物区：居中（这是仪式的一半，对称是它的语法） ── */
.vessel{position:relative;height:262px;margin:6px 0 0}
.halo{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:290px;height:212px;
      border-radius:50%;filter:blur(28px);opacity:.8;
      background:radial-gradient(circle at 42% 62%,#E0906E55,#C9A06340 38%,transparent 70%)}
.lid{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:112px;height:17px;
     border-radius:6px;z-index:3;background:linear-gradient(180deg,rgba(255,246,232,.20),rgba(255,238,214,.07));
     border:1px solid rgba(255,242,224,.16);box-shadow:0 2px 7px #00000055}
.jar{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:196px;height:228px;
     border-radius:20px 20px 82px 82px;overflow:hidden;
     background:linear-gradient(174deg,rgba(255,246,232,.11),rgba(255,238,214,.035) 46%,rgba(255,236,208,.07));
     border:1px solid rgba(255,242,224,.14);
     box-shadow:inset 0 2px 16px rgba(255,244,228,.15),inset 0 -18px 36px rgba(210,145,85,.15),0 18px 46px #000000a6}
.bead{position:absolute;border-radius:50%}
.bead::after{content:'';position:absolute;left:23%;top:15%;width:23%;height:23%;border-radius:50%;
             background:#fffdf8;opacity:.92;box-shadow:0 0 4px #fff8}
.frost{position:absolute;inset:0;z-index:2;backdrop-filter:blur(2px);
       background:linear-gradient(180deg,rgba(255,250,240,.09),rgba(255,246,232,.02) 34%,rgba(255,240,220,.055))}
.pool{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:1;width:96px;height:17px;
      border-radius:50%;filter:blur(6px);background:radial-gradient(circle,#F0BE8055,transparent 72%)}
.taste{text-align:center;position:absolute;left:0;right:0;bottom:6px;z-index:4}
.taste .lbl{font-size:10px;letter-spacing:.34em;color:#E8DCC8;opacity:.95;text-indent:.34em;text-shadow:0 1px 8px #000000bb}
.taste .w{font-family:var(--hand);font-size:33px;color:#FFF0CE;line-height:1.2;margin:4px 0 0;
          text-shadow:0 2px 14px #000000cc,0 0 30px #C9A06355}

/* ── 功能区：左对齐（一条竖线贯穿到底），区间靠距离不靠线 ── */
.zone{margin-top:26px}
.zt{font-size:11px;letter-spacing:.2em;color:var(--paper3);opacity:.82;padding:0 0 9px}
.cells{display:flex;gap:6px;padding:0 0 8px}
.cells i{flex:1;height:34px;border-radius:8px;border:1px solid var(--hair)}
.cells i.on{border-color:rgba(140,193,170,.5);background:rgba(140,193,170,.09)}
.cells i.dash{border-style:dashed;border-color:rgba(203,126,98,.34)}
.why{font-size:12.5px;color:var(--paper3);padding:0 0 6px}
.r{display:flex;align-items:center;justify-content:space-between;padding:9.5px 0}
.r span{font-size:15.5px;color:var(--paper2)}
.r i{font-size:14px;color:var(--paper3);font-style:normal;opacity:.7}

/* 那场：一张卡（原版就是卡，它是唯一会自己变的东西） */
.sess{background:rgba(244,237,227,.045);border:1px solid rgba(244,237,227,.06);
      border-radius:16px;padding:14px 16px;font-family:var(--hand);
      font-size:19px;color:#EBD9BC;letter-spacing:.02em}
.live{display:flex;align-items:center;gap:8px;padding:11px 0 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)}
.live b{font-size:13.5px;color:var(--jade);font-weight:400;letter-spacing:.03em}

.spacer{flex:1;min-height:8px}
/* 急救：一行字 + 一条光 */
.main{text-align:center;margin:14px 0 0}
.main .t{font-size:22px;color:#FFF2E0;letter-spacing:.1em}
.main .ln{width:124px;height:1px;margin:12px auto 0;
          background:linear-gradient(90deg,transparent,#C9A063,transparent)}
.main .s{font-size:13px;color:var(--paper3);margin:11px 0 0}
.foot{display:flex;justify-content:center;gap:26px;padding:14px 0 0}
.foot span{font-size:12.5px;color:var(--clay);opacity:.75}
</style>

<div class=lab>首页 · <b>罐子叠加版</b>　<span style="color:#5a5147">｜罐子回到主角尺寸，「今天的滋味／蒸蛋」压在罐身下半——叠加不排队，省 60px</span></div>

<div class=wrap>
<div class=ph><div class=in>
  <div class=day>八月廿七</div>

  <!-- 区一 · 滋味（器物 + 名字，居中） -->
  <div class=vessel>
    <div class=halo></div><div class=lid></div>
    <div class=jar>
      <div class=pool></div>
      <div class=bead style="left:20px;bottom:16px;width:38px;height:38px;background:radial-gradient(circle at 34% 30%,#EE9B72,#C2603C)"></div>
      <div class=bead style="left:60px;bottom:12px;width:33px;height:33px;background:radial-gradient(circle at 34% 30%,#E8C081,#B98B4C)"></div>
      <div class=bead style="left:96px;bottom:17px;width:34px;height:34px;background:radial-gradient(circle at 34% 30%,#A6DAC0,#6FA48D)"></div>
      <div class=bead style="left:40px;bottom:47px;width:29px;height:29px;background:radial-gradient(circle at 34% 30%,#B6A8D6,#7E739C)"></div>
      <div class=bead style="left:74px;bottom:43px;width:27px;height:27px;background:radial-gradient(circle at 34% 30%,#98BFD4,#66879C)"></div>
      <div class=bead style="left:104px;bottom:49px;width:23px;height:23px;background:radial-gradient(circle at 34% 30%,#EFCB96,#B08C58)"></div>
      <div class=bead style="left:54px;bottom:74px;width:25px;height:25px;background:radial-gradient(circle at 34% 30%,#E2A184,#A66450)"></div>
      <div class=frost></div>
    </div>
    <div class=taste><div class=lbl>今天的滋味</div><div class=w>蒸蛋</div></div>
  </div>

  <!-- 区二 · 记一笔与回头看 -->
  <div class=zone>
    <div class=zt>今天怎么样</div>
    <div class=cells><i></i><i></i><i></i><i class=on></i><i class=dash></i><i></i></div>
    <div class=why>为什么 ›</div>
    <div class=r><span>情绪瓶子</span><i>›</i></div>
    <div class=r><span>昨晚睡得怎么样</span><i>›</i></div>
    <div class=r><span>找个人说说话</span><i>›</i></div>
  </div>

  <!-- 区三 · 那场 -->
  <div class=zone>
    <div class=sess>20:30 · 十五分钟 · 一起坐着</div>
    <div class=live><span class=dot></span><b>此刻 23 人在</b></div>
    <div class=r><span>那场是什么</span><i>›</i></div>
  </div>

  <div class=spacer></div>

  <!-- 区四 · 急救 -->
  <div class=main>
    <div class=t>我现在不太好</div>
    <div class=ln></div>
    <div class=s>试试含一口水，慢慢感受</div>
  </div>
  <div class=foot><span>身体不舒服</span><span>什么时候必须去医院</span></div>
</div></div>
<div class=cap><b>四个区照原版</b>　<i>区一滋味（器物居中）｜区二 今天怎么样·六格·为什么·情绪瓶子·昨晚睡得怎么样·找个人说说话｜区三 那场（20:30 卡·此刻23人在·那场是什么）｜区四 急救。区间靠 26px 距离分，不用分隔线；功能区全部左对齐一条竖线。</i></div>
</div>
</html>
