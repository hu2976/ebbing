<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;700&display=swap">
  <style>
    :root{
      --n1:#171310; --n2:#1F1A15;
      --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#83786A;
      --hair:rgba(244,237,227,.10); --hair2:rgba(244,237,227,.05);
      --brass:#C9A063; --jade:#8CC1AA;
      --disp:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
      --body:"Noto Serif SC","Songti SC",Georgia,serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--n1);color:var(--paper);font-family:var(--body);
      -webkit-font-smoothing:antialiased}
    a{color:var(--brass);text-decoration:none} a:hover{color:#DDBA85}

    /* 呼吸：吸四拍、停一拍、呼六拍。一轮十一秒。
       呼比吸长——这是降低生理唤起的那一半，不是装饰。 */
    .breath{position:relative;width:246px;height:246px;display:flex;
      align-items:center;justify-content:center;margin:0 auto}
    .breath .core, .breath .ring, .breath .halo{
      position:absolute;border-radius:50%;
      animation:inout 11s cubic-bezier(.42,0,.58,1) infinite}
    .breath .halo{width:246px;height:246px;
      background:radial-gradient(circle, rgba(140,193,170,.16) 0%, rgba(140,193,170,0) 68%);
      filter:blur(2px)}
    .breath .ring{width:172px;height:172px;border:1px solid rgba(140,193,170,.34)}
    .breath .core{width:130px;height:130px;
      background:radial-gradient(circle at 38% 32%, rgba(180,222,205,.42), rgba(120,172,152,.16) 52%, rgba(120,172,152,0) 78%);
      box-shadow:0 0 46px -6px rgba(140,193,170,.30)}
    @keyframes inout{
      0%   {transform:scale(.80);opacity:.62}
      36%  {transform:scale(1.10);opacity:1}      /* 吸到顶，四拍 */
      45%  {transform:scale(1.10);opacity:1}      /* 停一拍 */
      100% {transform:scale(.80);opacity:.62}     /* 呼六拍 */
    }
    /* 一圈圈荡开的涟漪 */
    .ripple{position:absolute;width:172px;height:172px;border-radius:50%;
      border:1px solid rgba(140,193,170,.22);animation:out 11s ease-out infinite}
    .ripple:nth-of-type(2){animation-delay:3.6s}
    .ripple:nth-of-type(3){animation-delay:7.2s}
    @keyframes out{
      0%{transform:scale(.82);opacity:0}
      18%{opacity:.5}
      100%{transform:scale(1.46);opacity:0}
    }
    /* 吸 / 呼 两个字交替淡入，和缩放同一节拍 */
    .cue span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:var(--disp);font-size:19px;font-weight:400;letter-spacing:.34em;
      color:var(--jade);animation:cue 11s linear infinite}
    .cue .out{animation-name:cueout}
    @keyframes cue{0%{opacity:0}8%{opacity:.9}34%{opacity:.9}44%{opacity:0}100%{opacity:0}}
    @keyframes cueout{0%{opacity:0}48%{opacity:0}56%{opacity:.9}92%{opacity:.9}100%{opacity:0}}

    @media (prefers-reduced-motion:reduce){
      .breath .core,.breath .ring,.breath .halo,.ripple,.cue span{animation:none}
      .breath .core,.breath .ring,.breath .halo{transform:scale(1)}
      .cue .in{opacity:.9} .cue .out{opacity:0}
    }

    .player{display:flex;align-items:center;gap:13px;border:1px solid rgba(140,193,170,.28);
      border-radius:3px;padding:15px 17px;min-height:56px;cursor:pointer;background:none}
    .bar{flex:1;height:2px;background:rgba(244,237,227,.12);border-radius:2px;position:relative}
    .bar i{position:absolute;left:0;top:0;height:100%;width:34%;background:var(--jade);
      border-radius:2px;display:block}
  </style>
</helmet>

<div style="width:390px;min-height:844px;padding:54px 24px 32px;display:flex;flex-direction:column;gap:20px;background:radial-gradient(120% 58% at 50% 26%, #1E2320 0%, rgba(30,35,32,0) 64%), radial-gradient(110% 50% at 50% -10%, #241E17 0%, rgba(36,30,23,0) 60%), var(--n1)">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#83786A" stroke-width="1.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    <!-- 右上角同时在线人数。屏幕上只有这一个数字。 -->
    <div style="display:flex;align-items:center;gap:7px">
      <span style="width:5px;height:5px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)"></span>
      <span style="font-size:12px;color:var(--jade)">此刻 23 人在</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-family:var(--disp);font-size:32px;font-weight:300;line-height:1.26">正念课程</div>
    <div style="font-size:13px;color:var(--paper2)">十五分钟。跟着做完，结束就结束。</div>
  </div>

  <div style="flex-grow:1;min-height:6px"></div>

  <div class="breath">
    <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
    <span class="halo"></span>
    <span class="ring"></span>
    <span class="core"></span>
    <span class="cue"><span class="in">吸</span><span class="out">呼</span></span>
  </div>

  <div style="text-align:center;font-size:12px;color:var(--paper3);letter-spacing:.06em">
    吸四拍 · 停一拍 · 呼六拍
  </div>

  <div style="flex-grow:1;min-height:6px"></div>

  <button class="player">
    <svg width="13" height="15" viewBox="0 0 13 15" fill="#8CC1AA"><path d="M0 0l13 7.5L0 15z"/></svg>
    <span style="font-family:var(--disp);font-size:16px;color:var(--paper2);flex:none">跟着呼吸 · 15:00</span>
    <span class="bar"><i></i></span>
  </button>

  <div style="display:flex;flex-direction:column;gap:13px;border-top:1px solid var(--hair2);padding-top:16px">
    <div style="font-size:10px;letter-spacing:.22em;color:var(--paper3)">引导词</div>
    <div style="font-family:var(--disp);font-size:17px;line-height:1.9;color:var(--paper);display:flex;flex-direction:column;gap:9px">
      <span>先把手放在能碰到的地方。</span>
      <span>吸气的时候，注意胸口在动。</span>
      <span>呼气比吸气长一点就好，不用数。</span>
      <span>走神了是正常的。发现走神，就回到胸口。</span>
    </div>
  </div>

  <div style="font-size:11px;line-height:1.85;color:var(--paper3);border-top:1px solid var(--hair2);padding-top:13px">
    不说话 · 不显示别人 · 结束不评分。<br>
    身体扫描走到躯干只说「胸口在动」，不说腰腹腿。
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
