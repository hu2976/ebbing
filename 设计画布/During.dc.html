<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;700&display=swap">
  <style>
    :root{
      --n1:#171310; --n2:#1F1A15;
      --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#83786A;
      --hair:rgba(244,237,227,.10); --hair2:rgba(244,237,227,.05);
      --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
      --disp:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
      --body:"Noto Serif SC","Songti SC",Georgia,serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--n1);color:var(--paper);font-family:var(--body);
      -webkit-font-smoothing:antialiased}
    a{color:var(--brass);text-decoration:none} a:hover{color:#DDBA85}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    @keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
  </style>
</helmet>

<!-- 急性期这一屏最安静：字更大、留白更多、元素最少。 -->
<div style="width:390px;min-height:844px;padding:54px 26px 32px;display:flex;flex-direction:column;gap:22px;background:radial-gradient(130% 60% at 50% -12%, #272017 0%, rgba(39,32,23,0) 66%), var(--n1)">

  <div style="font-size:11px;letter-spacing:.2em;color:var(--paper3)">正在吃</div>

  <div style="font-family:var(--disp);font-size:31px;font-weight:300;line-height:1.44;letter-spacing:.005em">
    吃着就行。<br>一次不会定下什么。
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;font-family:var(--disp);font-size:19px;font-weight:400;line-height:1.8;color:var(--paper)">
    <div>开着灯，用一只碗。包装可以先扔。</div>
    <div>这一页就停在这儿。</div>
  </div>

  <!-- 先说现象，再说它是水。顺序反过来才看得懂。 -->
  <div style="background:var(--n2);border-radius:3px;padding:17px 18px;font-family:var(--disp);font-size:17px;line-height:1.85;color:var(--paper2)">
    今天之后可能会觉得肿，秤上也会重一点。<br><span style="color:var(--paper)">那是水，几天就下去了。</span>
  </div>

  <div style="flex-grow:1;min-height:10px"></div>

  <!-- 屏幕上只有一个数字。孤独是情绪失调通向暴食病理的中介变量，
       这个数字是在不暴露任何人的前提下对它下手。所以只给数字，不画别人。 -->
  <div style="display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;padding:6px 0 2px">
    <div style="display:flex;align-items:center;gap:9px">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 10px var(--jade);animation:breathe 4.5s ease-in-out infinite"></span>
      <span style="font-family:var(--disp);font-size:24px;font-weight:400;color:var(--jade)">现在这一页上，还有 12 个人</span>
    </div>
    <div style="font-size:13px;color:var(--paper3)">谁也不知道谁是谁。</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px">
    <button style="cursor:pointer;background:none;border:1px solid rgba(203,126,98,.5);border-radius:3px;min-height:56px;padding:16px;font-family:var(--disp);font-size:18px;color:var(--clay)">身体不太对</button>
    <button style="cursor:pointer;background:none;border:1px solid var(--hair);border-radius:3px;min-height:48px;padding:13px;font-family:var(--body);font-size:14px;color:var(--paper2)">吃完了</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
