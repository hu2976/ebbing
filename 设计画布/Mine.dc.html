<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;700&display=swap">
  <style>
    :root{
      --n1:#171310; --n2:#1F1A15;
      --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#83786A;
      --hair:rgba(244,237,227,.10); --hair2:rgba(244,237,227,.05);
      --brass:#C9A063;
      --disp:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
      --body:"Noto Serif SC","Songti SC",Georgia,serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--n1);color:var(--paper);font-family:var(--body);
      -webkit-font-smoothing:antialiased}
    a{color:var(--brass);text-decoration:none} a:hover{color:#DDBA85}
    /* 层 1 的入口不低于 64px、占满宽。理由不是好看，是三点钟的手指不精确。 */
    .way{cursor:pointer;text-align:left;background:linear-gradient(168deg,#26201A 0%,#1D1813 100%);
      border:1px solid rgba(244,237,227,.13);border-radius:3px;min-height:78px;
      padding:22px 22px;font-family:var(--disp);font-size:22px;font-weight:400;
      color:var(--paper);letter-spacing:.02em;
      display:flex;align-items:center;justify-content:space-between;gap:12px}
    .way:hover{border-color:rgba(201,160,99,.5)}
    .way svg{flex:none;opacity:.42}
  </style>
</helmet>

<div style="width:390px;min-height:844px;padding:54px 26px 32px;display:flex;flex-direction:column;gap:20px;background:radial-gradient(130% 58% at 50% -12%, #2A2219 0%, rgba(42,34,25,0) 66%), var(--n1)">

  <div style="display:flex;align-items:center;gap:11px">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#83786A" stroke-width="1.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <!-- 「你来了」只在这里出现，不在首页——首页不预设你是为暴食来的。 -->
  <div style="font-family:var(--disp);font-size:36px;font-weight:300;line-height:1.24;padding-top:6px">你来了。</div>

  <div style="flex-grow:1;min-height:20px"></div>

  <div style="display:flex;flex-direction:column;gap:11px">
    <button class="way">正在吃
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="way">很想吃
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="way">吃完了
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <!-- 第四支给全类别留口：这句话不预设是暴食，
       限制型、回避型、夜食的人都能说。 -->
  <button style="cursor:pointer;background:none;border:1px solid var(--hair);border-radius:3px;min-height:52px;padding:15px;font-family:var(--body);font-size:15px;color:var(--paper2)">吃不下 · 说不上来</button>

  <div style="flex-grow:1;min-height:16px"></div>

  <div style="display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair2);padding-top:14px">
    <span style="font-size:12px;color:var(--paper3)">身体不舒服</span>
    <span style="font-size:12px;color:rgba(203,126,98,.78)">什么时候必须去医院</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
