<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;700&display=swap">
  <style>
    :root{
      --n1:#171310; --n2:#1F1A15;
      --paper:#F4EDE3; --paper2:#BDB1A1; --paper3:#83786A;
      --hair:rgba(244,237,227,.10); --hair2:rgba(244,237,227,.05);
      --brass:#C9A063; --jade:#8CC1AA; --clay:#CB7E62;
      --disp:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
      --body:"Noto Serif SC","Songti SC",Georgia,serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--n1);color:var(--paper);font-family:var(--body);
      -webkit-font-smoothing:antialiased}
    a{color:var(--brass);text-decoration:none} a:hover{color:#DDBA85}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    @keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    /* 热气：只在白天出现。文案里写着「很烫」，那就让它烫。 */
    @keyframes steam{
      0%{opacity:0;transform:translateY(6px) scaleX(1)}
      22%{opacity:.5}
      70%{opacity:.22}
      100%{opacity:0;transform:translateY(-26px) scaleX(1.5)}
    }
    .steam path{animation:steam 7.5s ease-out infinite}
    .steam path:nth-child(2){animation-delay:2.4s}
    .steam path:nth-child(3){animation-delay:4.7s}

    /* 材质条：抽象的焦皮与橙芯，不是一盘菜的写实图。
       写实的食物图会把线索做强，而这一层唯一的真风险就是线索。 */
    .mat{position:relative;height:118px;overflow:hidden;border-radius:2px 2px 0 0}
    .mat svg{display:block;width:100%;height:100%}

    .cells{display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:6px}
    .cells i{height:38px;border-radius:2px;display:block;border:1px solid rgba(244,237,227,.22)}
    .cells i.on{border-color:rgba(140,193,170,.7);background:rgba(140,193,170,.07)}
    .cells i.e{border-style:dashed;border-color:rgba(244,237,227,.10)}
    .q{cursor:pointer;background:none;border:1px solid var(--hair);border-radius:3px;
      min-height:46px;padding:12px;font-family:var(--body);font-size:14px;color:var(--paper2);
      text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .q:hover{color:var(--paper);border-color:rgba(244,237,227,.24)}
  </style>
</helmet>

<div style="width:390px;min-height:844px;padding:54px 24px 32px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(120% 55% at 50% -10%, #251E17 0%, rgba(37,30,23,0) 62%), var(--n1)">

  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <div style="font-family:var(--disp);font-size:19px;font-weight:500;letter-spacing:.16em;color:var(--brass)">退潮</div>
    <div style="font-size:11px;letter-spacing:.14em;color:var(--paper3)">八月二十一日 · 上午</div>
  </div>

  <!-- 白天：滋味展开，带材质。汪曾祺六条——感觉不做主语、先动作后感觉、不用比喻、句子短。 -->
  <div style="border:1px solid var(--hair);border-radius:3px;overflow:hidden;display:flex;flex-direction:column">
    <div class="mat">
      <svg viewBox="0 0 342 118" preserveAspectRatio="none" role="img" aria-label="烤红薯的材质：焦裂的皮和里面的橙芯">
        <defs>
          <!-- 焦皮的碎裂纹理 -->
          <filter id="char" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.052 0.11" numOctaves="4" seed="11"/>
            <feColorMatrix type="saturate" values="0"/>
          </filter>
          <!-- 芯里的纤维，横向拉长 -->
          <filter id="fiber" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.014 0.42" numOctaves="3" seed="5"/>
            <feColorMatrix type="saturate" values="0"/>
          </filter>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
          </filter>
          <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
          <linearGradient id="skin" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#2C2016"/>
            <stop offset="46%" stop-color="#1B120C"/>
            <stop offset="100%" stop-color="#241A11"/>
          </linearGradient>
          <radialGradient id="core" cx="50%" cy="52%" r="58%">
            <stop offset="0%" stop-color="#FFC97E"/>
            <stop offset="34%" stop-color="#E88F3A"/>
            <stop offset="72%" stop-color="#B45A18"/>
            <stop offset="100%" stop-color="#6E320D"/>
          </radialGradient>
          <!-- 裂口：不规则，两头收尖 -->
          <clipPath id="split">
            <path d="M-8 66 C 42 40, 78 74, 116 56 C 152 39, 186 70, 224 55 C 262 40, 300 68, 350 48 L 350 82 C 300 96, 262 72, 224 88 C 186 104, 152 76, 116 92 C 78 108, 42 78, -8 100 Z"/>
          </clipPath>
        </defs>

        <!-- 皮 -->
        <rect width="342" height="118" fill="url(#skin)"/>
        <rect width="342" height="118" filter="url(#char)" opacity=".26" style="mix-blend-mode:overlay"/>

        <!-- 裂口后面的一团热光，让橙色像是从里面透出来的 -->
        <ellipse cx="171" cy="70" rx="128" ry="26" fill="#C2611B" opacity=".5" filter="url(#soft)"/>

        <!-- 橙芯 -->
        <g clip-path="url(#split)">
          <rect width="342" height="118" fill="url(#core)"/>
          <rect width="342" height="118" filter="url(#fiber)" opacity=".2" style="mix-blend-mode:soft-light"/>
        </g>

        <!-- 裂口边缘那一线焦黑 -->
        <g clip-path="url(#split)" opacity=".55">
          <path d="M-8 66 C 42 40, 78 74, 116 56 C 152 39, 186 70, 224 55 C 262 40, 300 68, 350 48"
                fill="none" stroke="#1A1009" stroke-width="7" filter="url(#soft2)"/>
          <path d="M-8 100 C 42 78, 78 108, 116 92 C 152 76, 186 104, 224 88 C 262 72, 300 96, 350 82"
                fill="none" stroke="#1A1009" stroke-width="7" filter="url(#soft2)"/>
        </g>

        <!-- 热气 -->
        <g class="steam" fill="none" stroke="#F4EDE3" stroke-width="2" stroke-linecap="round" opacity=".38" filter="url(#soft2)">
          <path d="M92 46 C 86 34, 100 28, 94 16"/>
          <path d="M176 42 C 169 29, 184 23, 177 10"/>
          <path d="M254 48 C 248 36, 262 30, 256 18"/>
        </g>

        <!-- 底部压暗，接住下面的文字 -->
        <rect y="72" width="342" height="46" fill="url(#fadeb)"/>
        <defs><linearGradient id="fadeb" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1F1A15" stop-opacity="0"/>
          <stop offset="100%" stop-color="#1F1A15" stop-opacity=".92"/>
        </linearGradient></defs>
      </svg>
    </div>

    <div style="background:var(--n2);padding:15px 19px 17px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:10px;letter-spacing:.22em;color:var(--paper3)">今天的滋味</div>
      <div style="font-family:var(--disp);font-size:27px;font-weight:400;color:var(--brass)">烤红薯</div>
      <div style="font-family:var(--disp);font-size:17px;line-height:1.88;color:var(--paper)">
        皮焦得裂开一道口子，里面是橙的。很烫，要在两只手之间倒来倒去。越靠里越甜。
      </div>
      <div style="font-size:12px;color:var(--paper3);padding-top:2px">想到什么都行。</div>
    </div>
  </div>

  <!-- 层 2 -->
  <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--hair2);padding-top:16px">
    <div style="font-size:10px;letter-spacing:.22em;color:var(--paper3)">今天怎么样</div>
    <div class="cells"><i></i><i></i><i></i><i class="on"></i><i class="e"></i><i class="e"></i></div>
    <button class="q">记一个词：滋味 / 心情<span style="color:var(--paper3)">›</span></button>
    <button class="q">情绪瓶子<span style="color:var(--paper3)">›</span></button>
    <button class="q">昨晚睡得怎么样<span style="color:var(--paper3)">›</span></button>
  </div>

  <!-- 层 3 -->
  <div style="border-top:1px solid var(--hair2);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:flex-end;gap:8px">
        <span style="font-family:var(--disp);font-size:27px;font-weight:300;line-height:1">20:30</span>
        <span style="font-size:12px;color:var(--paper2);padding-bottom:3px">一起正念 · 十五分钟</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px">
        <span style="width:5px;height:5px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade);animation:breathe 4.5s ease-in-out infinite"></span>
        <span style="font-size:12px;color:var(--jade)">此刻 23 人在</span>
      </div>
    </div>
    <span style="color:var(--paper3)">›</span>
  </div>

  <!-- 层 1 主体 -->
  <button style="cursor:pointer;background:linear-gradient(165deg,#2E251C 0%,#231D16 100%);border:1px solid rgba(201,160,99,.42);border-radius:3px;min-height:70px;padding:19px;font-family:var(--disp);font-size:21px;font-weight:400;color:var(--paper);letter-spacing:.03em;box-shadow:0 14px 30px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(244,237,227,.05)">我现在不太好</button>

  <!-- 层 4：虚线供给层 1。排最下面，字最小——滚动本身就编码了紧急程度。 -->
  <div style="display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--hair2);padding-top:15px">
    <div style="font-size:10px;letter-spacing:.22em;color:var(--paper3);margin-bottom:3px">平时练的</div>
    <span style="font-size:13px;color:var(--paper2)">留一句给夜里</span>
    <span style="font-size:13px;color:var(--paper2)">试试含一口水，慢慢感受</span>
    <span style="font-size:13px;color:var(--paper2)">答两个问题 · 设置</span>
  </div>

  <div style="flex-grow:1;min-height:8px"></div>

  <div style="display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair2);padding-top:14px">
    <span style="font-size:12px;color:var(--paper3)">身体不舒服</span>
    <span style="font-size:12px;color:rgba(203,126,98,.78)">什么时候必须去医院</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
